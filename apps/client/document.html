<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fub — documento</title>
    <!-- Lo strato d'avvio, prima di ogni altro script: i caratteri del marchio,
         il suo foglio (luce e colori dal primo disegno, anche senza JS), quello
         per chi ha il JS spento e i due script classici di public/avvio/. È lo
         stesso nelle tre pagine. Le pagine non hanno elementi style in linea:
         public/avvio/avvio.css dice perché. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/newsreader-latin-opsz-italic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-grotesk-latin-wght-normal.woff2" />
    <link rel="stylesheet" id="avvio-stile" href="/avvio/avvio.css" />
    <noscript><link rel="stylesheet" href="/avvio/senza-js.css" /></noscript>
    <script src="/avvio/luce.js"></script>
    <script defer src="/avvio/stati.js"></script>
  </head>
  <body>
    <!-- Lo strato d'avvio: copre la pagina dal primo disegno fino alla
         consegna (src/avvio/consegna.ts), che lo toglie e rende viva l'app.
         I tempi, i testi salvati e il guasto li tiene /avvio/stati.js; la
         fase e il nome li scrive l'avvio su data-fase e data-nome. -->
    <div id="avvio" class="avvio" data-stato="avvio" role="region" aria-labelledby="avvio-regione">
      <span id="avvio-regione" data-i18n="app.avvio.regione" hidden>Avvio di Fub</span>
      <div class="avvio-velo"></div>
      <div class="avvio-colonna">
        <div class="avvio-posto">
          <div class="avvio-marchio" aria-hidden="true">
            <span class="avvio-glifo">f</span>
            <span class="avvio-segnale"></span>
          </div>
        </div>
        <div class="avvio-info">
          <div class="avvio-pannello avvio-attesa">
            <p class="avvio-fase" id="avvio-fase"><span>Carico Fub…</span><span class="avvio-nome" id="avvio-nome"></span><span></span></p>
            <div class="avvio-traccia" aria-hidden="true"><span class="avvio-scia"></span></div>
            <div class="avvio-lento">
              <p class="avvio-lento-testo" data-i18n="app.avvio.lento">Ci vuole più del solito.</p>
            </div>
          </div>
          <div class="avvio-pannello avvio-guasto">
            <p class="avvio-titolo" id="avvio-titolo" data-i18n="app.avvio.guasto">Fub non è partito</p>
            <p class="avvio-motivo" id="avvio-motivo"></p>
            <div class="avvio-azioni">
              <button type="button" class="avvio-btn" data-kind="primary" id="avvio-riprova" data-i18n="app.retry" aria-describedby="avvio-titolo avvio-motivo">Riprova</button>
              <button type="button" class="avvio-btn" id="avvio-copia" data-i18n="app.avvio.copia" hidden>Copia i dettagli</button>
            </div>
          </div>
        </div>
        <p class="avvio-senza-js" data-i18n="app.avvio.senza_js">Fub ha bisogno di JavaScript per partire.</p>
      </div>
      <p class="avvio-annuncio" id="avvio-annuncio" role="status"></p>
    </div>
    <!-- La finestra documento sui ganci dello Scrittoio: un foglio solo, con la
         sua linguetta e la sua testata, come quelli della finestra principale.
         Gli id di `document.html` ci sono tutti e fanno lo stesso mestiere; gli
         altri sono del foglio. I testi li scrive l'ingresso. Il titolo della
         pagina è per chi ascolta: prende il nome del documento. -->
    <main id="document-window" class="document-window-root" inert aria-busy="true">
      <h1 id="document-window-heading" class="sr-only">Fub</h1>
      <section id="document-window-sheet" class="pane focus document-window-sheet">
        <div class="pane-tabs">
          <div id="document-window-tabs" role="tablist" aria-owns="document-window-tab"></div>
          <div class="tab-entry">
            <button
              id="document-window-tab"
              class="tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="document-window-panel"
            >
              <span id="document-window-name" class="tab-name"></span>
            </button>
          </div>
        </div>
        <div class="pane-toolbar">
          <span id="document-window-path" class="muted"></span>
          <span class="pane-status-slot">
            <span id="document-window-link" class="save-state document-window-link"></span>
          </span>
        </div>
        <p id="document-window-state" class="document-window-notice" role="status" aria-live="polite"></p>
        <div id="document-window-conflict" class="document-window-conflict" hidden>
          <button id="document-window-keep" class="kit-button" data-kind="primary" type="button"></button>
          <button id="document-window-discard" class="kit-button" type="button"></button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/shells/scrittoio/document/entry.ts"></script>
  </body>
</html>
