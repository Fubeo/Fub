<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fub</title>
  </head>
  <body>
    <!-- Il salto al contenuto (§12.4). È il primo elemento del documento e si
         vede solo quando prende il fuoco: senza, chi naviga da tastiera deve
         attraversare la topbar, la ricerca e l'intero albero delle note — che
         su un vault vero sono centinaia di fermate — prima di arrivare al
         posto dove si scrive. -->
    <a href="#panes" class="skip-link" data-i18n="app.skip_to_editor">Vai all'editor</a>
    <div id="app" class="app">
      <header id="topbar" class="titlebar" data-tauri-drag-region="deep">
        <!-- A sinistra: il marchio, che apre il menu dell'applicazione; il
             vault aperto; indietro e avanti del foglio a fuoco. -->
        <div id="titlebar-left" class="titlebar-side titlebar-side--left" data-tauri-drag-region="deep">
          <button
            id="brand-menu"
            type="button"
            class="brand-mark"
            data-i18n-label="frame.app_menu"
            data-i18n-title="frame.app_menu"
            aria-label="Menu di Fub"
            aria-expanded="false"
            aria-controls="app-menu"
          ><span class="brand-glyph" aria-hidden="true">f</span></button>
          <!-- `#app-menu-toggle` e `#open-vault` restano come manici: il
               registro dei comandi e `ui/titlebar.ts` li cercano per id. Non
               si vedono mai: il menu si apre dal marchio. -->
          <button id="app-menu-toggle" type="button" class="app-menu-toggle" data-i18n-label="app.menu" aria-label="Menu" hidden></button>
          <nav id="app-menu" class="app-menu" role="menubar" data-i18n-label="region.menu" aria-label="Menu applicazione"></nav>
          <button id="open-vault" data-i18n="app.open_vault" hidden type="button">Apri vault…</button>
          <button
            id="vault-chip"
            type="button"
            class="vault-chip"
            data-i18n-label="frame.vault_chip"
            aria-label="Apri un vault"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <!-- Il nome vero lo scrive `frame/vault-chip.ts`, che sa quale
                 vault è aperto; la chiave qui è il ripiego, e a ogni cambio di
                 lingua il modulo riscrive dopo `applyStrings`. -->
            <span id="vault-chip-icon" class="vault-chip-icon" aria-hidden="true"></span>
            <span id="vault-path" class="vault-chip-name"></span>
            <span id="vault-chip-none" class="vault-chip-none" data-i18n="app.open_vault" hidden>Apri vault…</span>
            <span class="vault-chip-caret" aria-hidden="true"></span>
          </button>
          <span id="frame-nav" class="frame-nav" role="group" data-i18n-label="frame.nav" aria-label="Cronologia del foglio">
            <button id="nav-back" type="button" class="titlebar-btn titlebar-btn--icon" data-i18n-label="menu.go.back" aria-label="Indietro"></button>
            <button id="nav-forward" type="button" class="titlebar-btn titlebar-btn--icon" data-i18n-label="menu.go.forward" aria-label="Avanti"></button>
          </span>
          <!-- Le view che dichiarano ViewSurface::Menu. -->
          <div id="app-menu-extra" data-tauri-drag-region="deep"></div>
        </div>
        <!-- Al centro: la pillola. A riposo dice dove sei; premuta, diventa
             il lanciatore. -->
        <div id="titlebar-center" class="titlebar-center" data-tauri-drag-region="deep">
          <button
            id="pill"
            type="button"
            class="pill"
            data-i18n-label="frame.pill"
            aria-label="Apri, cerca, comanda"
            aria-haspopup="dialog"
          >
            <span id="pill-icon" class="pill-icon" aria-hidden="true"></span>
            <span id="pill-path" class="pill-path"></span>
            <span id="pill-title" class="pill-title">Apri, cerca, comanda…</span>
            <kbd id="pill-key" class="titlebar-shortcut" aria-hidden="true"></kbd>
          </button>
          <!-- Il manico del vecchio trigger di ricerca: la shell comune lo
               abilita e lo spegne col vault, e il lanciatore non lo usa. -->
          <button id="command-search" type="button" data-i18n-label="command-search.placeholder" aria-label="Cerca nel vault…" hidden>
            <kbd id="command-search-key" hidden></kbd>
          </button>
        </div>
        <!-- A destra: lavori in corso, avvisi, l'ispettore, e i controlli
             della finestra. I bottoni nascono vuoti: icona, conteggio e nome
             li scrive chi conosce lo stato. -->
        <div id="titlebar-right" class="titlebar-side">
          <button
            id="activity-button"
            type="button"
            class="titlebar-btn titlebar-btn--icon"
            data-i18n-label="activity.title"
            aria-label="Attività"
            aria-expanded="false"
            aria-controls="activity-panel"
            data-i18n-title="activity.hint"
          ></button>
          <button
            id="notify-button"
            type="button"
            class="titlebar-btn titlebar-btn--icon"
            data-i18n-label="notices.title"
            aria-label="Avvisi"
            aria-expanded="false"
            aria-controls="notify-panel"
            data-i18n-title="notices.hint"
          ></button>
          <button
            id="toggle-inspector"
            type="button"
            class="titlebar-btn titlebar-btn--icon"
            data-i18n-label="menu.view.inspector"
            data-i18n-title="menu.view.inspector"
            aria-label="Mostra o nascondi l'ispettore"
            aria-pressed="false"
            aria-controls="right-pane"
          ></button>
          <button id="open-palette" type="button" data-i18n-label="commands.palette" aria-label="Apri la palette dei comandi" hidden></button>
          <span id="window-controls" class="window-controls" role="group" data-i18n-label="region.window_controls" aria-label="Controlli finestra">
            <button id="win-min" type="button" class="win-ctrl" data-i18n-label="window.min" aria-label="Minimizza"></button>
            <button id="win-max" type="button" class="win-ctrl" data-i18n-label="window.max" aria-label="Ingrandisci"></button>
            <button id="win-close" type="button" class="win-ctrl win-ctrl--close" data-i18n-label="window.close" aria-label="Chiudi"></button>
          </span>
        </div>
      </header>
      <main id="workspace">
        <h1 id="app-heading" class="sr-only">Fub</h1>
        <!-- Il binario: sceglie che cosa mostra il cassetto sinistro. Le
             icone della shell le monta `panels/rail.ts` dentro `#rail-shell`;
             le view dichiarate le appende `ui/views.ts` dopo di loro. In
             fondo, ciò che non dipende dal vault: aiuto, preferenze, luce.
             Stanno fuori dalla barra degli strumenti perché `panels/rail.ts`
             appende in coda a `#views-ribbon`: dentro, finirebbero prima
             delle icone nell'ordine del fuoco e dopo in quello che si vede. -->
        <div id="rail" class="rail">
          <div
            id="views-ribbon"
            class="rail-main views-ribbon"
            role="toolbar"
            aria-orientation="vertical"
            data-i18n-label="region.rail"
            aria-label="Navigazione"
          >
            <div id="rail-shell" class="rail-shell"></div>
          </div>
          <div id="rail-foot" class="rail-foot" role="group" data-i18n-label="frame.rail_foot" aria-label="Aiuto e preferenze">
            <button id="open-help" type="button" class="rail-btn" data-i18n-label="frame.help" aria-label="Aiuto" aria-haspopup="menu" aria-expanded="false"></button>
            <button id="open-settings" type="button" class="rail-btn" data-i18n-title="app.settings.hint" data-i18n-label="app.settings" aria-label="Impostazioni"></button>
            <button id="toggle-light" type="button" class="rail-btn" data-i18n-label="commands.light.toggle" aria-label="Cambia luce"></button>
          </div>
          <span id="rail-notch" class="rail-notch" aria-hidden="true" hidden></span>
        </div>
        <div id="layout" class="desk">
        <aside id="sidebar" class="sidebar" data-panel="files" data-i18n-label="region.notes" aria-label="Note e ricerca">
          <input
            id="search-input"
            class="search-input"
            type="search"
            data-i18n-placeholder="search.placeholder"
            placeholder="Cerca nel vault…"
            data-i18n-label="search.hint"
            aria-label="Cerca nel vault"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="search-panel" hidden>
            <div
              class="panel-title"
              id="search-summary"
              role="heading"
              aria-level="2"
              data-i18n="search.results"
            >
              Risultati
            </div>
            <ul id="search-results" class="plain-list search-results" role="list"></ul>
          </div>
          <div id="files-panel" class="files-panel">
            <div id="space-strip" class="space-strip"></div>
            <div class="panel-title" id="files-title" role="heading" aria-level="2">
              <span id="space-title" class="space-title">Note</span>
              <button
                id="new-note"
                class="link-button"
                data-i18n="explorer.new"
                data-i18n-title="explorer.new.hint"
              >
                + Nuova
              </button>
            </div>
            <div class="panel-title" id="pinned-title" role="heading" aria-level="2" hidden>
              <span data-i18n="explorer.pinned">Appuntate</span>
            </div>
            <ul id="pinned-list" class="plain-list" role="list" hidden></ul>
            <ul
              id="file-list"
              class="plain-list"
              role="tree"
              data-i18n-label="explorer.notes.hint"
              aria-label="Note del vault"
            ></ul>
          </div>
          <div id="views-left"></div>
          <div
            id="sidebar-scrim"
            class="drawer-scrim"
            data-drawer-scrim="sidebar"
            hidden
          ></div>
        </aside>
        <div
          id="divider-sidebar"
          class="layout-divider"
          role="separator"
          aria-orientation="vertical"
          data-i18n-label="layout.divider.sidebar"
          aria-label="Ridimensiona la barra laterale"
          tabindex="0"
        ></div>
        <!-- L'area principale: **vuota nell'HTML**, e non per pigrizia.
             Fino a ieri qui c'erano un editor e un'anteprima, uno ciascuno, ed
             era il modello di layout scritto in un file statico: due riquadri
             non si potevano avere perché non c'era dove metterli. Adesso i
             riquadri li disegna `panels/document.ts` dall'albero che
             `state/layout.ts` tiene — quanti sono e come sono disposti è uno
             stato che si ricorda fra un avvio e l'altro, e uno stato non si
             scrive nel markup. -->
        <section
          id="panes"
          class="panes"
          tabindex="-1"
          data-i18n-label="region.document"
          aria-label="Documento"
        >
          <!-- Schermata senza vault (A01): titolo, spiegazione, CTA primaria
               + secondaria, recenti reali dall'host, stato di apertura/errore.
               Nascosta quando un vault è aperto: `desktop-shell.ts` la mostra
               solo a `state.vaultRoot` vuoto. -->
          <div id="onboarding" class="onboarding" hidden>
            <h2 id="onboarding-title" data-i18n="onboarding.title">Apri il tuo spazio di lavoro</h2>
            <p id="onboarding-detail" data-i18n="onboarding.detail">Un vault è una cartella di file sul tuo dispositivo</p>
            <div class="onboarding-actions">
              <button id="onboarding-open" class="primary" type="button" data-i18n="app.open_vault">Apri vault…</button>
              <button id="onboarding-create" type="button" data-i18n="onboarding.create">Crea un vault nuovo…</button>
              <button id="onboarding-settings" type="button" data-i18n="app.settings">Impostazioni</button>
            </div>
            <p id="onboarding-status" class="onboarding-status" role="status" hidden></p>
            <div id="onboarding-error" class="onboarding-error" hidden>
              <p id="onboarding-error-text"></p>
              <div class="onboarding-actions">
                <button id="onboarding-retry" type="button" data-i18n="app.retry">Riprova</button>
                <button id="onboarding-choose" type="button" data-i18n="app.open_vault">Apri vault…</button>
              </div>
            </div>
            <div id="onboarding-recent-wrap" hidden>
              <h3 id="onboarding-recent-title" data-i18n="onboarding.recent">Vault recenti</h3>
              <ul id="onboarding-recent" class="plain-list onboarding-recent" role="list"></ul>
            </div>
          </div>
        </section>
        <div
          id="divider-inspector"
          class="layout-divider"
          role="separator"
          aria-orientation="vertical"
          data-i18n-label="layout.divider.inspector"
          aria-label="Ridimensiona l'ispettore"
          tabindex="0"
        ></div>
        <section id="right-pane" class="inspector inspector-pane" data-i18n-label="inspector.region" aria-label="Ispettore">
          <!-- Le view dichiarative (Struttura, Tag, Backlink, …) si montano
               qui per placement: gli id e i titoli li dichiara il backend.
               L'inspector a tab — una view alla volta — lo costruisce
               `ui/views.ts` sopra questo contenitore. -->
          <div id="views-right"></div>
          <div
            id="inspector-scrim"
            class="drawer-scrim"
            data-drawer-scrim="inspector"
            hidden
          ></div>
        </section>
        <section
          id="views-bottom"
          class="views-bottom"
          data-i18n-label="region.bottom"
          aria-label="Pannelli in basso"
          hidden
        ></section>
        </div>
      </main>
      <!-- Lo stato del documento a fuoco. `panels/document.ts` porta questo
           gruppo nella testata del foglio col fuoco; qui resta solo finché non
           c'è un foglio. Senza `data-i18n`: il testo lo scrive chi conosce lo
           stato. -->
      <div id="pane-status" class="pane-status" hidden>
        <span id="save-state" class="save-state" role="status"></span>
      </div>
      <!-- La banda di stato: a sinistra ciò che riguarda il vault, a destra
           ciò che riguarda il foglio a fuoco. Le view dichiarate sulla
           superficie di stato stanno in mezzo. -->
      <footer id="status-band" class="status-band" data-i18n-label="region.statusbar" aria-label="Barra di stato">
        <div id="status-start" class="status-side">
          <span id="status-index" class="status-item" role="status" hidden></span>
          <span id="status-saving" class="status-item" role="status" hidden></span>
        </div>
        <div
          id="views-status"
          class="views-status"
          role="region"
          data-i18n-label="region.status"
          aria-label="Stato dei componenti"
          hidden
        ></div>
        <div id="status-end" class="status-side status-side--end">
          <span id="status-mode" class="status-item" hidden></span>
          <button id="status-fit-width" type="button" class="status-item status-item--button" aria-pressed="false" hidden></button>
          <button id="status-fit-page" type="button" class="status-item status-item--button" aria-pressed="false" hidden></button>
          <button id="status-zoom" type="button" class="status-item status-item--button" hidden>100%</button>
        </div>
      </footer>
      <!-- «Sto aspettando il tasto successivo» (§18.2). Vive due secondi e
           galleggia in basso al centro: chi ha premuto `Mod-k` deve poter
           vedere che l'app ha capito. Lo riempie `ui/keyboard.ts`. -->
      <span id="key-pending" class="key-pending" role="status" hidden></span>
      <div
        id="activity-panel"
        class="dock-panel dock-panel--activity"
        role="region"
        data-i18n-label="activity.title"
        aria-label="Attività"
        hidden
      >
        <div class="panel-title" role="heading" aria-level="2">
          <span data-i18n="activity.title">Attività</span>
          <button
            id="activity-close"
            class="link-button"
            data-i18n="app.close"
            data-i18n-title="app.close"
          >
            Chiudi
          </button>
        </div>
        <ul id="activity-list" class="plain-list" role="list"></ul>
      </div>
      <!-- Gli avvisi si **annunciano**: è l'unica superficie che dice qualcosa
           che l'utente non ha chiesto, e `aria-live="polite"` è ciò che la fa
           arrivare anche a chi non la sta guardando — al primo momento in cui
           non sta leggendo altro, che è quello che «polite» significa. -->
      <div
        id="notify-panel"
        class="dock-panel dock-panel--notify"
        role="region"
        data-i18n-label="notices.title"
        aria-label="Avvisi"
        hidden
      >
        <div class="panel-title" role="heading" aria-level="2">
          <span data-i18n="notices.title">Avvisi</span>
          <button
            id="notify-clear"
            class="link-button"
            data-i18n="notices.clear"
            data-i18n-title="notices.clear.hint"
          >
            Pulisci
          </button>
          <button
            id="notify-close"
            class="link-button"
            data-i18n="app.close"
            data-i18n-title="app.close"
          >
            Chiudi
          </button>
        </div>
        <ul id="notify-list" class="plain-list notify-list" role="list"></ul>
      </div>
      <!-- Il pannello delle impostazioni (§11.1). Le quattro schede sono le
           cose che questa voce fa esistere: la configurazione (form generato
           dallo schema che i componenti dichiarano), i componenti accesi e
           spenti, le scorciatoie e i vault che questa macchina conosce —
           l'elenco che non poteva stare in nessun vault.
           È una **modale**: mentre è aperta, è quello che si sta facendo. Il
           fuoco ci resta dentro e Escape la chiude (`ui/a11y.ts`).
           Scorre soltanto il corpo: intestazione, navigazione e ricerca
           restano ferme, così la chiusura e la scheda corrente non escono mai
           dalla vista. -->
      <div
        id="settings-panel"
        class="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        tabindex="-1"
        hidden
      >
        <div class="settings-header">
          <h2 id="settings-title" class="settings-title" data-i18n="settings.title">Impostazioni</h2>
          <button
            id="settings-close"
            type="button"
            class="settings-close"
            data-i18n-label="app.close"
            data-i18n-title="app.close"
            aria-label="Chiudi"
          ></button>
        </div>
        <div class="settings-layout">
          <div class="settings-nav">
            <div
              id="settings-tabs"
              class="settings-tabs"
              role="tablist"
              aria-orientation="vertical"
              data-i18n-label="settings.tabs"
              aria-label="Sezioni delle impostazioni"
            >
              <button data-tab="settings" type="button" class="settings-tab" role="tab" aria-selected="true">
                <span class="settings-tab-label" data-i18n="settings.tab.config">Configurazione</span>
              </button>
              <button data-tab="components" type="button" class="settings-tab" role="tab" aria-selected="false">
                <span class="settings-tab-label" data-i18n="settings.tab.components">Componenti</span>
              </button>
              <button data-tab="shortcuts" type="button" class="settings-tab" role="tab" aria-selected="false">
                <span class="settings-tab-label" data-i18n="settings.tab.shortcuts">Scorciatoie</span>
              </button>
              <button data-tab="vault" type="button" class="settings-tab" role="tab" aria-selected="false">
                <span class="settings-tab-label" data-i18n="settings.tab.vaults">Vault</span>
              </button>
              <button data-tab="about" type="button" class="settings-tab" role="tab" aria-selected="false">
                <span class="settings-tab-label" data-i18n="settings.tab.about">Informazioni</span>
              </button>
            </div>
            <!-- L'indice della scheda corrente: una voce per sezione, con la
                 sezione visibile segnata da `aria-current`. Lo riempie
                 `panels/settings.ts` dopo ogni disegno. -->
            <nav id="settings-toc" class="settings-toc" aria-labelledby="settings-toc-title" hidden>
              <div id="settings-toc-title" class="settings-toc-title" data-i18n="settings.toc">In questa pagina</div>
              <ul id="settings-toc-list" class="settings-toc-list"></ul>
            </nav>
          </div>
          <div class="settings-main">
            <!-- La ricerca vive fuori dal corpo: un ridisegno (un
                 `setting_changed` arrivato mentre si scrive) non le toglie il
                 fuoco né il testo. -->
            <div id="settings-toolbar" class="settings-toolbar" hidden>
              <label class="settings-search">
                <span id="settings-search-icon" class="settings-search-icon" aria-hidden="true"></span>
                <!-- Nome e segnaposto cambiano con la scheda (impostazioni o
                     scorciatoie): quelli scritti qui sono della prima, e
                     `panels/settings.ts` li aggiorna. -->
                <input
                  id="settings-search"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  aria-controls="settings-body"
                  data-i18n-label="settings.search"
                  data-i18n-placeholder="settings.search.placeholder"
                  aria-label="Cerca nelle impostazioni"
                  placeholder="Cerca per nome, descrizione o chiave"
                />
              </label>
              <button
                id="settings-modified"
                type="button"
                class="settings-filter"
                aria-pressed="false"
                data-i18n="settings.filter.modified"
                data-i18n-title="settings.filter.modified.hint"
              >
                Solo modificate
              </button>
              <span id="settings-count" class="settings-count" role="status" aria-live="polite"></span>
            </div>
            <div id="settings-scroll" class="settings-scroll">
              <div id="settings-body" class="settings-body"></div>
              <!-- La superficie `settings_tab` del contratto (§2.2), che
                   questa shell dichiarava non ospitata: le view che la
                   chiedono si montano qui, sotto il form. Una scheda per view
                   vuole il modello di layout (§1.2, FEATURES 3.3), che non
                   c'è: intanto la superficie esiste e una view che la chiede
                   si vede, invece di finire in un avviso in console. -->
              <div id="views-settings"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- L'`aria-label` è il **ripiego**: il nome vero è il titolo della view
           che occupa la superficie, e glielo lega `ui/views.ts` con un
           `aria-labelledby` — che vince su questo quando c'è. Qui resta per il
           momento in cui non c'è nessuno: una modale vuota è nascosta, ma un
           nome che esiste solo quando il contenuto è arrivato è un nome che
           manca proprio nell'istante in cui qualcosa va storto. -->
      <div
        id="views-modal"
        class="views-modal"
        role="dialog"
        data-i18n-label="app.dialog"
        aria-label="Finestra di dialogo"
        aria-modal="true"
        tabindex="-1"
        hidden
      ></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
