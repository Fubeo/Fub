# GridCraft con la sua facciata engine, collegato a Fub da solo (K0 del piano
# dei componenti). Vedi `../README.md`.
[package]
name = "prova-fogli"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
motori-prova-comune = { path = "../comune" }
fub-abi = { path = "../../../crates/fub-abi" }
serde_json = "1"
# La copia in `vendor/gridcraft` (v0.11.1), facciata compresa: la stessa che
# usa `fub-format-xlsx`.
gridcraft-engine = { path = "../../../vendor/gridcraft/crates/engine" }
gridcraft-model = { path = "../../../vendor/gridcraft/crates/model" }
gridcraft-numfmt = { path = "../../../vendor/gridcraft/crates/numfmt" }
gridcraft-core = { path = "../../../vendor/gridcraft/crates/core" }

[profile.release]
strip = false

[profile.spoglio]
inherits = "release"
strip = true
