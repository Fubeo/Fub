[package]
name = "librerie-runtime-comune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "comune"
# `dylib`: una libreria Rust condivisa, che l'ospite e i componenti caricano
# una volta sola. `rlib` per l'ospite statico, che la incorpora.
crate-type = ["dylib", "rlib"]

[dependencies]
serde_json = "1"
