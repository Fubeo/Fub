/* da theme/scrittoio/structure.css (copia, non si sposta) */
/* righe 21–68 */
:root {
  /* I piani. Una superficie che intrappola il fuoco sta su `--z-modal`, e
     sotto di lei non ne passa un'altra che lo intrappoli. */
  --z-sheet: 1;
  --z-sheet-active: 2;
  --z-drawer: 40;
  --z-menu: 50;
  --z-picker: 60;
  --z-popover: 70;
  --z-dialog: 80;
  --z-toast: 85;
  --z-modal: 90;
  --z-drag: 95;

  /* La cornice al passo 0 di `chrome.compactness`. */
  --titlebar-h: 40px;
  --chrome-btn: 28px;
  --win-ctrl-w: 46px;
  --rail-w: 44px;
  --rail-icon: 18px;
  --rail-target: 32px;
  --drawer-icon: 16px;
  --tree-indent: 16px;
  --drawer-pad: 12px;
  --drawer-head-h: 36px;
  --sidebar-w: 264px;
  --sidebar-min: 208px;
  --inspector-w: 300px;
  --inspector-min: 248px;
  --status-h: 26px;

  /* I fogli: fermi a ogni passo. */
  --sheet-gap: 8px;
  /* Il foglio di testo che resta solo in concentrazione. */
  --focus-sheet-width: 56rem;
  --tab-h: 34px;
  --tab-min: 96px;
  --tab-max: 220px;
  --sheet-head-h: 40px;
  --format-bar-h: 36px;
  --tab-fillet: 8px;
  --tab-air: 4px;
  --tab-lap: 2px;
}

* {
  box-sizing: border-box;
}

/* righe 113–115 */
[hidden] {
  display: none !important;
}

/* righe 182–193 */
:focus-visible {
  outline: var(--focus-ring-width) solid var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

/* In un dialogo il pulsante col fuoco è quello che Invio preme. L'anello si
   vede anche quando il dialogo è nato da un clic: lì il browser, da solo, non
   lo mostrerebbe, e la risposta di serie resterebbe senza un segno. */
.kit-dialog-actions > :focus {
  outline: var(--focus-ring-width) solid var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

/* righe 221–231 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Le fondamenta: la pagina, il bottone nudo, gli intenti, il testo attenuato,

/* La pagina è la scrivania: il piano di fondo, senza rilievo. Il carattere
   dell'interfaccia vale ovunque, tranne dove un foglio dichiara il suo. */
html, body, .app {

   colore dei tratti. */

}

::selection {
  background: var(--accent-veil);
}

/* Il salto al contenuto. Il meccanismo — fisso, fuori dallo schermo, rivelato
   dal fuoco — è della struttura; qui la superficie con cui arriva. */
.skip-link {
  top: var(--space-4);
  left: var(--space-4);
  padding: var(--space-4) var(--space-6);

  color: var(--muted);

}

/* Lo scheletro: righe del colore del passaggio al posto di ciò che tarda.
   Fermo: l'attesa non ha bisogno di luccicare. Le righe si accorciano a
   turno, come un testo. */
.skeleton {
  display: block;
  padding: var(--space-3) var(--space-4);

  display: block;
  height: 0.75em;
  border-radius: var(--radius-chip);
  background: var(--bg-hover);
}
.skeleton-line + .skeleton-line {
  margin-top: var(--space-4);
}

.skeleton-rows {
  padding: var(--space-5) var(--space-6);
}

  margin-top: var(--space-7);

.skeleton-line:nth-child(3n + 2) {
  width: 72%;
}
.skeleton-line:nth-child(3n) {
  width: 48%;
}

   specificità zero, così un componente che gli dà una classe decide da solo
   anche il proprio passaggio, senza doverlo disfare. */
:where(button) {
  padding: var(--space-3) var(--space-5);
  border: none;
  border-radius: var(--radius-control);
  background: transparent;

  font: inherit;
  font-size: var(--text-base);
  cursor: pointer;
}
:where(button:hover) {
  background: var(--overlay-hover);
}
:where(button:active) {
  background: var(--overlay-active);
}
:where(button:disabled) {
  opacity: 0.4;
  cursor: default;
}
:where(button:disabled:hover),
:where(button:disabled:active) {
  background: transparent;
}

  color: var(--accent-contrast);

/* I menu. */

/* Un menu è un rialzo: carta più chiara di tutto ciò che copre, staccata
   dall'ombra e da nient'altro. Contestuale o a tendina è lo stesso oggetto
   (`ui/menu.ts`): cambia solo da dove parte. */
.context-menu {
  position: fixed;
  z-index: var(--z-menu);

  max-height: calc(100vh - 16px);
  padding: var(--space-2);
  border: none;
  border-radius: var(--radius-menu);
  background: var(--bg-elev);
  box-shadow: var(--shadow-3);
  color: var(--text);
  font-size: var(--text-base);

  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
/* Aperto col mouse il menu tiene il fuoco su di sé soltanto per le frecce:
   non è una cosa da scegliere, e l'anello va sulle voci. */
.context-menu:focus-visible {
  outline: none;
}

/* Una voce: alta quanto una riga e mai meno di 28, con il segno, il nome e la
   scorciatoia su una riga sola. */

  display: flex;
  align-items: center;
  gap: var(--space-4);

  background: transparent;
  color: var(--text);
  font-size: var(--text-base);

  line-height: var(--leading-tight);
  text-align: left;
  white-space: nowrap;
  cursor: pointer;

   velo neutro; col fuoco da tastiera la matita blu e il suo anello, dentro la
   voce perché il menu taglia ciò che sporge: se il puntatore è fermo su
   un'altra, si vede quale risponde a Invio. */
.context-menu button:hover {
  background: var(--overlay-active);
}
.context-menu button:focus-visible {
  background: var(--accent-wash);

  min-width: 0;

    const box = sub.getBoundingClientRect();
    let left = parent.right - 2;
    if (left + box.width > b.right - margin) left = Math.max(b.left + margin, parent.left - box.width + 2);
    const height = Math.min(box.height, b.height - 2 * margin);
    let top = at.top - 4;
    if (top + height > b.bottom - margin) top = b.bottom - margin - height;
    sub.style.left = `${Math.max(b.left + margin, left)}px`;
    sub.style.top = `${Math.max(b.top + margin, top)}px`;
  }

  function closeFrom(level) {
    while (stack.length > level) {
      const top = stack.pop();
      top.menu.remove();
      top.from?.setAttribute("aria-expanded", "false");
    }
  }
  function closeAll(focusAnchor) {
    clearTimeout(hoverTimer);
    closeFrom(0);
    query = "";
    anchor.setAttribute("aria-expanded", "false");
    if (focusAnchor) anchor.focus();
  }

  function openRoot(focusFirst) {
    closeAll(false);
    const rendered = renderMenu(tree(), 0, T["fogli.menu.label"]);
    rendered.menu.dataset.i18nAria = "fogli.menu.label";
    document.body.append(rendered.menu);
    drawFoot(rendered.menu, 0);
    placeBeside(rendered.menu, anchor.getBoundingClientRect());
    stack.push({ ...rendered, from: anchor, rows: tree() });
    anchor.setAttribute("aria-expanded", "true");
    if (focusFirst) rendered.buttons[0]?.focus();
    else rendered.menu.focus({ preventScroll: true });
    return rendered;
  }

  function cascade(level, button, n, focusFirst) {
    if (stack[level + 1]?.from === button) {
      if (focusFirst) stack[level + 1].buttons[0]?.focus();
      return stack[level + 1];
    }
    closeFrom(level + 1);
    const rendered = renderMenu(rowsOf(n), level + 1, n.l);
    rendered.menu.style.left = "0px";
    rendered.menu.style.top = "0px";
    document.body.append(rendered.menu);
    placeCascade(rendered.menu, button.getBoundingClientRect(), stack[level].menu.getBoundingClientRect());
    button.setAttribute("aria-expanded", "true");
    stack.push({ ...rendered, from: button, rows: rowsOf(n) });
    if (focusFirst) rendered.buttons[0]?.focus();
    return rendered;
  }

  /// Tutte le voci, sottomenu compresi, col percorso.
  function flatten(rows, path = "") {
    const out = [];
    for (const row of rows) {
      if (row.sep) continue;
      const n = row.node;
      if (hasKids(n)) out.push(...flatten(rowsOf(n), path ? `${path} › ${n.l}` : n.l));
      else out.push({ node: n, path });
    }
    return out;
  }

  /// La ricerca del menu dei comandi: ogni voce trovata, accese prima e
  /// spente dopo, ognuna col suo perché. Nessun tetto.
  function search(value) {
    query = value;
    closeFrom(1);
    const root = stack[0];
    if (!root) return;
    const rows =
      query === ""
        ? tree()
        : (() => {
            const wanted = fold(query);
            const hits = flatten(tree()).filter(({ node, path }) => fold(node.l).includes(wanted) || fold(path).includes(wanted));
            const on = hits.filter(({ node }) => !status(node).off);
            const off = hits.filter(({ node }) => status(node).off);
            return [...on, ...off];
          })();
    const rendered = renderMenu(rows, 0, T["fogli.menu.label"]);
    root.list.replaceWith(rendered.list);
    root.list = rendered.list;
    root.buttons = rendered.buttons;
    root.menu.querySelector(".menu-empty")?.remove();
    if (rows.length === 0) {
      const empty = el("div", "menu-empty", T["context.search.none"]);
      empty.setAttribute("aria-hidden", "true");
      empty.dataset.i18n = "context.search.none";
      rendered.list.after(empty);
    }
    drawFoot(root.menu, rows.length);
    root.menu.style.maxHeight = "";
    placeBeside(root.menu, anchor.getBoundingClientRect());
    if (rendered.buttons.length) rendered.buttons[0].focus();
    else root.menu.focus({ preventScroll: true });
  }

  function onKey(e, level) {
    const top = stack[level];
    if (!top) return;
    const at = top.buttons.indexOf(document.activeElement);
    const focus = (i) => top.buttons[(i + top.buttons.length) % top.buttons.length]?.focus();
    switch (e.key) {
      case "ArrowDown":
        e.preventDefault();
        focus(at + 1);
        return;
      case "ArrowUp":
        e.preventDefault();
        focus(at < 0 ? -1 : at - 1);
        return;
      case "Home":
        e.preventDefault();
        focus(0);
        return;
      case "End":
        e.preventDefault();
        focus(-1);
        return;
      case "ArrowRight": {
        const b = top.buttons[at];
        if (b?.getAttribute("aria-haspopup") === "menu" && b.getAttribute("aria-disabled") !== "true") {
          e.preventDefault();
          b.click();
        }
        return;
      }
      case "ArrowLeft":
      case "Escape":
        e.preventDefault();
        e.stopPropagation();
        if (level > 0) {
          const from = top.from;
          closeFrom(level);
          from.focus();
        } else if (e.key === "Escape") {
          if (query !== "") search("");
          else closeAll(true);
        }
        return;
      case "Tab":
        e.preventDefault();
        closeAll(true);
        return;
      case "Backspace":
        if (query !== "") {
          e.preventDefault();
          search(query.slice(0, -1));
        }
        return;
      case "Enter":
      case " ":
        // Il click nativo del pulsante; una voce spenta non fa niente.
        if (top.buttons[at]?.getAttribute("aria-disabled") === "true") e.preventDefault();
        if (e.key === " " && query !== "" && at < 0) {
          e.preventDefault();
          search(query + " ");
        }
        return;
      default:
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          if (level > 0) stack[0].buttons[0]?.focus();
          search(query + e.key);
        }
    }
  }

  function activate(n) {
    closeAll(true);
    if (n.id === "selection.stats") return setState("risultato");
    if (n.id === "formulas.errorChecking") return setState("risultato-lungo");
    if (n.e === "legge") return say(`«${n.l}»: si apre la finestra del risultato (T15).`);
    if (n.l.endsWith("…")) return say(`«${n.l}»: si apre la finestra dei valori, come dalla tavolozza (T7).`);
    say(`Eseguito: ${n.l}.`);
  }

  anchor.addEventListener("click", (e) => {
    if (stack.length) closeAll(true);
    else openRoot(e.detail === 0);
  });
  anchor.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && !stack.length) {
      e.preventDefault();
      openRoot(true);
    }
  });
  document.addEventListener("pointerdown", (e) => {
    if (!stack.length) return;
    if (e.target.closest(".context-menu") || e.target.closest("#fogli-menu-button")) return;
    closeAll(false);
  });

  // ── Le lettere di Alt ───────────────────────────────────────────────────
  const ribbon = document.querySelector(".grid-ribbon");
  function showTips(on) {
    for (const badge of document.querySelectorAll(".grid-ribbon-keytip")) badge.remove();
    if (!on) return void delete ribbon.dataset.keytips;
    ribbon.dataset.keytips = "true";
    for (const target of document.querySelectorAll(".grid-ribbon-head [data-keytip]")) {
      if (target.hidden) continue;
      const badge = el("span", "grid-ribbon-keytip", target.dataset.keytip);
      badge.setAttribute("aria-hidden", "true");
      target.append(badge);
    }
  }
  let altAlone = false;
  document.addEventListener("keydown", (e) => {
    altAlone = e.key === "Alt";
    if (ribbon.dataset.keytips === "true" && !e.altKey) {
      if (e.key.toLowerCase() === "c") {
        e.preventDefault();
        showTips(false);
        openRoot(true);
      } else if (e.key === "Escape") showTips(false);
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "Alt" && altAlone) showTips(ribbon.dataset.keytips !== "true");
  });

  // ── La finestra del risultato ───────────────────────────────────────────
  let dialog = null;
  function closeDialog(focusAnchor = true) {
    const was = dialog;
    dialog?.remove();
    dialog = null;
    if (was && focusAnchor) anchor.focus();
  }
  function openResult({ title, tk, fill, actions }) {
    closeDialog(false);
    const scrim = el("div", "kit-dialog-scrim");
    const box = el("div", "kit-dialog grid-dialog-wide grid-result-dialog");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.tabIndex = -1;
    const h = el("h2", "kit-dialog-title", title);
    h.id = "proto-result-title";
    h.dataset.i18n = tk;
    box.setAttribute("aria-labelledby", h.id);
    const content = el("div", "kit-dialog-body");
    const result = el("div", "grid-dialog grid-result");
    fill(result);
    content.append(result);
    const row = el("div", "kit-dialog-actions");
    const made = actions.map(([key, kind, run]) => {
      const b = el("button", "kit-button", T[key]);
      b.type = "button";
      b.dataset.kind = kind;
      b.dataset.i18n = key;
      b.addEventListener("click", run);
      row.append(b);
      return b;
    });
    box.append(h, content, row);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        closeDialog();
      }
    });
    scrim.append(box);
    document.body.append(scrim);
    dialog = scrim;
    made.at(-1).focus();
  }
  function note(container, message, key) {
    const p = el("p", "grid-dialog-note", message);
    p.setAttribute("role", "status");
    p.dataset.i18n = key;
    container.append(p);
  }
  function table(caption, head, rows) {
    const wrap = el("div", "grid-dialog-results");
    const t = el("table", "grid-result-table");
    const cap = el("caption", "sr-only", caption);
    t.append(cap);
    if (head) {
      const thead = el("thead");
      const tr = el("tr");
      for (const [label, key, numeric] of head) {
        const th = el("th", numeric ? "grid-result-number" : "", label);
        th.scope = "col";
        th.dataset.i18n = key;
        tr.append(th);
      }
      thead.append(tr);
      t.append(thead);
    }
    const tbody = el("tbody");
    for (const cells of rows) tbody.append(cells);
    t.append(tbody);
    wrap.append(t);
    return wrap;
  }
  const copyButton = (tsv) => ["fogli.result.copy", "normal", () => say(T["fogli.result.copied"] + ` (${tsv.split("\n").length} righe)`)];
  const closeButton = ["grid.dialog.close", "primary", closeDialog];

  function showLoading() {
    openResult({
      title: "Statistiche della selezione",
      tk: "fogli.cmd.selection.stats",
      fill(result) {
        result.setAttribute("aria-busy", "true");
        note(result, T["fogli.result.loading"], "fogli.result.loading");
        const sk = el("div", "skeleton-rows");
        sk.setAttribute("aria-hidden", "true");
        for (let i = 0; i < 6; i++) sk.append(el("span", "skeleton-line"));
        result.append(sk);
      },
      actions: [closeButton],
    });
  }
  function showStats() {
    const values = [
      ["fogli.result.key.count", "24", false],
      ["fogli.result.key.numeric", "24", false],
      ["fogli.result.key.sum", num(16437.9), true],
      ["fogli.result.key.average", num(684.9125), true],
      ["fogli.result.key.min", num(88.6), true],
      ["fogli.result.key.max", num(1403.15), true],
    ];
    openResult({
      title: "Statistiche della selezione",
      tk: "fogli.cmd.selection.stats",
      fill(result) {
        note(result, text("fogli.result.stats.note", { range: "Spese!B2:E7", count: 24 }), "fogli.result.stats.note");
        const rows = values.map(([key, value]) => {
          const tr = el("tr");
          const th = el("th", "grid-result-key", T[key]);
          th.scope = "row";
          th.dataset.i18n = key;
          tr.append(th, el("td", "grid-result-number", value));
          return tr;
        });
        result.append(table("Statistiche della selezione", null, rows));
      },
      actions: [copyButton(values.map(([k, v]) => `${T[k]}\t${v}`).join("\n")), closeButton],
    });
  }
  function showErrors() {
    const sheet = "Movimenti del conto corrente cointestato 2026";
    const errors = Array.from({ length: 500 }, (_, i) => ({ cell: `F${i + 2}`, error: i % 7 === 3 ? "#VALORE!" : "#DIV/0!", formula: `=D${i + 2}/E${i + 2}` }));
    openResult({
      title: "Controllo errori",
      tk: "fogli.cmd.formulas.errorChecking",
      fill(result) {
        note(result, text("fogli.result.errors.note", { count: errors.length }), "fogli.result.errors.note");
        const rows = errors.map(({ cell, error, formula }) => {
          const tr = el("tr");
          const ref = `'${sheet}'!${cell}`;
          const go = el("button", "grid-result-ref", cell);
          go.type = "button";
          go.setAttribute("aria-label", text("fogli.result.go", { ref }));
          go.dataset.i18nAria = "fogli.result.go";
          go.addEventListener("click", () => {
            closeDialog();
            say(`Selezionata ${ref} (selection.set).`);
          });
          const cellTd = el("td");
          cellTd.append(go);
          tr.append(el("td", "", sheet), cellTd, el("td", "", error), el("td", "", formula));
          return tr;
        });
        result.append(
          table(
            "Controllo errori",
            [
              [T["fogli.result.col.sheet"], "fogli.result.col.sheet"],
              [T["fogli.result.col.cell"], "fogli.result.col.cell"],
              [T["fogli.result.col.error"], "fogli.result.col.error"],
              [T["fogli.result.col.formula"], "fogli.result.col.formula"],
            ],
            rows,
          ),
        );
      },
      actions: [copyButton(errors.map((x) => `${sheet}\t${x.cell}\t${x.error}\t${x.formula}`).join("\n")), closeButton],
    });
  }
  function showError() {
    openResult({
      title: "Statistiche della selezione",
      tk: "fogli.cmd.selection.stats",
      fill(result) {
        const p = el("p", "grid-dialog-error", T["fogli.result.failed"]);
        p.setAttribute("role", "alert");
        p.dataset.i18n = "fogli.result.failed";
        result.append(p);
      },
      actions: [["fogli.result.retry", "normal", showLoading], closeButton],
    });
  }

  // ── Gli stati ──────────────────────────────────────────────────────────
  const tableTab = document.querySelector('[data-contestuale="table"]');
  const indicator = document.querySelector(".kit-tab-indicator");
  function placeIndicator() {
    const tab = document.querySelector('.kit-tab[aria-selected="true"]');
    const list = tab.parentElement.getBoundingClientRect();
    const box = tab.getBoundingClientRect();
    indicator.style.left = `${box.left - list.left + tab.parentElement.scrollLeft}px`;
    indicator.style.width = `${box.width}px`;
    indicator.hidden = false;
  }
  function fit() {
    const narrow = win.dataset.larghezza === "stretta";
    for (const g of document.querySelectorAll('.grid-ribbon-group[data-stretta="raccolto"]')) g.dataset.collapsed = String(narrow);
    placeIndicator();
  }

  function walkTo(path) {
    let level = 0;
    for (const name of path) {
      const top = stack[level];
      const at = top.rows.filter((r) => !r.sep).findIndex((r) => r.node.l === name);
      if (at < 0) throw new Error(`voce assente: ${name}`);
      const b = top.buttons[at];
      b.focus();
      cascade(level, b, top.rows.filter((r) => !r.sep)[at].node, false);
      level += 1;
    }
    stack[level]?.buttons[0]?.focus();
  }

  function setState(name) {
    closeAll(false);
    closeDialog(false);
    showTips(false);
    state.readOnly = name === "sola-lettura";
    state.ctx.table = name === "contestuali-attive" ? "Spese_mensili_della_famiglia_2026_con_le_rate_del_mutuo" : null;
    tableTab.hidden = name !== "contestuali-attive";
    win.dataset.tabella = name === "contestuali-attive" ? "si" : "no";
    selectRange(name === "risultato" || name === "caricamento" || name === "errore");
    document.getElementById("proto-stato").value = name;
    fit();
    say("");
    switch (name) {
      case "menu":
        openRoot(true);
        walkTo(["Home", "Carattere"]);
        break;
      case "ricerca":
        openRoot(true);
        search("comment");
        break;
      case "ricerca-tutte":
        openRoot(true);
        search("a");
        break;
      case "nessuna":
        openRoot(true);
        search("zzz");
        break;
      case "contestuali":
        openRoot(true);
        walkTo(["Struttura tabella", "Opzioni stile tabella"]);
        break;
      case "contestuali-attive": {
        const root = openRoot(true);
        root.buttons.find((b) => b.querySelector(".menu-label").textContent === "Struttura tabella").focus();
        break;
      }
      case "sola-lettura":
        openRoot(true);
        walkTo(["Home", "Modifica"]);
        break;
      case "caricamento":
        showLoading();
        break;
      case "risultato":
        showStats();
        break;
      case "risultato-lungo":
        showErrors();
        break;
      case "errore":
        showError();
        break;
      case "tastiera":
        showTips(true);
        anchor.focus();
        break;
      default:
        break;
    }
  }

  document.getElementById("proto-stato").addEventListener("change", (e) => setState(e.target.value));
  document.getElementById("proto-luce").addEventListener("change", (e) => {
    document.documentElement.dataset.luce = e.target.value;
  });
  document.getElementById("proto-larghezza").addEventListener("change", (e) => {
    win.dataset.larghezza = e.target.value;
    setState(document.getElementById("proto-stato").value);
  });
  window.addEventListener("resize", () => setState(document.getElementById("proto-stato").value));

  // Lo stato dall'indirizzo (#stato=menu&luce=scura&larghezza=stretta), per le foto.
  const asked = new URLSearchParams(location.hash.slice(1));
  if (asked.get("luce")) document.getElementById("proto-luce").value = document.documentElement.dataset.luce = asked.get("luce");
  if (asked.get("larghezza")) document.getElementById("proto-larghezza").value = win.dataset.larghezza = asked.get("larghezza");
  // Dopo il carattere: i menu si misurano con le lettere vere.
  document.fonts.ready.then(() => setState(asked.get("stato") ?? "riposo"));
})();
</script>
</body>
</html>
