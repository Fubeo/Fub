<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Fub</title>
  <!-- Un colore solo (le icone simboliche di Linux, il livello monocromo di
       Android): il foglio pieno, e la «f» che dentro il foglio è un taglio e
       fuori è piena. Nei file finali i tratti diventano riempimenti. -->
  <defs>
    <path id="f" d="M14 3.5C13.6 1.7 11.1 1.3 10 3.3C9 5.1 8.3 9 7.6 11.6C7 13.7 5.6 14.8 4.2 14.5C2.9 14.2 2.8 12.8 4.1 11.9C5.8 10.7 8.7 9.7 11.9 9.2"/>
    <path id="foglio" d="M5.6 1.5H11.9A0.6 0.6 0 0 1 12.5 2.1V13.9A0.6 0.6 0 0 1 11.9 14.5H3.6A0.6 0.6 0 0 1 3 13.9V4.1Z"/>
    <mask id="taglio" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#fff"/>
      <use href="#f" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <mask id="fuori" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#fff"/>
      <use href="#foglio" fill="#000"/>
    </mask>
  </defs>
  <use href="#foglio" fill="#2e3436" mask="url(#taglio)"/>
  <g mask="url(#fuori)">
    <use href="#f" fill="none" stroke="#2e3436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
