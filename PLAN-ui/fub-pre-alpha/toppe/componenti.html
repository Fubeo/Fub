<template data-toppa="comp-permesso" data-nome="Installare un componente: la richiesta dei permessi">

<div class="kit-dialog-scrim">
  <div class="kit-dialog" role="dialog" aria-modal="true" aria-labelledby="comp-permesso-titolo" aria-describedby="comp-permesso-testo">
    <h2 class="kit-dialog-title" id="comp-permesso-titolo">Installare «Conta parole»?</h2>
    <p class="kit-dialog-description" id="comp-permesso-testo">esempio.conta-parole 0.3.1, della comunità: nessuno l'ha verificato. Chiede di sapere quale nota stai guardando. Non chiede la rete, né file fuori dal vault.</p>

  </div>
</div>
