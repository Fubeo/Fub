# Real inbound index fixture using the canonical WIT exports.
[package]
name = "index-provider-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"

[features]
trap-routes = []

[profile.release]
strip = true
opt-level = "s"

# Un workspace suo, vuoto: chi lo compila da un worktree annidato in un altro
# checkout (per esempio sotto `.claude/worktrees/`) non risale al
# `Cargo.toml` di quel checkout, che non lo elenca fra i membri.
[workspace]
