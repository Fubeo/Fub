# Componente esterno al workspace: il test lo costruisce per wasm32-wasip2.
[package]
name = "vault-view-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
adversarial = []
no-permission = []
bad-abi = []
deny-activate = []

[dependencies]
wit-bindgen = "0.60"
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
