version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contratto FubMD: modello documento comune + trait di estensione, definiti una volta sola. Nessuna dipendenza da markdown, tauri o wasm."

[dependencies]
serde = { workspace = true }
