[package]
name = "fubmd-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Contratto FubMD: modello documento comune + trait di estensione, definiti una volta sola. Nessuna dipendenza da markdown, tauri o wasm."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# INVARIANTE ARCHITETTURALE: questo crate NON deve mai dipendere da
# comrak/pulldown, tauri, wasmtime, tokio, notify. È il firewall anti-lock-in.

[dev-dependencies]
# Solo per i test (es. wit_conformance): gli integration test non vedono le
# dipendenze normali del crate. Nessun impatto sull'invariante — che riguarda
# le dipendenze NORMALI ed è verificata da tests/dependency_invariant.rs.
serde_json = { workspace = true }
# Il test di conformità PARSA wit/fubmd/abi.wit invece di cercarci dentro delle
# sottostringhe: un contratto invalido deve essere un test rosso.
wit-parser = { version = "0.254", default-features = false, features = ["std"] }
