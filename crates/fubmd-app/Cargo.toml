[package]
name = "fubmd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Colla Tauri v2 di FubMD: comandi/eventi IPC, finestre, dialoghi. Chi monta è `fubmd-host`."

[lib]
name = "fubmd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fubmd"
path = "src/main.rs"

[dependencies]
fubmd-abi = { workspace = true }
fubmd-kernel = { workspace = true }
# Chi monta: registro, feature, sessione, watcher, ponte eventi (§8.2).
fubmd-host = { workspace = true }
# Solo per `VersionRef`, che è un tipo che attraversa l'IPC.
fubmd-features = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# tauri-build aggiunto con `cargo add` (versione corrente)
