[package]
name = "fub-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agnostic core of Fub: vault, link graph, provider registry, event bus. No dependency on markdown, wasm, or tauri."

[dependencies]
fub-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
# Il vault di produzione apre la root una volta e poi opera tramite `cap_std::fs::Dir`:
# il path ambientale resta solo un nome logico, così una sostituzione della root
# dopo il mount non può reindirizzare letture e scritture fuori dal capability.
cap-std = { workspace = true }
thiserror = { workspace = true }
# Solo la facciata: il collettore è `crate::log`, e non ha dipendenze.
tracing = { workspace = true }
# La verifica di scrittura all'apertura (0160) chiede al sistema «posso
# scrivere qui?» con `access(2)`, e la domanda va fatta alla piattaforma.
# La regola della supply chain (0001) ha una risposta misurata anche qui:
# `libc 0.2.189` era **già** nell'albero — tirato da notify e da glib — e
# dipende dal solo `libc` stesso. Zero crate nuovi, e il verso alternativo —
# una `extern "C"` scritta a mano — è la forma che la 0001 ha già rifiutato
# per il conteggio dei nomi su Windows: un `unsafe` che non si può rileggere.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# INVARIANTE: niente comrak/pulldown, wasmtime, tauri qui dentro. Il core non
# sa cosa sia il markdown.

# Il conteggio dei nomi di un file su Windows (§23.16): `std::fs::Metadata` non
# espone `nNumberOfLinks`, e senza di lui la scrittura stacca un hardlink senza
# dirlo. La domanda della supply chain (0001) ha una risposta misurata invece che
# stimata: `windows-sys 0.61` era **già** nell'albero — tirato da tauri — e
# dipende dal solo `windows-link`, che c'è pure lui. Zero crate nuovi, un solo
# fornitore (Microsoft), e le due feature sono quelle di una syscall sola. Il
# verso alternativo era una `extern "system"` scritta a mano con la sua
# `BY_HANDLE_FILE_INFORMATION`: nessuna dipendenza, e una struct di dodici campi
# il cui layout sbagliato non fa rumore — restituisce un numero, e il numero è
# sbagliato. Fra un crate che non aggiunge niente e un `unsafe` che non si può
# rileggere, questo repo prende il crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# i test del grafo costruiscono DocumentModel a mano: zero markdown.
# Espliciti per gli integration test in `tests/` (niente proptest: il generatore
# di sequenze è un xorshift deterministico dentro il test).
fub-abi = { workspace = true }
# Il banco del lato host (§16.2). Il ciclo `kernel → testkit → kernel` è
# legittimo perché è di sola prova: cargo lo risolve, e la libreria non lo vede.
fub-testkit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
