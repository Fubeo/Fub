# Il corpus dei documenti di videoscrittura: una voce per file.
#
# Ogni file è costruito apposta da `examples/genera_corpus.rs` a partire dalle
# specifiche, con autori e testi di prova. Nessuno è prodotto da Word,
# LibreOffice, Google Docs o da altri generatori: le righe della matrice che li
# chiedono (`matrice`) restano scoperte finché qualcuno non aggiunge quei file
# (vedi `README.md`).
#
# Chiavi: path, origine, programma, licenza (CC0-1.0 o MIT OR Apache-2.0),
# matrice (la riga della matrice del piano), esercita, atteso.

[[file]]
path = "docx/stili-elenchi-tabelle.docx"
origine = "costruito a mano da ECMA-376"
programma = "examples/genera_corpus.rs"
licenza = "MIT OR Apache-2.0"
matrice = "Word moderno"
esercita = "stili, elenco puntato, tabella con celle unite in larghezza e in altezza, intestazione con PAGE, nota a piè di pagina, due sezioni di cui una orizzontale"
atteso = "sola lettura: codec, finché il motore perde w:lang w:eastAsia, il rientro dello stile di tabella e w:fldSimple"

