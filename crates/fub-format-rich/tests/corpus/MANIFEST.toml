# Il corpus dei documenti di videoscrittura: una voce per file.
#
# I file sono costruiti apposta, con autori e testi di prova: da
# `examples/genera_corpus.rs` a partire dalle specifiche, oppure salvati da
# LibreOffice a partire da un documento scritto a mano in
# `../corpus-sorgenti/`. Nessuno è prodotto da Word, Google Docs o da altri
# generatori: le righe della matrice che li chiedono (`matrice`) restano
# scoperte finché qualcuno non aggiunge quei file (vedi `README.md`).
#
# Chiavi: path, origine, programma, licenza (CC0-1.0 o MIT OR Apache-2.0),
# matrice (la riga della matrice del piano), esercita, atteso e perché.
#
# `atteso` è l'esito dell'apertura, che il test
# `l_esito_dichiarato_è_quello_dell_apertura` confronta: `modificabile` o
# `solo il corpo`, seguiti da `, blocchi chiusi: <indici>` se ce ne sono;
# `sola lettura: <ragione>`; `errore: <specie>`. `perché` lo spiega, ed è
# obbligatorio per ogni esito che non è `modificabile`.

[[file]]
path = "docx/stili-elenchi-tabelle.docx"
origine = "costruito a mano da ECMA-376"
programma = "examples/genera_corpus.rs"
licenza = "MIT OR Apache-2.0"
matrice = "Word moderno"
esercita = "stili, elenco puntato, tabella con celle unite in larghezza e in altezza, intestazione con PAGE, nota a piè di pagina, due sezioni di cui una orizzontale"
atteso = "solo il corpo"
perché = "il motore di oggi perde il rientro dello stile di tabella (storytold/wordcraft#3541); il corpo si riscrive senza perdite"

