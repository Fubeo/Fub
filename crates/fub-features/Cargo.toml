[package]
name = "fub-features"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Official features as native trait implementations: backlink, search, graph, preview orchestration."

# Una cargo feature per bundle, e i nomi sono gli stessi dell'inventario
# (`src/inventory.rs`): una riga che sparisce dietro un `#[cfg]` sparisce da lì,
# quindi non è mai il documento a dire cosa esiste. Il default è **tutto**, cioè
# l'app che spediamo, con una sola eccezione dichiarata (`draw`, più sotto):
# spegnere è una scelta di chi compila, non un difetto da ricordarsi di
# correggere.
#
# La ragione per cui questo file esiste in questa forma è una sola misura: senza
# di esso `tantivy` è dipendenza dell'intero crate, quindi compilare il pannello
# struttura compila un motore di ricerca. Adesso `search` porta tantivy e nessun
# altro lo tira dentro (§16.3, primo tempo).
[features]
default = [
    "search",
    "versioning",
    "backlinks",
    "outline",
    "tags",
    "properties",
    "template",
    "queries",
    "dashboard",
    "backup",
    "stats",
    "trash",
    "graph",
    "commands",
    "blocks",
    "base",
    "formatting",
]
search = ["dep:tantivy", "dep:regex"]
versioning = []
backlinks = []
outline = []
tags = []
properties = ["dep:serde_yaml_ng"]
# Il template fonde le proprietà del proprio frontmatter nella nota con
# `note.property.set`, che è un comando di `properties`: come per il cestino è
# una dipendenza di **funzionamento**, e dichiararla qui è il modo di non
# spedire una build in cui ogni inserimento con proprietà riesce a metà. Il
# manifest la ripete (`requires` nell'inventario), per chi spegne `properties`
# a runtime.
template = ["dep:serde_yaml_ng", "dep:jiff", "properties"]
queries = []
dashboard = []
backup = []
stats = []
# Il cestino invoca `trash.restore` e `trash.empty`, che sono comandi del
# registro e li dichiara `commands`. Non è una dipendenza di **compilazione** —
# un id di comando è una stringa del contratto, non un item Rust, e infatti
# `trash.rs` non nomina `crate::` — è una dipendenza di **funzionamento**: senza
# quel bundle i due bottoni del pannello premono un registro che non ha quei
# comandi. Dichiararla qui è il modo di non spedire quella build.
trash = ["commands"]
graph = []
# `note.create` scrive le proprietà iniziali come frontmatter YAML.
commands = ["dep:serde_yaml_ng"]
blocks = []
# Modificare una cella di una Base pianifica `note.property.set`/`remove`, che
# sono comandi di `properties`: stessa dipendenza di funzionamento del template,
# ripetuta nel manifest.
base = ["dep:fub-format-base", "properties"]
# La barra dichiara i pulsanti; la modifica la esegue la shell. Nessuna
# dipendenza, di compilazione o di funzionamento.
formatting = []
# I disegni: il comando che ne fa nascere uno e l'export in PNG e in PDF. È
# l'unica feature **fuori** dal default, ed è una scelta e non una
# dimenticanza: porta un rasterizzatore, un convertitore PDF e i caratteri di
# Fub incorporati nel binario, e li porta solo con il formato dei disegni, che
# sta dietro la feature `draw` di `fub-host`. Chi compila senza disegni non
# paga niente di tutto questo; la regola è presidiata da
# `.github/scripts/check-cargo-feature-default.mjs` e da
# `tests/cargo_features.rs`. Con i disegni viene l'export delle annotazioni dei
# PDF, che porta un lettore e scrittore di PDF e un rasterizzatore di PDF.
draw = [
    "dep:fub-format-svg",
    "dep:fub-scene",
    "dep:resvg",
    "dep:svg2pdf",
    "dep:png",
    "dep:image",
    "dep:imagesize",
    "dep:lopdf",
    "dep:hayro",
    "dep:flate2",
    "dep:sha2",
]

[dependencies]
camino.workspace = true
fub-abi = { workspace = true }
serde = { workspace = true }
fub-format-base = { workspace = true, optional = true }
# Dietro `draw`: un disegno nuovo lo scrive `serialize` del provider dei
# disegni, e l'id del formato è il suo. Come `fub-format-base` per `base`, il
# formato è una libreria del contratto e non porta il kernel.
fub-format-svg = { workspace = true, optional = true }
serde_json = { workspace = true }
# Dietro `properties`: stessa crate/versione del provider markdown, usata solo
# per riscrivere la mappa del frontmatter (mai `FormatProvider::serialize`).
serde_yaml_ng = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
# Opzionale, e dietro `search`: è l'unica dipendenza pesante del crate ed è di
# una feature sola.
tantivy = { version = "0.26", optional = true }
regex = { workspace = true, optional = true }
# Dietro `draw`, e solo lì. `resvg` senza i default, che sono `system-fonts` e
# `memmap-fonts`: i caratteri sono quelli di Fub, incorporati, e nient'altro.
# Restano il testo e la decodifica delle immagini raster, incorporate come
# `data:` o lette dal vault. `fontdb` sa comunque leggere dal disco, perché `svg2pdf` lo prende
# con le sue feature di serie e le feature si sommano: che non lo faccia lo
# garantisce il codice, che costruisce il database dai soli byte incorporati, e
# lo prova un test.
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images"], optional = true }
svg2pdf = { version = "0.13.0", optional = true }
# L'encoder del PNG: quello di `tiny-skia` non scrive né la risoluzione
# (`pHYs`) né il titolo (`iTXt`). È la stessa 0.18 che `image` porta già.
png = { version = "0.18.1", optional = true }
# Non lo chiama nessuno: c'è per accendere `webp` nella copia di `image` che usa
# `svg2pdf`, che di suo decodifica solo JPEG, PNG e GIF. Senza questa riga
# un'immagine WebP in un disegno uscirebbe nel PNG e mancherebbe nel PDF. Il decoder è lo stesso `image-webp` che `resvg` porta già.
image = { version = "0.25.10", default-features = false, features = ["webp"], optional = true }
# La misura di un'immagine raster, presa come la prende `usvg`, che è la stessa
# crate: un'immagine che `usvg` non sa misurare la scarta senza dirlo, e il
# risolutore la lascia fuori prima, così il log la nomina.
imagesize = { version = "0.13.0", optional = true }
# Dietro `draw`, per l'export delle annotazioni dei PDF. Le annotazioni le legge
# il lettore del formato, lo stesso del provider `fubann`.
fub-scene = { workspace = true, optional = true }
# Il lettore e lo scrittore dei PDF delle annotazioni: il PDF annotato è
# l'originale con un aggiornamento in coda, il PDF redatto un file nuovo con le
# sole pagine. Senza i default, che sono l'orologio di `chrono` e il
# parallelismo di `rayon`: le date non si scrivono, e un PDF si legge in un
# thread solo.
lopdf = { version = "0.45.0", default-features = false, optional = true }
# Il rasterizzatore delle pagine del PDF redatto. La 0.5 perché le successive
# chiedono un compilatore più nuovo di quello del workspace. I caratteri
# standard del PDF (`embed-fonts`, di serie) sono sostituti con licenza
# permissiva incorporati nel binario: una pagina che li usa senza incorporarli
# esce col testo.
hayro = { version = "0.5.0", optional = true }
# L'immagine di una pagina redatta, compressa come un PNG dentro il PDF.
flate2 = { workspace = true, optional = true }
# L'impronta del PDF, per dire se è cambiato da quando è stato annotato.
sha2 = { version = "0.10.9", optional = true }
# La facciata del log (§17.3). Non il collettore: quello sta nel kernel, e
# questo crate il kernel non lo vede per invariante — che è esattamente il
# motivo per cui `tracing` è diviso in due crate.
tracing = { workspace = true }

# INVARIANTE: la libreria NON dipende da `fub-kernel`. Le feature ufficiali
# sono impl dei trait del contratto, cioè esattamente ciò che scriverà un plugin
# di terzi — e un plugin di terzi non ha il kernel fra le mani. È presidiata da
# crates/fub-abi/tests/dependency_invariant.rs.
[dev-dependencies]
# Il kernel serve ai soli test end-to-end, che è la loro ragione d'essere:
# provano le feature contro il kernel VERO, non contro un doppio.
fub-kernel = { workspace = true }
# `MemoryHost` — il doppio dell'host — stava qui dentro, privato e `#[cfg(test)]`.
# Adesso è `fub_sdk::testing`, dov'è raggiungibile da chiunque scriva un
# provider (§16.1, decisione 0054). Resta una dev-dependency: la libreria non lo
# usa, lo usano i suoi test.
fub-sdk = { workspace = true }
# Il banco del lato host, per i test end-to-end che montano il kernel (§16.2).
fub-testkit = { workspace = true }
fub-format-markdown.workspace = true
tempfile = { workspace = true }
# I test dell'export dei disegni confrontano i PDF per struttura, e per leggerne
# i flussi devono decomprimerli.
flate2 = { workspace = true }

# Il banco della §21.9 (decisione 0074): quanto costa una query, e **dove** vanno
# i millisecondi. `required-features` e non un `#![cfg]` in testa al file: un
# esempio con tutto spento non è un esempio vuoto, è un binario senza `main` —
# cioè un errore di compilazione in una build parziale, che è precisamente ciò
# che le build parziali della CI esistono per non avere.
[[example]]
name = "search"
required-features = ["search"]
