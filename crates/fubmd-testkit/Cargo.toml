[package]
name = "fubmd-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Il banco di prova del lato host: monta un vault vero sul kernel vero, registra, fa girare un giro di eventi e dice cosa è stato emesso. Dev-dependency, mai dipendenza normale."

# INVARIANTE: questo crate NON è mai una dipendenza normale di nessuno. È il
# banco del lato *host* (§16.2), quindi ha `fubmd-kernel` fra le mani — e chi lo
# prendesse come dipendenza normale si porterebbe il kernel dentro la libreria.
# Sta nei `[dev-dependencies]` di chi lo usa, e il ciclo che ne nasce
# (kernel → testkit → kernel) è legittimo proprio perché è di sola prova.
# Presidiato da crates/fubmd-abi/tests/dependency_invariant.rs.
[dependencies]
camino = { workspace = true }
fubmd-abi = { workspace = true }
fubmd-kernel = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.27.0"
