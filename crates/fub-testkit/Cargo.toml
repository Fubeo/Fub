[package]
name = "fub-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The host-side test bench: mounts a real vault on the real kernel, registers, runs an event cycle, and reports what was emitted. Dev-dependency only, never a normal dependency."

# INVARIANTE: questo crate NON è mai una dipendenza normale di nessuno. È il
# banco del lato *host* (§16.2), quindi ha `fub-kernel` fra le mani — e chi lo
# prendesse come dipendenza normale si porterebbe il kernel dentro la libreria.
# Sta nei `[dev-dependencies]` di chi lo usa, e il ciclo che ne nasce
# (kernel → testkit → kernel) è legittimo proprio perché è di sola prova.
# Presidiato da crates/fub-abi/tests/dependency_invariant.rs.
[dependencies]
camino = { workspace = true }
fub-abi = { workspace = true }
fub-kernel = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# L'oracolo a pixel (`fub_testkit::pixel`): disegna un SVG con i soli
# caratteri passati, uguale su ogni macchina. Solo il testo: le immagini
# raster non servono a confrontare due disegni della stessa scena, e senza
# `system-fonts` i caratteri del sistema non entrano.
resvg = { workspace = true, features = ["text"], optional = true }

# Fuori dal `default`, e dichiarata in `FUORI_DAL_DEFAULT` di
# `.github/scripts/check-cargo-feature-default.mjs` con il passo di CI che la
# compila: chi prende il banco per un test del kernel non deve compilare un
# rasterizzatore che non usa.
[features]
default = []
pixel = ["dep:resvg"]

[[test]]
name = "pixel"
required-features = ["pixel"]
