[package]
name = "fub-format-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "First native FormatProvider: Obsidian-style markdown (comrak). The only M1 crate that knows markdown exists."

[dependencies]
comrak = "0.54.0"
entities = "1.0.1"
fub-abi = { workspace = true }
fub-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# comrak si aggiunge con `cargo add`; la versione del crate YAML sta nella
# radice, perché la dichiarano in due.

[dev-dependencies]
# solo per il test end-to-end sul vault di esempio: monta il core reale.
fub-kernel = { workspace = true }
camino = { workspace = true }
tempfile = { workspace = true }
