[package]
name = "fub-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Chi monta Fub: la tabella di montaggio delle feature, la sessione di un vault aperto, il watcher dietro un trait. Nessuna dipendenza da tauri."

[dependencies]
camino = { workspace = true }
fub-abi = { workspace = true }
# `default-features = false` e una feature per bundle qui sotto: chi monta
# decide quali feature ufficiali esistono, e la scelta si propaga a un posto
# solo (§16.3).
fub-features = { workspace = true }
fub-format-markdown = { workspace = true }
fub-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Il watcher di default, e l'unico che oggi esiste. Sta dietro una cargo feature
# perché il trait `VaultWatcher` esiste proprio per i posti dove `notify` non
# c'è o non funziona — PWA (26.3), mobile (26.2), e2e headless (27.4) — e una
# dipendenza obbligatoria renderebbe il trait una promessa che il `Cargo.toml`
# smentisce. Accesa di default: i tre client desktop previsti (CLI 27.1, API
# locale 27.2, l'app) la vogliono, e spegnerla è la scelta di chi non può averla.
notify = { version = "8.2.0", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }
# Il **database dei fusi orari** (§22.4, decisione 0091), e sta qui e solo qui:
# `fub-abi` non ha e non deve avere una dipendenza di date, perché la regola del
# contratto è aritmetica su ore civili e le ore civili non sanno cosa sia l'ora
# legale. Serve in due conversioni sole — istante → ora civile e ritorno — e
# sono in `parete.rs`.
#
# **Misurato, come vuole il precedente di `tracing`: dieci pacchetti nel
# lockfile**, da 541 a 551 (`jiff`, `jiff-core`, `jiff-static`, `jiff-tzdb`,
# `jiff-tzdb-platform`, `portable-atomic`, `portable-atomic-util`, `defmt`,
# `defmt-macros`, `defmt-parser`). Dieci volte il conto di `tracing`, e va
# scritto invece che nascosto. I tre `defmt` sono voci di lock e non
# compilazione: arrivano da un ramo `no_std` che qui non si accende.
#
# `default-features = false` toglie `serde` (un `WallClock` si serializza da sé,
# nel contratto, senza tipi di `jiff` al confine) e `logging`. Restano le tre che
# fanno il lavoro: `std`, `tz-system` per leggere il fuso della macchina, e
# le due del database: `tzdb-zoneinfo` legge `/usr/share/zoneinfo`, che su Unix
# c'è già, e `tzdb-bundle-platform` imbarca il database sulle piattaforme dove
# non c'è — cioè Windows. Sono due e non una perché coprono due mondi: con la
# sola seconda, su Linux `TimeZone::get("Europe/Rome")` fallisce, e questo si
# scopre solo eseguendo (le prove di `parete.rs` lo hanno scoperto).
#
# **L'alternativa a zero crate esiste ed è stata scartata per iscritto**: senza
# tzdb, «alle 9 a Roma» calcolato su una macchina in UTC è sbagliato di un'ora
# per metà anno, e `locale.timezone` — che è un nome IANA, e c'era già —
# smetterebbe di essere onorabile.
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
    "tzdb-bundle-platform",
] }

[features]
default = ["notify-watcher", "feature-ufficiali"]
notify-watcher = ["dep:notify", "dep:notify-debouncer-full"]

# **Le feature ufficiali, una cargo feature per bundle** (§16.3). Inoltrano e
# basta: l'elenco vero è `fub_features::ogni_feature_ufficiale`, e questi nomi
# sono i suoi. Chi ne spegne una toglie la riga dall'inventario, quindi il
# bundle non si monta — non c'è uno stato in cui la feature sia compilata e non
# dichiarata, o dichiarata e non compilata.
feature-ufficiali = [
    "search",
    "versioning",
    "backlinks",
    "outline",
    "tags",
    "trash",
    "stats",
    "graph",
    "commands",
    "blocks",
]
search = ["fub-features/search"]
versioning = ["fub-features/versioning"]
backlinks = ["fub-features/backlinks"]
outline = ["fub-features/outline"]
tags = ["fub-features/tags"]
trash = ["fub-features/trash"]
stats = ["fub-features/stats"]
graph = ["fub-features/graph"]
commands = ["fub-features/commands"]
blocks = ["fub-features/blocks"]

[dev-dependencies]
# Il banco del lato host (§16.2).
fub-testkit = { workspace = true }
tempfile = "3.27.0"
