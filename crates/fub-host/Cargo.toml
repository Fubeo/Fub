[package]
name = "fub-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Chi monta Fub: la tabella di montaggio delle feature, la sessione di un vault aperto, il watcher dietro un trait. Nessuna dipendenza da tauri."

[dependencies]
camino = { workspace = true }
fub-abi = { workspace = true }
# `default-features = false` e una feature per bundle qui sotto: chi monta
# decide quali feature ufficiali esistono, e la scelta si propaga a un posto
# solo (§16.3).
fub-features = { workspace = true }
fub-format-markdown = { workspace = true }
fub-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Il watcher di default, e l'unico che oggi esiste. Sta dietro una cargo feature
# perché il trait `VaultWatcher` esiste proprio per i posti dove `notify` non
# c'è o non funziona — PWA (26.3), mobile (26.2), e2e headless (27.4) — e una
# dipendenza obbligatoria renderebbe il trait una promessa che il `Cargo.toml`
# smentisce. Accesa di default: i tre client desktop previsti (CLI 27.1, API
# locale 27.2, l'app) la vogliono, e spegnerla è la scelta di chi non può averla.
notify = { version = "8.2.0", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }
# Il **database dei fusi orari** (§22.4, decisione 0091), e sta qui e solo qui:
# `fub-abi` non ha e non deve avere una dipendenza di date, perché la regola del
# contratto è aritmetica su ore civili e le ore civili non sanno cosa sia l'ora
# legale. Serve in due conversioni sole — istante → ora civile e ritorno — e
# sono in `parete.rs`.
#
# **Misurato, come vuole il precedente di `tracing`: dieci pacchetti nel
# lockfile**, da 541 a 551 (`jiff`, `jiff-core`, `jiff-static`, `jiff-tzdb`,
# `jiff-tzdb-platform`, `portable-atomic`, `portable-atomic-util`, `defmt`,
# `defmt-macros`, `defmt-parser`). Dieci volte il conto di `tracing`, e va
# scritto invece che nascosto. I tre `defmt` sono voci di lock e non
# compilazione: arrivano da un ramo `no_std` che qui non si accende.
#
# `default-features = false` toglie `serde` (un `WallClock` si serializza da sé,
# nel contratto, senza tipi di `jiff` al confine) e `logging`. Restano le tre che
# fanno il lavoro: `std`, `tz-system` per leggere il fuso della macchina, e
# le due del database: `tzdb-zoneinfo` legge `/usr/share/zoneinfo`, che su Unix
# c'è già, e `tzdb-bundle-platform` imbarca il database sulle piattaforme dove
# non c'è — cioè Windows. Sono due e non una perché coprono due mondi: con la
# sola seconda, su Linux `TimeZone::get("Europe/Rome")` fallisce, e questo si
# scopre solo eseguendo (le prove di `parete.rs` lo hanno scoperto).
#
# **L'alternativa a zero crate esiste ed è stata scartata per iscritto**: senza
# tzdb, «alle 9 a Roma» calcolato su una macchina in UTC è sbagliato di un'ora
# per metà anno, e `locale.timezone` — che è un nome IANA, e c'era già —
# smetterebbe di essere onorabile.
jiff = { version = "0.2.35", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
    "tzdb-bundle-platform",
] }
# **Il filo verso fuori** (§23.3, decisione 0097), e sta qui per la ragione di
# `notify` qui sopra, non per comodità: il trait `HostNetwork` esiste anche per
# i montaggi che una rete non ce l'hanno o non la vogliono — un vault aperto
# dalla CLI in una pipeline, un banco e2e che deve fallire se qualcuno chiama
# fuori, il giorno in cui qualcuno vorrà una build senza TLS. Una dipendenza
# obbligatoria renderebbe `Workspace::set_network` una promessa che il
# `Cargo.toml` smentisce.
#
# **Misurato, come vuole il precedente di `jiff` qui sopra: venti pacchetti nel
# lockfile**, da 551 a 571. È il doppio di `jiff` ed è il conto più caro che
# questo workspace abbia pagato per una dipendenza: va scritto invece che
# nascosto.
#
# `ureq` e non `reqwest`, che pure è **già nel lockfile** — ce lo porta `tauri`,
# quindi in `fub-app` e non qui. Costerebbe di meno in righe di lock e di più in
# tutto il resto: è asincrono, quindi vorrebbe `tokio` dentro `fub-host`, che
# oggi non ha un runtime e non ne vuole uno per una capacità sola. `ureq` è
# bloccante, ed è la forma giusta per questo posto: una `fetch` gira dentro un
# job, cioè su un thread del pool che sta lì apposta per aspettare.
#
# `platform-verifier` costa otto dei venti pacchetti, e i primi dodici
# basterebbero (`webpki-roots`, cioè le radici di Mozilla imbarcate). La scelta
# è deliberata e va nel verso di chi usa l'app: con il verificatore della
# **piattaforma**, Fub si fida di ciò di cui si fida la macchina — la CA
# aziendale installata, il certificato interno, il proxy che l'amministratore
# ha messo. Con le radici imbarcate, un utente in una rete aziendale scoprirebbe
# che «solo Fub» non riesce a connettersi, e non avrebbe **nessun modo** di
# rimediare dall'app. Otto pacchetti per non togliere all'utente una decisione
# che ha già preso sul proprio computer.
#
# `default-features = false` e poi l'elenco per esteso, così le feature sono
# **scelte** e non ereditate: i default di `ureq` sono `rustls` e `gzip`, e
# tacerli vorrebbe dire non sapere quale delle due si sta prendendo.
#
# `gzip` c'è, e non è la comodità che sembra. Senza, `ureq` non chiede la
# compressione **e non la sa disfare**: un plugin che si scrivesse da sé
# l'header `accept-encoding: gzip` riceverebbe byte che nel contratto non ha
# modo di decodificare, perché una capacità che decomprime non esiste. Costa
# **zero pacchetti** — `flate2` è già nel lockfile, ce lo portano altri — e il
# tetto di `MAX_BODY` si applica a valle della decompressione, cioè dal lato
# giusto: chi risponde non può far allocare sedici mebibyte con un `gzip`
# piccolo.
#
# Restano fuori `json` (il corpo è di byte, e chi lo interpreta è chi ha
# chiesto), `charset` e `brotli` — e soprattutto `cookies`, che in un client
# condiviso da tutti i plugin sarebbe uno stato che passa **fra plugin
# diversi** senza che nessuno lo abbia dichiarato.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "gzip",
], optional = true }

[features]
default = ["notify-watcher", "http-client", "feature-ufficiali"]
notify-watcher = ["dep:notify", "dep:notify-debouncer-full"]

# Il client HTTP: acceso di default come il watcher, e per la stessa ragione —
# i client desktop previsti (CLI 27.1, API locale 27.2, l'app) lo vogliono, e
# spegnerlo è la scelta di chi non può o non vuole averlo.
http-client = ["dep:ureq"]

# **Le feature ufficiali, una cargo feature per bundle** (§16.3). Inoltrano e
# basta: l'elenco vero è `fub_features::ogni_feature_ufficiale`, e questi nomi
# sono i suoi. Chi ne spegne una toglie la riga dall'inventario, quindi il
# bundle non si monta — non c'è uno stato in cui la feature sia compilata e non
# dichiarata, o dichiarata e non compilata.
feature-ufficiali = [
    "search",
    "versioning",
    "backlinks",
    "outline",
    "tags",
    "trash",
    "stats",
    "graph",
    "commands",
    "blocks",
]
search = ["fub-features/search"]
versioning = ["fub-features/versioning"]
backlinks = ["fub-features/backlinks"]
outline = ["fub-features/outline"]
tags = ["fub-features/tags"]
trash = ["fub-features/trash"]
stats = ["fub-features/stats"]
graph = ["fub-features/graph"]
commands = ["fub-features/commands"]
blocks = ["fub-features/blocks"]

[dev-dependencies]
# Il banco del lato host (§16.2).
fub-testkit = { workspace = true }
tempfile = "3.27.0"
