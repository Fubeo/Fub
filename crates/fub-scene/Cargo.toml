[package]
name = "fub-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lettura delle scene FubDraw: SVG classificati in elementi modificabili e blocchi estranei, codec dell'inchiostro (riesportato da `fub-ink-codec`), analisi e diagnostica. Puro: niente ABI di Fub, niente kernel, niente I/O."

[dependencies]
# Il codec di `fub:ink` e la grammatica di `fub:brush` stanno in un crate
# loro, senza XML, perché li usa anche il nucleo della lavagna (ADR 0204).
fub-ink-codec = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
