[package]
name = "fub-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lettura delle scene FubDraw: SVG classificati in elementi modificabili e blocchi estranei, codec dell'inchiostro, analisi e diagnostica. Puro: niente ABI di Fub, niente kernel, niente I/O."

[dependencies]
# Il campione del tratto è del nucleo dell'inchiostro, che è puro e non ha
# dipendenze a sua volta: il codec lo quantizza, non ne ridefinisce il tipo.
fub-ink = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
