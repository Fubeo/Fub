[package]
name = "fub-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fub's self-hostable account/sync/publish backend: localhost-first HTTP service with durable filesystem storage. No cloud endpoints, no credentials invented."

[dependencies]
fub-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Centralizzate da Main nel workspace (niente duplicazione versioni):
# ring 0.17.14, base64 0.22.1, uuid 1.24.0/v4. httparse resta qui (solo
# binario servizio, mai host/kernel/ABI).
ring = { workspace = true }
subtle = "2.6.1"
base64 = { workspace = true }
uuid = { workspace = true }
httparse = "1.10.1"
# Già in Cargo.lock (0.12.5): Mutex senza avvelenamento per lo stato condiviso
# del binario (regola rs-parking-lot).
parking_lot = { workspace = true }
[lib]
name = "fub_services"
path = "src/lib.rs"

[[bin]]
name = "fub-services"
path = "src/main.rs"
