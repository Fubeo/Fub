[package]
name = "fub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri v2 glue for Fub: IPC commands/events, windows, dialogs. Assembly lives in `fub-host`."

[lib]
name = "fub_app_lib"
# **Solo `rlib`.** Il template di Tauri v2 scrive qui
# `["staticlib", "cdylib", "rlib"]` perché il `.a` serve a iOS e il `.so` ad
# Android; qui non c'è nessun target mobile — `gen/schemas/` conosce solo
# `desktop-schema.json` e `linux-schema.json` — e i due artefatti in più non li
# consumava nessuno: il binario `fub` linka il solo `.rlib`, e lo stesso fa
# `tests/ts_mirror_app.rs`. Erano tre codegen e tre link dell'intero albero,
# tauri compreso, per 883 righe di sorgente. Le due parole tornano **insieme al
# target che le consuma**: `.github/workflows/mobile.yml` le aggiunge nel suo
# runner prima del build Android, e il ciclo desktop non le paga.
crate-type = ["rlib"]

[[bin]]
name = "fub"
path = "src/main.rs"

[dependencies]
fub-abi = { workspace = true }
fub-kernel = { workspace = true }
# Chi monta: registro, feature, sessione, watcher, ponte eventi (§8.2).
#
# L'app è la build **piena**, e le feature ufficiali le chiede **per nome**
# invece di ereditarle dal `default` di qualcun altro: una dipendenza che regge
# finché nessuno tocca il `Cargo.toml` di un altro crate non è una dipendenza,
# è una coincidenza. Qui non c'è una cargo feature per bundle perché
# l'applicazione che spediamo le ha tutte; chi vuole compilarne meno lo fa
# sotto — su `fub-host` o su `fub-features`, che è dove il guadagno di
# compilazione sta.
#
# **`fub-features` non è qui, ed è il punto.** C'era, «solo per `VersionRef`,
# che è un tipo che attraversa l'IPC», e quella riga diceva due cose non più
# vere. La prima: `VersionRef` per di qui non passa più. `list_versions`,
# `read_version` e `restore_version` sono spariti quando la cronologia è
# diventata un `ViewProvider` della feature versioning (§1.2), e `src/` non
# nomina `fub_features` da nessuna parte. La seconda, che era falsa anche
# prima: chiedere `fub-features/versioning` da qui **non accendeva** ciò che si
# credeva di accendere. I `#[cfg(feature = "versioning")]` che gatano
# `Session::versions` stanno su **`fub-host`**, e le cargo feature non
# risalgono: accendere quella del crate sotto lasciava quel `#[cfg]` spento.
# Una feature si chiede al crate da cui si dipende — è l'unico che sappia
# tradurla — ed è ciò che `features = [...]` qui sopra fa adesso.
# `features = [...]` above does now.
fub-host = { workspace = true, features = ["official-features"] }
fub-wasm-host = { workspace = true }
# La sessione live (ADR 0205): l'app la compone sul runtime di Tauri, che è lo
# stesso `tokio`, e la affaccia alla shell con i comandi `live_*`. `rt` serve a
# chiudere le sessioni tutte insieme, `sync` a contare le chiusure in corso e
# `time` a dare loro una scadenza quando l'app esce.
fub-live = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Il nome del PC che il tablet mostra prima di collegarsi.
gethostname = "1.1.0"
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Il limite a 60 Hz di WebKit su macOS si spegne da `frame_rate.rs`; è la
# stessa versione che Tauri e wry già portano.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Il limite a 60 Hz di WebKitGTK si spegne da `frame_rate.rs` sulle
# `WebKitSettings` della webview: è la stessa versione che wry già porta (il
# tipo di `PlatformWebview::inner`), quindi il lock non cresce. Le funzioni
# delle feature (2.42) non sono nel crate e si cercano a runtime. Lo usa anche
# il gancio della raccolta forzata del banco della memoria (`bench_gc.rs`, solo
# con la feature `bench-gc`) per dire a WebKitGTK dove sta l'estensione; `v2_38`
# è la feature che wry stesso accende.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Il vblank emulato (`vblank.rs`): `dlsym`, `clock_nanosleep`, `fstat` e la
# disposizione di `timespec` e `stat`. È la versione del workspace, già
# nell'albero (tokio, mio, …): il lock non cresce.
libc = { workspace = true }

# La cartella di Windows chiesta al sistema (`GetSystemWindowsDirectoryW`,
# `print.rs`) invece che a `SystemRoot`, che viene dall'ambiente di chi avvia
# l'app: lì `explorer.exe` si cerca per percorso assoluto. È la versione del
# workspace, già nell'albero con la stessa feature (la accende
# `winapi-util`): il grafo non cresce, si aggiunge un nome.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[features]
# Vuoto: le feature di `fub-app` servono al banco, non all'app che si usa.
default = []
# Il gancio della raccolta forzata per il banco della memoria (R1, #284):
# l'app carica l'estensione web che `FUB_BENCH_GC` nomina. **Spento di serie**:
# l'app che si distribuisce non sa caricare un'estensione da una cartella che
# sceglie l'ambiente. Lo accende soltanto la build del banco WebView (job
# `webview` di `ci.yml`, `misura.sh`). `webkit2gtk` su Linux c'è già per
# `frame_rate.rs`: la feature non aggiunge dipendenze.
bench-gc = []

[dev-dependencies]
# Le prove del registro delle sessioni live, con il tempo in pausa.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# tauri-build aggiunto con `cargo add` (versione corrente)
