[package]
name = "fub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri v2 glue for Fub: IPC commands/events, windows, dialogs. Assembly lives in `fub-host`."

[lib]
name = "fub_app_lib"
# **Solo `rlib`.** Il template di Tauri v2 scrive qui
# `["staticlib", "cdylib", "rlib"]` perché il `.a` serve a iOS e il `.so` ad
# Android; qui non c'è nessun target mobile — `gen/schemas/` conosce solo
# `desktop-schema.json` e `linux-schema.json` — e i due artefatti in più non li
# consumava nessuno: il binario `fub` linka il solo `.rlib`, e lo stesso fa
# `tests/ts_mirror_app.rs`. Erano tre codegen e tre link dell'intero albero,
# tauri compreso, per 883 righe di sorgente. Se un giorno arriva il mobile, le
# due parole tornano **insieme al target che le consuma**, non prima.
crate-type = ["rlib"]

[[bin]]
name = "fub"
path = "src/main.rs"

[dependencies]
fub-abi = { workspace = true }
fub-kernel = { workspace = true }
# Chi monta: registro, feature, sessione, watcher, ponte eventi (§8.2).
#
# L'app è la build **piena**, e le feature ufficiali le chiede **per nome**
# invece di ereditarle dal `default` di qualcun altro: una dipendenza che regge
# finché nessuno tocca il `Cargo.toml` di un altro crate non è una dipendenza,
# è una coincidenza. Qui non c'è una cargo feature per bundle perché
# l'applicazione che spediamo le ha tutte; chi vuole compilarne meno lo fa
# sotto — su `fub-host` o su `fub-features`, che è dove il guadagno di
# compilazione sta.
#
# **`fub-features` non è qui, ed è il punto.** C'era, «solo per `VersionRef`,
# che è un tipo che attraversa l'IPC», e quella riga diceva due cose non più
# vere. La prima: `VersionRef` per di qui non passa più. `list_versions`,
# `read_version` e `restore_version` sono spariti quando la cronologia è
# diventata un `ViewProvider` della feature versioning (§1.2), e `src/` non
# nomina `fub_features` da nessuna parte. La seconda, che era falsa anche
# prima: chiedere `fub-features/versioning` da qui **non accendeva** ciò che si
# credeva di accendere. I `#[cfg(feature = "versioning")]` che gatano
# `Session::versions` stanno su **`fub-host`**, e le cargo feature non
# risalgono: accendere quella del crate sotto lasciava quel `#[cfg]` spento.
# Una feature si chiede al crate da cui si dipende — è l'unico che sappia
# tradurla — ed è ciò che `features = [...]` qui sopra fa adesso.
# `features = [...]` above does now.
fub-host = { workspace = true, features = ["official-features"] }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tracing = { workspace = true }
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# tauri-build aggiunto con `cargo add` (versione corrente)
