[package]
name = "fub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Colla Tauri v2 di Fub: comandi/eventi IPC, finestre, dialoghi. Chi monta è `fub-host`."

[lib]
name = "fub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fub"
path = "src/main.rs"

[dependencies]
fub-abi = { workspace = true }
fub-kernel = { workspace = true }
# Chi monta: registro, feature, sessione, watcher, ponte eventi (§8.2).
fub-host = { workspace = true }
# Solo per `VersionRef`, che è un tipo che attraversa l'IPC — e la feature che
# lo possiede va chiesta per nome (§16.3). Che `fub-host` la accenda già di suo
# non basta a renderla nostra: sarebbe una dipendenza che regge finché nessuno
# tocca il `Cargo.toml` di qualcun altro.
#
# L'app è la build **piena**: qui non c'è una cargo feature per bundle perché
# l'applicazione che spediamo le ha tutte, e chi vuole compilarne meno lo fa
# sotto — su `fub-features` o su `fub-host`, che è dove il guadagno di
# compilazione sta.
fub-features = { workspace = true, features = ["versioning"] }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tracing = { workspace = true }
tauri-plugin-dialog = "2.7.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# tauri-build aggiunto con `cargo add` (versione corrente)
