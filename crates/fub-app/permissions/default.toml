# Every application command is confined to the main local app capability.
# Without an app manifest Tauri permits *all* local webviews to invoke custom
# commands, including a document child or an about:blank viewer (Tauri 2.11).
[default]
permissions = ["allow-shell"]

[[permission]]
identifier = "allow-shell"
description = "Existing host commands and native window lifecycle, main webview only."
commands.allow = [
  "open_vault",
  "close_vault",
  "list_vaults",
  "discard_draft",
  "set_active_context",
  "set_system_locale",
  "set_current_vault",
  "initial_vault",
  "session_notice",
  "demo_root",
  "open_demo",
  "close_demo",
  "reset_demo",
  "startup_diagnostics",
  "support_preview",
  "support_export",
  "config_health",
  "recover_config",
  "read_document",
  "list_grid_surfaces",
  "open_grid",
  "grid_window",
  "apply_grid",
  "reload_grid",
  "close_grid",
  "write_document",
  "save_draft",
  "list_bundles",
  "resource_open",
  "resource_read_chunk",
  "resource_close",
  "resource_write",
  "viewer_open",
  "viewer_save",
  "save_artifact",
  "list_themes",
  "plugin_budget_snapshot",
  "plugin_limited_mode",
  "catalog_search",
  "catalog_install",
  "catalog_update",
  "catalog_rollback",
  "catalog_revoke",
  "catalog_install_theme",
  "catalog_update_theme",
  "catalog_rollback_theme",
  "catalog_revoke_theme",
  "list_installed_plugins",
  "list_views",
  "render_view",
  "view_action",
  "list_commands",
  "invoke_command",
  "query_index",
  "cancel_job",
  "set_icon",
  "set_pinned",
  "set_space",
