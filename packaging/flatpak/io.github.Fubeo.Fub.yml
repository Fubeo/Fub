# Il Flatpak di Fub: lo stesso WebKitGTK su ogni distribuzione, quello del
# modulo `webkit2gtk-4.1` qui sotto (non quello del runtime GNOME). Si costruisce dai sorgenti, senza rete: le dipendenze di Cargo
# e di npm sono sorgenti dichiarate qui sotto, che `genera-sorgenti.sh` ricava
# da `Cargo.lock` e da `apps/client/package-lock.json` (vedi README.md e
# docs/development/versioning-and-releases.md, sezione «Flatpak»).
#
# L'id resta questo per sempre: cambiarlo vorrebbe dire perdere gli
# aggiornamenti di chi ha già installato Fub.
id: io.github.Fubeo.Fub
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
# Node viene dall'estensione del SDK freedesktop 26.08, la base di GNOME 51.
# Rust no: l'estensione rust-stable non ha il bersaglio wasm32-unknown-unknown,
# che serve alla build del client (il nucleo della lavagna), e segue l'ultima
# stabile; il toolchain 1.95 qui sotto è quello fissato dalla CI (ADR 0221).
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: fub

finish-args:
  # La finestra: Wayland, X11 solo dove Wayland manca, la memoria condivisa
  # di X11 e la GPU per WebKitGTK.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # La rete. Fub la usa per il controllo degli aggiornamenti (solo
  # api.github.com, lo chiude il Guard), per la sessione live col tablet sulla
  # rete di casa, per il web viewer e per il canale di controllo fra
  # `fub-cli` e l'app, che passa dal loopback: senza rete ogni `flatpak run`
  # ha un loopback suo e la CLI non trova l'app che tiene aperto il vault.
  - --share=network
  # I file. Il vault si sceglie col portale dei file, ma il portale dei
  # documenti (FUSE in /run/user/<uid>/doc) non fa arrivare a inotify le
  # modifiche fatte da un altro programma sul file vero
  # (flatpak/xdg-desktop-portal#567, libfuse/libfuse#328): il watcher non le
  # vedrebbe e l'indice resterebbe indietro in silenzio. Per questo Fub vede
  # la home e i dischi esterni: per un percorso che l'app può già leggere il
  # portale restituisce il percorso vero, e inotify funziona. Un vault fuori
  # da qui passa ancora dal portale, senza le modifiche esterne.
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  # Una sola istanza: il plugin single-instance di Tauri prende questo nome
  # sul bus di sessione (l'identificatore Tauri più `.SingleInstance`); senza
  # il permesso la seconda istanza non passerebbe i link `fub://` alla prima.
  - --own-name=dev.fub.app.SingleInstance

modules:
  # WebKitGTK scelto da noi, non quello del runtime. Il runtime GNOME 51 ha la
  # 2.54.1, che dopo un'animazione rimette sullo schermo per un istante pezzi
  # di un fotogramma vecchio (docs/architecture/desktop-webview.md). Questo
  # modulo installa libwebkit2gtk-4.1 e i suoi processi in /app: il linker di
  # Flatpak cerca in /app/lib prima che in /usr/lib, e WebKit avvia i processi
  # dal percorso con cui è compilato (/app/libexec/webkit2gtk-4.1), quindi Fub
  # usa solo questa copia, anche in fase di build (pkg-config trova prima
  # /app/lib/pkgconfig). Gli aggiornamenti di sicurezza di WebKitGTK sono a
  # carico nostro: a ogni release di webkitgtk.org si cambiano `url` e `sha256`
  # (il file `.sums` accanto al tarball), come spiega packaging/flatpak/README.md.
  #
  # Le opzioni sono quelle di gnome-build-meta per il runtime GNOME 51
  # (elements/sdk/webkit2gtk-4.1.bst e webkitgtk.inc, ramo gnome-51), con
  # queste differenze: niente MiniBrowser, documentazione e introspezione, che
  # Fub non usa; unifdef è quello incluso nei sorgenti (il SDK non lo ha); il
  # compilatore è il GCC del SDK invece di clang, che nel SDK non c'è; niente
  # simboli di debug, che per WebKit sono gigabyte.
  - name: webkit2gtk-4.1
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      no-debuginfo: true
      cflags: -g0
      cxxflags: -g0
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPORT=GTK
      - -DENABLE_SPEECH_SYNTHESIS=OFF
      - -DENABLE_WEBDRIVER=OFF
      - -DUSE_LIBBACKTRACE=OFF
      - -DUSE_GTK4=OFF
      - -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
      - -DENABLE_MINIBROWSER=OFF
      - -DENABLE_DOCUMENTATION=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DUSE_SYSTEM_UNIFDEF=OFF
    # Le intestazioni e i .pc servono solo alla build di Fub, che viene dopo:
    # la pulizia toglie tutto alla fine. `jsc` è la shell di JavaScriptCore.
    cleanup:
      - /include
      - /lib/pkgconfig
      - /libexec/webkit2gtk-4.1/jsc
    sources:
      - type: archive
        url: https://webkitgtk.org/releases/webkitgtk-2.54.3.tar.xz
        sha256: 2779c1b46f88762e8400650271ba14452dc4e30b37059981552d8b562b7d0862

  - name: fub
    buildsystem: simple
    build-options:
      append-path: /run/build/fub/rust-toolchain/sysroot/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/fub/cargo
        CARGO_NET_OFFLINE: "true"
        npm_config_cache: /run/build/fub/flatpak-node/npm-cache
        npm_config_offline: "true"
        XDG_CACHE_HOME: /run/build/fub/flatpak-node/cache
    build-commands:
      # Il toolchain Rust 1.95, con la libreria per wasm32-unknown-unknown,
      # in una cartella della build: non entra nell'app.
      - ./rust-toolchain/rust/install.sh --prefix=/run/build/fub/rust-toolchain/sysroot --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu --disable-ldconfig
      - ./rust-toolchain/rust-std-wasm32/install.sh --prefix=/run/build/fub/rust-toolchain/sysroot --disable-ldconfig
      - rustc --version && cargo --version && node --version
      # Il client: npm dalla cache offline, poi Vite (che compila anche il
      # modulo WebAssembly della lavagna con lo stesso cargo).
      - cd apps/client && npm ci --offline --no-audit --no-fund
      - cd apps/client && npm run build
      # L'app e la CLI, come la release: `custom-protocol` serve il client dal
      # binario invece che dal server di sviluppo.
      - cargo build --release --locked --offline -p fub-app --features tauri/custom-protocol
      - cargo build --release --locked --offline -p fub-cli --bin fub-cli
      - install -Dm755 target/release/fub ${FLATPAK_DEST}/bin/fub
      - install -Dm755 target/release/fub-cli ${FLATPAK_DEST}/bin/fub-cli
      # Le icone sono quelle del bundle Tauri (crates/fub-app/tauri.conf.json),
      # con il nome dell'id come vuole Flatpak.
      - install -Dm644 crates/fub-app/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 crates/fub-app/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 crates/fub-app/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # Il repository com'è, senza ciò che una build locale lascia accanto:
      # `.flatpak-builder`, `flatpak_app` e `repo` sono le cartelle che
      # l'azione flatpak-builder della CI crea nella radice.
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - .flatpak-builder
          - flatpak_app
          - repo
          - target
          - node_modules
          - apps/client/node_modules
          - apps/client/dist
          - packaging/flatpak/generated
          - tools/varco-wasm/target
          - tools/ink-wasm-banco/target
          - esempi/ping-wasm/target
      # Rust 1.95 per x86_64 e la sua libreria per wasm32-unknown-unknown, da
      # static.rust-lang.org con l'impronta pubblicata accanto.
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.95.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 2e0338f18ecbaa4a0f631b9e80e8b8e26bb6fe77dd5454fba8a70cf96c1e84a1
        dest: rust-toolchain/rust
      - type: archive
        url: https://static.rust-lang.org/dist/rust-std-1.95.0-wasm32-unknown-unknown.tar.xz
        sha256: 5587b89ff69623d09e476439d44a24453b4e4ea3d5e0b53a5c0a935151ff3fd1
        dest: rust-toolchain/rust-std-wasm32
      # Generati da genera-sorgenti.sh, mai a mano e mai nel repository.
      - generated/cargo-sources.json
      - generated/node-sources.json
