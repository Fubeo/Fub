<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installato come /app/etc/fonts/local.conf: il fonts.conf del runtime lo
  include (conf.d/50-flatpak.conf), prima delle cartelle dei caratteri
  dell'host (/run/host/fonts, /run/host/user-fonts).

  Il fontconfig del runtime GNOME 51 (2.18) legge i .woff e i .woff2
  dell'host senza nome di famiglia, e WebKitGTK 2.54 (Skia,
  SkFontMgr_fontconfig::GetFamilyNames) gira all'infinito su un carattere
  senza famiglia: il processo web resta al 100% e la pagina non parte mai.
  Basta un pacchetto come fonts-material-design-icons-iconfont di Debian.
  Senza famiglia quei file non servono comunque a nessuno: si scartano.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
