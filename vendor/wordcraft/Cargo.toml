# Il workspace dei sei crate di WordCraft copiati (vedi UPSTREAM.md). È di
# Fub, non dell'upstream: i manifest dei crate restano quelli dell'upstream ed
# ereditano da qui versione, edizione, licenza, lint e dipendenze. Le scelte di
# Fub stanno in questo file solo.
#
# Sta fuori dal workspace di Fub (`exclude` nel Cargo.toml radice): Fub prende
# i sei crate come dipendenze a percorso, con il proprio Cargo.lock; i test
# dell'upstream girano qui, con il Cargo.lock accanto:
#
#   cargo test --manifest-path vendor/wordcraft/Cargo.toml --workspace --locked
[workspace]
resolver = "3"
members = [
    "crates/geom",
    "crates/doc",
    "crates/docx",
    "crates/docbin",
    "crates/formats",
    "crates/proof",
]

[workspace.package]
# La versione dell'upstream: `tools/vendor-craft/vendor.mjs` la riporta qui,
# nelle righe `wordcraft-*` qui sotto e in quelle del Cargo.toml di Fub.
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Codice di terzi: gli avvisi li corregge l'upstream, non una copia. I lint di
# Fub non lo guardano, perché non è un membro del suo workspace.
[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "allow"

[workspace.lints.clippy]
all = "allow"

# Le versioni di quelle in comune con Fub sono le stesse del Cargo.toml radice
# (lo controlla `vendor.mjs check`). Rispetto all'upstream:
# - `zip` 9 al posto di 3, per RUSTSEC-2026-0367, -0368 e -0369;
# - `serde_json` senza `float_roundtrip`: le feature si unificano in tutto il
#   grafo di Fub, e la libreria lo usa solo per leggere un colore;
# - `image` accende soltanto `png` e `bmp`, i due decodificatori senza
#   dipendenze in più: un'immagine d'altro formato si legge, senza la misura in
#   pixel (UPSTREAM.md).
[workspace.dependencies]
wordcraft-geom = { path = "crates/geom", version = "0.9.0" }
wordcraft-doc = { path = "crates/doc", version = "0.9.0" }
wordcraft-docx = { path = "crates/docx", version = "0.9.0" }
wordcraft-docbin = { path = "crates/docbin", version = "0.9.0" }
wordcraft-formats = { path = "crates/formats", version = "0.9.0" }
wordcraft-proof = { path = "crates/proof", version = "0.9.0" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
proptest = "1"
unicode-segmentation = "1"
unicode-bidi = "0.3"
quick-xml = "0.41.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
miniz_oxide = "0.8"
cfb = "0.15"
encoding_rs = "0.8"
chardetng = "1"
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22.1"
getrandom = "0.3"
zeroize = "1.9.0"
