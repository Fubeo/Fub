<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FubMD</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="brand">FubMD</span>
        <button id="open-vault">Apri vault…</button>
        <button id="show-graph" title="Il grafo dei collegamenti del vault">Grafo</button>
        <span id="vault-path" class="muted"></span>
      </header>
      <main id="layout">
        <aside id="sidebar">
          <input
            id="search-input"
            type="search"
            placeholder="Cerca nel vault…"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="search-panel" hidden>
            <div class="panel-title" id="search-summary">Risultati</div>
            <ul id="search-results"></ul>
          </div>
          <div id="files-panel">
            <div id="space-strip"></div>
            <div class="panel-title" id="files-title">
              <span id="space-title">Note</span>
              <button id="new-note" class="link-button" title="Crea una nota nuova">
                + Nuova
              </button>
              <button id="show-trash" class="link-button" title="Apri il cestino">
                Cestino
              </button>
            </div>
            <div class="panel-title" id="pinned-title" hidden><span>Appuntate</span></div>
            <ul id="pinned-list" hidden></ul>
            <ul id="file-list"></ul>
          </div>
          <div id="views-left"></div>
          <div id="trash-panel" hidden>
            <div class="panel-title">
              <span>Cestino</span>
              <button id="empty-trash" class="link-button" title="Cancella tutto per sempre">
                Svuota
              </button>
              <button id="close-trash" class="link-button" title="Torna alle note">
                Chiudi
              </button>
            </div>
            <ul id="trash-list"></ul>
          </div>
        </aside>
        <section id="editor-pane">
          <div id="editor"></div>
        </section>
        <section id="right-pane">
          <!-- Le view dichiarative (Struttura, Tag, Backlink, …) si montano
               qui per placement: gli id e i titoli li dichiara il backend. -->
          <div id="views-right"></div>
          <div class="panel-title">Anteprima</div>
          <div id="preview" class="markdown-preview"></div>
          <div id="history-panel" hidden>
            <div class="panel-title">
              <span>Cronologia</span>
              <span id="history-summary" class="muted"></span>
            </div>
            <ul id="history-list"></ul>
            <pre id="history-preview" hidden></pre>
          </div>
        </section>
        <section id="views-bottom" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
