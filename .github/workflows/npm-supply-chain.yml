name: NPM supply chain

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: read

jobs:
  npm-supply-chain:
    name: npm (licenze + audit + SBOM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Installa esattamente il lockfile
        run: npm ci
      - name: Nessuna vulnerabilità alta o critica
        run: npm audit --audit-level=high
      - name: Genera SBOM npm SPDX
        run: npm sbom --sbom-format=spdx > fub-client-sbom.spdx.json
      - name: Valida SPDX e licenze
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { createHash } from "node:crypto";
            const sbom = JSON.parse(fs.readFileSync("fub-client-sbom.spdx.json", "utf8"));
            if (sbom.spdxVersion !== "SPDX-2.3") {
              throw new Error(`versione SPDX inattesa: ${sbom.spdxVersion}`);
            }
            if (!Array.isArray(sbom.packages) || sbom.packages.length === 0) {
              throw new Error("SBOM npm senza pacchetti");
            }
            const allowed = new Set([
              "MIT",
              "ISC",
              "BSD-2-Clause",
              "BSD-3-Clause",
              "Apache-2.0",
              "MIT OR Apache-2.0",
              "Apache-2.0 OR MIT",
              "MPL-2.0",
              "OFL-1.1",
              "Unlicense",
              "(MPL-2.0 OR Apache-2.0)",
            ]);
            // Licenze complete esaminate, non euristiche né NOASSERTION ammesso.
            // Il pacchetto khroma 2.1.0 distribuisce questa MIT ma omette license.
            const reviewedLicenseFiles = new Map([
              ["66b333b0f66759a0b710459e03f7029abe17f4358114a128d2c972e642961b49", "MIT"],
            ]);
            const rejected = [];
            for (const pkg of sbom.packages) {
              if (pkg.name === "fub-frontend") continue;
              let license = pkg.licenseConcluded ?? pkg.licenseDeclared ?? "NOASSERTION";
              if (license === "NOASSERTION") {
                const directory = `node_modules/${pkg.name}`;
                const metadataPath = `${directory}/package.json`;
                const metadata = fs.existsSync(metadataPath)
                  ? JSON.parse(fs.readFileSync(metadataPath, "utf8"))
                  : null;
                if (metadata?.name === pkg.name && metadata?.version === pkg.versionInfo) {
                  for (const filename of ["LICENSE", "LICENSE.md", "LICENSE.txt", "license"]) {
                    const path = `${directory}/${filename}`;
                    if (!fs.existsSync(path)) continue;
                    const hash = createHash("sha256").update(fs.readFileSync(path)).digest("hex");
                    const reviewed = reviewedLicenseFiles.get(hash);
                    if (!reviewed) continue;
                    license = reviewed;
                    pkg.licenseConcluded = reviewed;
                    pkg.licenseComments = `Testo verificato: ${filename}, SHA-256 ${hash}`;
                    break;
                  }
                }
              }
              if (!allowed.has(license)) {
                rejected.push(`${pkg.name}@${pkg.versionInfo ?? "?"}: ${license}`);
              }
            }
            if (rejected.length > 0) {
              throw new Error(`licenze npm non approvate:\n${rejected.join("\n")}`);
            }
            fs.writeFileSync("fub-client-sbom.spdx.json", JSON.stringify(sbom, null, 2) + "\n");
            console.log(`SBOM npm valido: ${sbom.packages.length} pacchetti; licenze approvate`);
          '
      - name: Pubblica SBOM npm
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-sbom-spdx
          path: apps/client/fub-client-sbom.spdx.json
