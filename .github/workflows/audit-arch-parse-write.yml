name: Audit ARCH write parse outside lock

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-arch-parse-write.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
      - name: Applica e verifica il parse delle scritture staccato
        run: |
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          python .audit-arch-parse-write-scriptfix.py
          python .audit-arch-parse-write.py
          cargo fmt --all
          if ! (cargo test -p fub-host --test concurrency && cargo test -p fub-kernel --test guarded_write && cargo test -p fub-kernel --test write_atomicity && cargo test -p fub-kernel --test write_knows_what_it_wrote && cargo test -p fub-format-markdown --test parsed_model_e2e && cargo test -p fub-kernel registry::tests && cargo test -p fub-kernel syntax::tests && cargo check -p fub-host --all-targets && cargo clippy -p fub-host -p fub-kernel --all-targets -- -D warnings) > /tmp/arch-parse-write.log 2>&1; then
            tail -n 500 /tmp/arch-parse-write.log > .audit-arch-parse-write-error.txt
            git add .audit-arch-parse-write-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci(temp): cattura errore ARCH parse write"
              git push origin HEAD:fix/audit-integration
            fi
            cat .audit-arch-parse-write-error.txt
            exit 1
          fi
          git rm -f .audit-arch-parse-write.py .audit-arch-parse-write-scriptfix.py .github/workflows/audit-arch-parse-write.yml
          rm -f .audit-arch-parse-write-error.txt
          git add -u
          git add crates/fub-kernel/src/registry.rs crates/fub-kernel/src/syntax.rs crates/fub-kernel/src/documents.rs crates/fub-kernel/src/workspace.rs crates/fub-host/src/session.rs crates/fub-host/tests/concurrency.rs
          git commit -m "refactor(host): esegue il parse delle scritture fuori dal lock"
          git push origin HEAD:fix/audit-integration

# retry: generator fixed
