name: Audit follow-up

'on':
  push:
    branches:
      - fix/audit-integration
    paths:
      - .github/workflows/audit-followup.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Rende portabile il banco del vault che scompare
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              seen = text.count(old)
              if seen != expected:
                  raise SystemExit(
                      f"{path}: attesi {expected} anchor, trovati {seen}: {old!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          vanished = "crates/fub-host/tests/the_vault_that_vanishes.rs"
          replace_exact(
              vanished,
              "fn open_and_vanished(host: &Host) -> (tempfile::TempDir, Utf8PathBuf) {\n",
              "// `RootedFsStorage` tiene intenzionalmente il capability della directory\n"
              "// senza `FILE_SHARE_DELETE` su Windows: è la barriera che impedisce a un nome\n"
              "// ambientale sostituito durante il mount di cambiare ciò che il vault indica.\n"
              "// Là una cancellazione fisica mentre la sessione è aperta non è quindi una\n"
              "// simulazione valida. Qui Unix esercita il ramo della sessione con l'unlink\n"
              "// reale; il banco multipiattaforma più sotto esercita il ramo del registro dopo\n"
              "// che la sessione ha rilasciato ordinatamente tutti i capability.\n"
              "#[cfg(unix)]\n"
              "fn open_and_vanished(host: &Host) -> (tempfile::TempDir, Utf8PathBuf) {\n",
          )
          replace_exact(
              vanished,
              "#[test]\nfn a_vault_vanished_from_the_disk_is_closes_the_same() {\n",
              "#[test]\n#[cfg(unix)]\nfn a_vault_vanished_from_the_disk_is_closes_the_same() {\n",
          )
          replace_exact(
              vanished,
              "#[test]\nfn a_vault_vanished_and_again_nameable_for_name() {\n",
              "#[test]\n#[cfg(unix)]\nfn a_vault_vanished_and_again_nameable_for_name() {\n",
          )
          replace_exact(
              vanished,
              "    let (_dir, root) = open_and_vanished(&host);\n"
              "    host.close_vault(&root).expect(\"chiuso\");\n\n"
              "    host.set_vault_favorite(&root, true)\n",
              "    let (_dir, root) = folder();\n"
              "    std::fs::write(root.join(\"Nota.md\"), \"# Nota\\n\").expect(\"writes\");\n"
              "    let root = root.canonicalize_utf8().expect(\"still exists\");\n"
              "    host.open(&root).expect(\"opens\");\n"
              "    host.wait_indexed(None).expect(\"waits for indexing\");\n"
              "    host.close_vault(&root).expect(\"chiuso\");\n\n"
              "    // Dopo la chiusura non resta alcun capability sul filesystem, quindi anche\n"
              "    // Windows può rappresentare onestamente la radice che scompare. La voce\n"
              "    // rimane nel registro e deve continuare a essere usabile col nome già noto.\n"
              "    std::fs::remove_dir_all(&root).expect(\"the directory is gone\");\n"
              "    assert!(!root.exists(), \"the root has really vanished\");\n\n"
              "    host.set_vault_favorite(&root, true)\n",
          )

          session = "crates/fub-host/src/session.rs"
          replace_exact(
              session,
              "#[cfg(all(test, feature = \"versioning\"))]\nmod tests {\n",
              "#[cfg(test)]\n"
              "mod vanished_session_key_tests {\n"
              "    use super::*;\n"
              "    use crate::watcher::NoWatcher;\n\n"
              "    #[test]\n"
              "    fn a_known_session_key_does_not_go_back_to_disk() {\n"
              "        let live_dir = tempfile::tempdir().expect(\"tempdir\");\n"
              "        let live = Utf8PathBuf::from_path_buf(live_dir.path().to_path_buf())\n"
              "            .expect(\"utf8\");\n"
              "        std::fs::write(live.join(\"Nota.md\"), \"# Nota\\n\").expect(\"writes\");\n"
              "        let live = live.canonicalize_utf8().expect(\"the live root exists\");\n\n"
              "        let host = Host::new().with_watcher(Box::new(NoWatcher));\n"
              "        host.open(&live).expect(\"opens\");\n"
              "        host.wait_indexed(None).expect(\"waits for indexing\");\n\n"
              "        let vanished = {\n"
              "            let dir = tempfile::tempdir().expect(\"tempdir\");\n"
              "            Utf8PathBuf::from_path_buf(dir.path().to_path_buf()).expect(\"utf8\")\n"
              "        };\n"
              "        assert!(!vanished.exists(), \"the namespace entry is really absent\");\n\n"
              "        {\n"
              "            let mut sessions = host.sessions.write().expect(\"sessions\");\n"
              "            let mut session = sessions.open.remove(&live).expect(\"the live session\");\n"
              "            session.root = vanished.clone();\n"
              "            sessions.open.insert(vanished.clone(), session);\n"
              "        }\n\n"
              "        assert_eq!(\n"
              "            host.root(Some(vanished.as_str()))\n"
              "                .expect(\"a known session key does not ask the disk\"),\n"
              "            vanished\n"
              "        );\n"
              "        let issues = host\n"
              "            .close_vault(&vanished)\n"
              "            .expect(\"closing a known session key does not ask the disk\");\n"
              "        assert!(issues.is_empty(), \"the real workspace closes: {issues:?}\");\n"
              "        assert!(host.vaults().is_empty(), \"the session leaves the map\");\n"
              "    }\n"
              "}\n\n"
              "#[cfg(all(test, feature = \"versioning\"))]\n"
              "mod tests {\n",
          )
          PY

      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Formato e regressioni mirate
        run: |
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test -p fub-host --lib a_known_session_key_does_not_go_back_to_disk
          cargo test -p fub-host --test the_vault_that_vanishes

      - name: Checkpoint e rimozione del helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-followup.yml
          git add crates/fub-host/src/session.rs \
                  crates/fub-host/tests/the_vault_that_vanishes.rs \
                  crates/fub-wasm-host/tests/common/mod.rs \
                  crates/fub-wasm-host/tests/the_model_crosses.rs
          git commit -m "test(host): rende portabile il vault che scompare"
          git push origin HEAD:fix/audit-integration
