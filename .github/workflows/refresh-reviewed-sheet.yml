name: Refresh reviewed sheet baselines

on:
  push:
    branches: [feat/issue11-grid-window-session]
    paths: [.github/workflows/refresh-reviewed-sheet.yml]

permissions:
  contents: read

jobs:
  reviewed:
    if: github.repository == 'Fubeo/Fub'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Solo lo snapshot sorgente verificato
        run: |
          test "$(git rev-parse 'HEAD^^{tree}')" = 058d634024dbfbe0e32616686830cb4aca98c879
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/refresh-reviewed-sheet.yml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - run: npm run bench:a11y
        working-directory: apps/client
      # Sei variazioni esaminate: priorita dei modi nella palette, nessuna
      # superficie senza documento e ordinamento deterministico del grafo.
      # Le altre baseline non vengono riscritte, nemmeno se differiscono nei byte.
      - name: Fotografa e aggiorna soltanto le sei scene esaminate
        working-directory: apps/client
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { copyFileSync, mkdirSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const names = ['empty-dark.png', 'empty-light.png', 'graph-dark.png', 'graph-light.png', 'palette-dark.png', 'palette-light.png'];
          const report = '/tmp/fub-reviewed-before';
          mkdirSync(report, {recursive: true});
          const result = spawnSync('npm', ['run', 'bench:verify'], {encoding:'utf8', maxBuffer: 8 * 1024 * 1024});
          writeFileSync(join(report, 'verification.log'), (result.stdout ?? '') + (result.stderr ?? ''));
          process.stdout.write(result.stdout ?? '');
          process.stderr.write(result.stderr ?? '');
          assert.equal(result.status, 1, 'expected only the reviewed visual differences');
          const pngs = (path) => readdirSync(path).filter(name => name.endsWith('.png')).sort();
          const before = pngs('bench/baseline');
          assert.equal(before.length, 42);
          assert.deepEqual(pngs('bench/.output/attuale'), before, 'every scene must have been rendered');
          assert.deepEqual(pngs('bench/.output/differenze'), names, 'no unrelated difference may be accepted');
          assert.match(result.stdout, /36\/42 foto uguali alle baseline/);
          for (const name of names) {
            copyFileSync(join('bench/baseline', name), join(report, 'before-' + name));
            copyFileSync(join('bench/.output/differenze', name), join(report, 'diff-' + name));
            copyFileSync(join('bench/.output/attuale', name), join('bench/baseline', name));
          }
          JS
      - run: npm run bench:verify
        working-directory: apps/client
      - run: npm run bench:a11y
        working-directory: apps/client
      - name: Immagini e referti prima e dopo
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sheet-reviewed-${{ github.sha }}
          path: |
            apps/client/bench/.output/
            /tmp/fub-reviewed-before/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Pubblica solo i sei PNG, poi rimuove questo workflow una tantum
        shell: python
        run: |
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          names = ['empty-dark.png', 'empty-light.png', 'graph-dark.png', 'graph-light.png', 'palette-dark.png', 'palette-light.png'];
          paths = ['apps/client/bench/baseline/' + name for name in names]
          assert git('diff', '--name-only').splitlines() == paths
          assert git('ls-remote', 'origin', 'refs/heads/feat/issue11-grid-window-session').split()[0] == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/refresh-reviewed-sheet.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'test(visual): allinea le baseline alle superfici montate'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/issue11-grid-window-session'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(git('rev-parse', 'HEAD') + '\n')
