name: Audit G3 opening

'on':
  push:
    branches:
      - fix/audit-integration
    paths:
      - .github/workflows/audit-g3-opening.yml

permissions:
  contents: write

jobs:
  opening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Ricompone e applica la tranche fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cat .audit-g3-opening.b64.00 \
              .audit-g3-opening.b64.01 \
              .audit-g3-opening.b64.02 > /tmp/g3-opening.patch.gz.b64
          echo '6e8ccaa6b172e35530d8cc8fb6c5507206b759165425a84a2bbbda84ff7c81eb  /tmp/g3-opening.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/g3-opening.patch.gz.b64 > /tmp/g3-opening.patch.gz
          echo '3ae2a338e5cd234d43972c162253b0f9bcd30a88f6cc4be1b23b43d266a777d2  /tmp/g3-opening.patch.gz' | sha256sum -c -
          gzip -dc /tmp/g3-opening.patch.gz > /tmp/g3-opening.patch
          echo '924c6ba4eed3032762c710a2577051106217f6e6a6a533d385681e655ac4dda7  /tmp/g3-opening.patch' | sha256sum -c -
          git apply --check /tmp/g3-opening.patch
          git apply /tmp/g3-opening.patch

          cat > /tmp/g3-first-failure-fix.patch <<'PATCH'
          --- a/crates/fub-kernel/src/index/mod.rs
          +++ b/crates/fub-kernel/src/index/mod.rs
          @@ -65,7 +65,7 @@
           /// `ids` è ciò che va dichiarato perduto **se pania**, e i tre chiamanti lo
           /// passano diverso perché la domanda è diversa: chi alimenta perde ciò che gli
           /// è stato dato, chi riconcilia perde dei morti di cui non si conosce il nome
          -/// (vedi [`Indexes::reconcile`]).
          +/// (vedi [`reconcile_handles`]).
           fn feeding<'a>(
               who: &str,
               gate: Gate,
          @@ -285,44 +285,6 @@
                   lost
               }
           
          -    /// **Cosa hanno già tutti**, di queste voci (§14.2): l'intersezione delle
          -    /// risposte, non l'unione.
          -    ///
          -    /// L'intersezione perché un documento si salta solo se **nessuno** lo
          -    /// aspetta: basta un indice che non ce l'ha, e il kernel deve comunque
          -    /// leggerlo e parsarlo per darglielo — a quel punto tanto vale darlo a
          -    /// tutti, che è ciò che rende il salto un tutto-o-niente per documento e
          -    /// non una consegna a metà.
          -    ///
          -    /// Senza indici registrati l'intersezione è l'insieme intero, ed è la
          -    /// risposta giusta e non un caso limite: se nessuno aspetta niente, non
          -    /// c'è niente da rileggere per nessuno.
          -    ///
          -    /// Chi pania rispondendo non blocca l'apertura, e non fa nemmeno saltare
          -    /// niente: si porta via solo la propria risposta, che senza di lui è vuota
          -    /// — cioè «mandami tutto», che è il verso sicuro dello sbaglio.
          -    pub(crate) fn up_to_date(&self, entries: &[VaultEntry]) -> BTreeSet<DocId> {
          -        up_to_date_handles(&self.feed_handles(), entries)
          -    }
          -
          -    /// Chi non è riuscito ad allinearsi lo dice, e **nomina i morti che si
          -    /// tiene**: gli id che tornano di qui non stanno in `ids` — sono ciò che
          -    /// l'indice ha in più, cioè quello che avrebbe dovuto dimenticare.
          -    ///
          -    /// La rete contro i panici c'è come nell'alimentazione, ma ciò che torna
          -    /// indietro è **diverso**: chi pania riconciliando non ha lasciato indietro
          -    /// i documenti che gli sono stati dati (quelli ci sono), ha lasciato
          -    /// indietro dei morti di cui nessuno conosce il nome — nemmeno il kernel,
          -    /// che sa solo chi è vivo. La perdita si nomina quindi sul primo id del
          -    /// lotto se c'è, e su nessuno se il vault è vuoto: dice *quale indice* e
          -    /// *cosa è successo*, che è ciò su cui si può agire (riaprire il vault),
          -    /// e non finge di sapere un elenco che non esiste.
          -    pub(crate) fn reconcile(&mut self, ids: &[DocId]) -> Vec<IndexLoss> {
          -        let mut lost = self.core.reconcile(ids);
          -        lost.extend(reconcile_handles(&self.feed_handles(), ids));
          -        lost
          -    }
          -
               /// Interroga: il **percorso unico** di dispatch (vedi [`plan`]).
               pub(crate) fn query(&self, query: IndexQuery) -> Result<IndexResult, PluginError> {
                   plan::run(self, query)
          PATCH
          git apply --check /tmp/g3-first-failure-fix.patch
          git apply /tmp/g3-first-failure-fix.patch
          git diff --check
          tar --exclude=.git --exclude=target --exclude=apps/client/node_modules \
            --exclude='.audit-g3-opening.b64.*' \
            --exclude='.github/workflows/audit-g3-opening.yml' \
            -czf /tmp/fub-g3-opening-transformed.tgz .

      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Compila e verifica la tranche
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cargo fmt --all
            cargo fmt --all --check
            git diff --check
            cargo check -p fub-kernel -p fub-host --all-targets
            cargo test -p fub-kernel --test the_opening
            cargo test -p fub-kernel --test opening_slice
            cargo test -p fub-kernel --test the_bench
            cargo test -p fub-kernel --test hot_opening_graph
            cargo test -p fub-host --test the_watcher_window
            cargo clippy --workspace --all-targets -- -D warnings
            rustup target add wasm32-wasip2
            cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
            cargo test --workspace
          } 2>&1 | tee /tmp/g3-opening.log

      - name: Conserva candidato e log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fub-g3-opening-${{ github.sha }}
          path: |
            /tmp/fub-g3-opening-transformed.tgz
            /tmp/g3-opening.log
          if-no-files-found: warn

      - name: Commit semantico e cleanup
        if: steps.gates.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .audit-g3-opening.b64.00 \
                 .audit-g3-opening.b64.01 \
                 .audit-g3-opening.b64.02 \
                 .github/workflows/audit-g3-opening.yml
          git add -u
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "refactor(host): stacca l'apertura dagli indici esterni"
          git push origin HEAD:fix/audit-integration
