name: Audit ARCH nested commands outside lock

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-arch-nested-command.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
      - name: Applica e verifica i comandi annidati
        run: |
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          python .audit-arch-nested-command.py
          python - <<'PY'
          from pathlib import Path

          workspace = Path("crates/fub-kernel/src/workspace.rs")
          source = workspace.read_text()
          marker = "    pub(crate) fn invoke_command_nested(\n"
          if source.count(marker) != 1:
              raise SystemExit("invoke_command_nested marker non univoco")
          bridge = '''    /// Porta stretta dell'host per il solo ramo di manutenzione del kernel.\n    ///\n    /// Un `PreparedCommand` restituisce `None` soltanto per questo proprietario:\n    /// tenere questa porta distinta impedisce a `fub-host` di acquisire una\n    /// scorciatoia pubblica con cui eseguire provider arbitrari sotto lock.\n    pub fn invoke_nested_maintenance_command(\n        &mut self,\n        command: &str,\n        args: serde_json::Value,\n        mode: InvokeMode,\n    ) -> std::result::Result<CommandOutcome, PluginError> {\n        let at = self.command_owner(command)?;\n        if self.providers.commands[at].id != crate::maintenance::MAINTENANCE_ID {\n            return Err(PluginError::PermissionDenied(\n                format!(\"`{command}` non è un comando di manutenzione del kernel\").into(),\n            ));\n        }\n        self.invoke_command_nested(command, args, mode)\n    }\n\n'''
          workspace.write_text(source.replace(marker, bridge + marker, 1))

          jobs = Path("crates/fub-host/src/jobs.rs")
          source = jobs.read_text()
          old = "ws.invoke_command_nested(command, args, self.mode)"
          new = "ws.invoke_nested_maintenance_command(command, args, self.mode)"
          if source.count(old) != 1:
              raise SystemExit("fallback nested command non univoco")
          jobs.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          if ! (cargo test -p fub-host --test concurrency && cargo test -p fub-kernel --test invoke_command && cargo check -p fub-host --all-targets && cargo clippy -p fub-host -p fub-kernel --all-targets -- -D warnings) > /tmp/arch-nested.log 2>&1; then
            tail -n 350 /tmp/arch-nested.log > .audit-arch-nested-error.txt
            git add .audit-arch-nested-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci(temp): cattura errore ARCH nested command"
              git push origin HEAD:fix/audit-integration
            fi
            cat .audit-arch-nested-error.txt
            exit 1
          fi
          git rm -f .audit-arch-nested-command.py .github/workflows/audit-arch-nested-command.yml .audit-arch-nested-error.txt || true
          git add crates/fub-host/src/jobs.rs crates/fub-host/tests/concurrency.rs crates/fub-kernel/src/workspace.rs
          git commit -m "refactor(host): stacca anche i comandi annidati"
          git push origin HEAD:fix/audit-integration
