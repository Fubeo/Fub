# Workflow monouso: viene rimosso dal commit prodotto.
name: Migrazione client unificato

on:
  push:
    branches:
      - refactor/unified-client-shells

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt

      - name: Dipendenze native di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Migra e verifica il client unificato
        run: bash .github/scripts/migrate-unified-client.sh
