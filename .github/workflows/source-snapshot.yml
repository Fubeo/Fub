name: Audit source snapshot

'on':
  push:
    branches:
      - audit/source-snapshot-20260902

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Impacchetta il tree
        run: tar --exclude=.git --exclude=source-tree.tar.gz -czf source-tree.tar.gz .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-tree-${{ github.sha }}
          path: source-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
