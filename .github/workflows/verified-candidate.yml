name: Verifica candidata superfici

on:
  push:
    branches: [automation/issue11-verified-transfer-20260916]

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'Fubeo/Fub'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 86e4f28f7144e8575e31145550ad3a46340abe6c
          path: source
          persist-credentials: false
      - name: Materializza solo le preimmagini e postimmagini verificate
        run: python transfer/.github/verified-transfer/source-transfer.py apply source reports
      - name: Crea oggetti sorgente senza muovere alcun branch
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: python transfer/.github/verified-transfer/source-transfer.py source source reports
      - name: Referto degli oggetti sorgente
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-source-${{ github.sha }}
          path: reports/source.json
          if-no-files-found: error
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/client/package-lock.json
      - run: npm ci
        working-directory: source/apps/client
      - run: npm run typecheck && npm test && npm run build
        working-directory: source/apps/client
      - run: npx playwright install --with-deps chromium
        working-directory: source/apps/client
      - name: Guard frontend e documentazione
        working-directory: source
        run: |
          node .github/scripts/check-codemirror-boundary.mjs
          node .github/scripts/check-listeners.mjs
          node .github/scripts/check-races.mjs
          node .github/scripts/check-npm-copies.mjs
          node .github/scripts/check-doc-links.mjs
          node .github/scripts/check-doc-orphans.mjs
          node .github/scripts/check-doc-size.mjs
          node .github/scripts/check-markdown-style.mjs
          node .github/scripts/check-mermaid.mjs --render
          node .github/scripts/check-prose.mjs
          node .github/scripts/check-tables.mjs
          node .github/scripts/check-locale-loop.mjs
      - name: Griglia e accessibilita reali nei due temi
        working-directory: source/apps/client
        run: npm run bench:grid && npm run bench:a11y
      - name: Cattura e verifica esclusivamente le sei variazioni diagnosticate
        shell: python
        run: |
          import pathlib, shutil, subprocess
          root = pathlib.Path('source/apps/client')
          out = root / 'bench/.output'
          expected = {f'{s}-{l}.png' for s in ('palette','empty','graph') for l in ('dark','light')}
          result = subprocess.run(['npm','run','bench:verify'], cwd=root)
          assert result.returncode == 1, 'expected exactly the diagnosed visual changes'
          assert {p.name for p in (out/'differenze').glob('*.png')} == expected
          assert len(list((out/'attuale').glob('*.png'))) == 42
          shutil.copytree(out, 'reports/before', dirs_exist_ok=True)
          candidate = pathlib.Path('reports/baselines')
          candidate.mkdir(parents=True, exist_ok=True)
          for name in expected:
              shutil.copyfile(out/'attuale'/name, candidate/name)
              shutil.copyfile(out/'attuale'/name, root/'bench/baseline'/name)
          subprocess.run(['npm','run','bench:verify'], cwd=root, check=True)
          shutil.copytree(out, 'reports/after', dirs_exist_ok=True)
      - name: Crea commit baseline candidato senza muovere alcun branch
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: python transfer/.github/verified-transfer/source-transfer.py baseline source reports
      - name: Referti e immagini per la revisione prima della pubblicazione
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-candidate-${{ github.sha }}
          path: |
            reports/
            source/apps/client/bench/.output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
