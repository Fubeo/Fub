name: docs fix one-shot

on:
  push:
    branches: ["docs/link-check-active"]

permissions:
  contents: write

jobs:
  patch-active-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/link-check-active
      - name: Riallinea rename e ancore nei documenti attivi
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = list(Path('docs/roadmap').glob('*.md'))
          replacements = [
              ('../../crates/fub-features/examples/una_ricerca.rs', '../../crates/fub-features/examples/search.rs', 3),
              ('07-il-confine.md#la-casella-rimasta', '07-il-confine.md#la-casella-chiusa', 2),
          ]

          for old, new, expected in replacements:
              count = sum(p.read_text().count(old) for p in roots)
              assert count == expected, f'{old}: attese {expected} occorrenze, trovate {count}'
              for p in roots:
                  text = p.read_text()
                  if old in text:
                      p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/docs-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap .github/workflows/docs-fix-once.yml
          git commit -m "docs(roadmap): riallinea esempi e ancore rinominati"
          git push origin HEAD:docs/link-check-active
