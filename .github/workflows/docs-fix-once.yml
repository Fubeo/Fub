name: docs fix one-shot

on:
  push:
    branches: ["docs/link-check-active"]

permissions:
  contents: write

jobs:
  patch-todo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/link-check-active
      - name: Riallinea il rimando §15.4 e rimuove questo workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/todo.md')
          text = p.read_text()
          old = 'roadmap/15-il-disco.md#154-il-confine-wasm-del-data-host'
          new = 'roadmap/15-il-disco.md#154-i-dati-persistiti-non-hanno-né-una-mappa-né-una-classe'
          assert text.count(old) == 1, f'attese 1 occorrenza, trovate {text.count(old)}'
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/docs-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/todo.md .github/workflows/docs-fix-once.yml
          git commit -m "docs(todo): riallinea il rimando al confine wasm"
          git push origin HEAD:docs/link-check-active
