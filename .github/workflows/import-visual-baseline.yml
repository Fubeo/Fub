name: Importa baseline visiva pulita

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-visual-baseline.yml

permissions:
  actions: read
  contents: write

jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore ci importa baseline visiva' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Importa lo screenshot verificato del runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --location --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9567504928/zip" \
            --output /tmp/banco-visivo.zip
          rm -rf /tmp/banco-visivo
          mkdir -p /tmp/banco-visivo
          unzip -q /tmp/banco-visivo.zip -d /tmp/banco-visivo
          test -f /tmp/banco-visivo/attuale/nota-tre-modi-light.png
          cp /tmp/banco-visivo/attuale/nota-tre-modi-light.png \
            frontend/bench/baseline/nota-tre-modi-light.png

      - name: Verifica e registra soltanto la baseline corretta
        run: |
          test "$(sha256sum frontend/bench/baseline/nota-tre-modi-light.png | cut -d' ' -f1)" = \
            "e8425290242f3f18c9a0b2debf9472a3f31ff6601cd8d2d95c0864a3993e2d9b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bench/baseline/nota-tre-modi-light.png
          if git diff --cached --quiet; then
            echo "La baseline era già aggiornata."
            exit 0
          fi
          git commit -m "test(visual): ripulisci la baseline dei tre modi"
          git push origin HEAD:main
