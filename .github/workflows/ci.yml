name: CI

# Un push su un ramo con una PR aperta faceva girare tutto due volte, una per
# `push` e una per `pull_request`. Il push conta solo su `main`; gli altri rami
# passano dalla PR, o da `workflow_dispatch`.
on:
  workflow_dispatch:
    inputs:
      fuzz_completo:
        description: "i fuzzer del Markdown a 20 000 casi invece di 2000"
        type: boolean
        default: false
      # Lo passa `.github/workflows/baseline.yml` dopo il commit delle
      # baseline: il job `changes` decide se gli altri job possono contare
      # come in quella corsa (vedi il passo «si riusa una corsa precedente?»).
      riuso_di:
        description: "id della corsa di una PR di cui riusare l'esito, se il commit cambia soltanto baseline del banco visivo"
        type: string
        default: ""
  push:
    branches: [main]
  # `ready_for_review`: segnare pronta una PR in bozza fa partire la CI
  # completa (vedi il job `test` e i banchi).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Un push nuovo su una PR annulla la corsa vecchia della stessa PR. Su `main`
# ogni commit tiene la sua corsa: il cancello del rilascio la cerca per SHA.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # I fuzzer del Markdown girano a 2000 casi. I 20 000 sono per la corsa
  # settimanale e per chi li chiede a mano, quando serve una prova a fondo.
  FUB_FUZZ_CASI: ${{ (github.event_name == 'schedule' || inputs.fuzz_completo) && '20000' || '2000' }}
  FUB_FUZZ_TRASFERIMENTO: ${{ (github.event_name == 'schedule' || inputs.fuzz_completo) && '20000' || '2000' }}

jobs:
  # Una PR in bozza è lavoro in corso: riceve la CI corta (Linux, niente
  # banchi). Segnata pronta riceve tutto, i banchi solo se tocca il client, e
  # la WebView vera solo se tocca ciò che finisce nell'app (`webview`). Su
  # `main`, sul cron e a mano gira sempre tutto. Questo job dice ai banchi
  # se il client o l'app sono toccati, e a tutti i job tranne il banco visivo
  # se la corsa riusa l'esito di una precedente (`riuso`): allora si saltano.
  changes:
    name: cosa cambia
    runs-on: ubuntu-latest
    # `actions: read` soltanto qui: il passo del riuso legge la corsa e i job
    # di `riuso_di` con l'API.
    permissions:
      contents: read
      actions: read
    outputs:
      client: ${{ steps.diff.outputs.client }}
      motori: ${{ steps.diff.outputs.motori }}
      webview: ${{ steps.diff.outputs.webview }}
      riuso: ${{ steps.riuso.outputs.riuso }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # I test dei motori in vendor leggono soltanto `vendor/` (il loro
      # workspace, il loro lock, i loro asset e le copie di craft-docpath e
      # craft-vectorcraft-format che VectorCraft prende per percorso), la
      # toolchain fissata qui e una `.cargo/` o una `rust-toolchain` alla
      # radice, se nascessero. Una PR che non tocca niente di questo li
      # rifarebbe sugli stessi byte di `main`, dove girano sempre. I test del
      # workspace invece non hanno un filtro: leggono anche `apps/client/` e
      # `docs/` (i mirror TS, le fixture, i contratti).
      # La WebView vera compila l'app intera e la misura: la tocca ogni cosa
      # che ci finisce dentro (le app, i crate, `vendor/`, gli asset, gli
      # esempi, i manifest e la toolchain di Cargo) o che cambia il job.
      # Documenti, script e altri workflow no.
      - name: il client, l'app o i motori in vendor sono toccati?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "motori=true" >> "$GITHUB_OUTPUT"
            echo "webview=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/cambiati"
          if grep -qE '^(apps/client/|crates/fub-canvas-(core|wasm)/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/cambiati"; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(vendor/|\.cargo/|rust-toolchain|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/cambiati"; then
            echo "motori=true" >> "$GITHUB_OUTPUT"
          else
            echo "motori=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(apps/|crates/|vendor/|assets/|esempi/|Cargo\.(toml|lock)$|\.cargo/|rust-toolchain|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/cambiati"; then
            echo "webview=true" >> "$GITHUB_OUTPUT"
          else
            echo "webview=false" >> "$GITHUB_OUTPUT"
          fi
      # Dopo il commit delle baseline fatto da `baseline.yml`, la corsa lanciata
      # a mano rifà soltanto il banco visivo: gli altri job contano come nella
      # corsa `riuso_di` sul commit padre. Le condizioni sono in
      # `.github/scripts/baseline-dal-runner.mjs` (`valutaRiuso`); se una
      # manca, o se l'API non risponde, la corsa è completa.
      - name: si riusa una corsa precedente?
        id: riuso
        env:
          EVENT: ${{ github.event_name }}
          RIUSO_DI: ${{ inputs.riuso_di }}
          REPO: ${{ github.repository }}
          RAMO: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PREDEFINITO: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "riuso=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RIUSO_DI" ]; then
            echo "riuso=false" >> "$GITHUB_OUTPUT"
            echo "Nessun riuso chiesto: gira la CI completa." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `riuso_di` arriva da chi lancia la corsa: si scrive nel riepilogo
          # soltanto se è l'id numerico di una corsa.
          if ! [[ "$RIUSO_DI" =~ ^[0-9]+$ ]]; then
            echo "riuso=false" >> "$GITHUB_OUTPUT"
            echo "Nessun riuso: \`riuso_di\` non è l'id numerico di una corsa. Gira la CI completa." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          d="$RUNNER_TEMP/riuso"
          mkdir -p "$d"
          raccogli() {
            [ "$REF_TYPE" = branch ] &&
              gh api "repos/$REPO/actions/runs/$RIUSO_DI" > "$d/corsa.json" &&
              gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id > "$d/workflow" &&
              gh api --paginate "repos/$REPO/actions/runs/$RIUSO_DI/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | {name, status, conclusion}' > "$d/job.ndjson" &&
              git rev-list --parents -n 1 HEAD > "$d/genitori" &&
              git diff --raw --no-renames --no-abbrev HEAD^ HEAD > "$d/diff"
          }
          if raccogli && node .github/scripts/baseline-dal-runner.mjs riuso \
              --corsa "$d/corsa.json" --job "$d/job.ndjson" --genitori "$d/genitori" \
              --diff "$d/diff" --repo "$REPO" --workflow-id "$(cat "$d/workflow")" \
              --ramo "$RAMO" --predefinito "$PREDEFINITO"; then
            exit 0
          fi
          echo "riuso=false" >> "$GITHUB_OUTPUT"
          echo "Nessun riuso della corsa $RIUSO_DI: non ho potuto leggerla, o il ref non è un ramo. Gira la CI completa." >> "$GITHUB_STEP_SUMMARY"

  invariants:
    name: invarianti (abi↔WIT, additività, dipendenze)
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Il bersaglio della WebView serve al nucleo della lavagna e al varco
      # del contratto, più sotto.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: le action esterne sono pin a commit
        run: node .github/scripts/check-actions-pinned.mjs
      - name: Conformità abi ↔ crates/fub-abi/wit/fub/abi.wit
        run: cargo test -p fub-abi --test wit_conformance
      - name: Additività del contratto (crates/fub-abi/wit/frozen/)
        run: cargo test -p fub-abi --test wit_additivity
      - name: invarianti di dipendenza (abi/kernel agnostici, features senza kernel)
        run: cargo test -p fub-abi --test dependency_invariant
      - name: il nucleo della lavagna compila per la WebView (wasm32-unknown-unknown)
        run: cargo check -p fub-canvas-core --target wasm32-unknown-unknown --locked
      - name: la shell raggiunge il workspace solo dalle porte strette dell'host
        run: node .github/scripts/check-host-workspace-boundary.mjs
      - name: soltanto gli adattatori nominano WordCraft, GridCraft e VectorCraft, nei sorgenti e nei Cargo.toml
        run: node .github/scripts/check-engine-boundary.mjs
      - name: la mappa del disegno copre ogni funzione di VectorCraft
        run: node --test tools/disegno-mappa/estrai.test.mjs && node .github/scripts/check-disegno-mappa.mjs --self-test && node .github/scripts/check-disegno-mappa.mjs
      - name: il disegno non tocca il disco
        run: node --test tools/disegno-disco/elenco.test.mjs && node tools/disegno-disco/elenco.mjs --check
      - name: nessuna interfaccia delle app Craft in fub-app, librerie doppie sotto il tetto
        run: node .github/scripts/check-motori.mjs --self-test && node .github/scripts/check-motori.mjs
      - name: la copia di WordCraft è l'upstream del lock più le patch di vendor/wordcraft/patches
        run: node tools/vendor-craft/vendor.mjs wordcraft check
      - name: la copia di GridCraft è l'upstream del lock più le patch di vendor/gridcraft/patches
        run: node tools/vendor-craft/vendor.mjs gridcraft check
      - name: la copia di VectorCraft è l'upstream del lock più le patch di vendor/vectorcraft/patches
        run: node tools/vendor-craft/vendor.mjs vectorcraft check
      - name: le copie di craft-docpath e craft-vectorcraft-format sono l'upstream del loro lock
        run: node tools/vendor-craft/vendor.mjs craft-docpath check && node tools/vendor-craft/vendor.mjs craft-vectorcraft-format check
      - name: le patch dei motori si portano a tre vie (upstream finto, senza rete)
        run: node tools/vendor-craft/vendor.mjs self-test
      - name: i dati di vendor hanno lo sha256 di tools/vendor-craft/dati.mjs, e ogni cartella di vendor è dichiarata
        run: node tools/vendor-craft/provenienza.mjs self-test && node tools/vendor-craft/provenienza.mjs check && node tools/vendor-craft/provenienza.mjs elenco
      - name: gli errori letterali non crescono
        run: node .github/scripts/check-error-literals.mjs
      - name: il lettore dei commenti di Rust distingue la prosa da stringhe e caratteri
        run: node .github/scripts/check-rust-comments.mjs --self-test
      - name: il cancello del rilascio rifiuta CI incomplete e canali stabili senza firme
        run: node .github/scripts/check-release-gate.mjs --self-test
      - name: le baseline dal runner e il riuso rifiutano artefatti e corse fuori regola
        run: node .github/scripts/baseline-dal-runner.mjs --self-test
      - name: i commenti di Rust restano attaccati a ciò che descrivono
        run: node .github/scripts/check-rust-comments.mjs
      - name: il contratto attraversa il confine
        run: cargo build --manifest-path tools/varco-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: le versioni delle dipendenze si scrivono in un posto solo
        run: node .github/scripts/check-cargo-versions.mjs
      - name: la versione del prodotto è la stessa in Cargo, Tauri e npm
        run: node .github/scripts/check-release-version.mjs
      - name: ogni cargo feature è compilata da qualcuno
        run: node .github/scripts/check-cargo-feature-default.mjs
      - name: ogni forma di libreria è consumata da qualcuno
        run: node .github/scripts/check-crate-type.mjs
      - name: il profilo dev è quello deciso, chiave per chiave
        run: node .github/scripts/check-dev-profile.mjs
      - name: le union del mirror TS sono derivate dai tipi Rust
        run: cargo test -p fub-abi --test ts_enums
      - name: le feature ufficiali si spengono
        run: |
          cargo build -p fub-features --no-default-features
          cargo test -p fub-features --no-default-features
          cargo build -p fub-features --no-default-features --features outline
          cargo build -p fub-host --no-default-features --features outline,notify-watcher
      - name: ogni feature ufficiale compila da sola
        run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fub-features") | .features | keys[] | select(. != "default")')
          for feature in $features; do
            cargo check -p fub-features --no-default-features --features "$feature"
          done
      - name: una cargo feature per bundle, e l'inventario è dove si legge
        run: cargo test -p fub-features --test cargo_features
      - name: i moduli di feature non si parlano
        run: cargo test -p fub-features --test independent_modules

  supply-chain:
    name: supply chain (licenze, advisory, SBOM)
    needs: changes
    if: needs.changes.outputs.riuso != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      # La SBOM nasce da `cargo metadata --locked` e dai checksum del lock, senza
      # uno strumento scaricato, e lo script la confronta con `Cargo.lock` nei
      # due versi prima di scriverla: una SBOM che perde un pacchetto fallisce.
      - name: Genera l'SBOM e la confronta con Cargo.lock
        run: |
          node .github/scripts/sbom.mjs --self-test
          node .github/scripts/sbom.mjs --out fub-sbom.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-spdx
          path: fub-sbom.spdx.json

  fmt:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy dell'host senza la feature `draw`
        run: cargo clippy -p fub-host --no-default-features --features notify-watcher,http-client,official-features,rich --all-targets -- -D warnings
      - name: clippy con la feature `draw` delle feature (FUORI_DAL_DEFAULT)
        run: cargo clippy -p fub-features --features draw --all-targets -- -D warnings
      - name: clippy con la feature `pixel` del banco (FUORI_DAL_DEFAULT)
        run: cargo clippy -p fub-testkit --features pixel --all-targets -- -D warnings
      - name: Il ramo Windows del kernel, compilato da qui
        run: cargo check -p fub-kernel --all-targets --target x86_64-pc-windows-msvc

  test:
    name: build + test (${{ matrix.os }}${{ matrix.parti > 1 && format(', {0}/{1}', matrix.parte, matrix.parti) || '' }})
    needs: changes
    if: needs.changes.outputs.riuso != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # In bozza solo Linux: Windows gira quando la PR è pronta. macOS è in
        # pausa (docs/decisions/0245-macos-e-ios-in-pausa.md): lo prova una
        # volta alla settimana `macos-in-pausa.yml`, non questa matrice.
        #
        # Su Windows i test erano il job più lungo della CI: 14 minuti di
        # compilazione e 23 di esecuzione (corsa 43961623580), contro 8 e 14
        # su Linux. L'esecuzione si divide in tre macchine con
        # `--partition hash:<parte>/3`: ognuna compila tutto e fa girare un
        # terzo dei test, sempre lo stesso terzo finché il test non cambia
        # nome. Un archivio compilato una volta e passato alle tre costerebbe
        # di più: i 394 eseguibili di prova da caricare e scaricare, e un
        # job in fila prima degli altri.
        include: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.draft) && '[{"os":"ubuntu-latest","parte":1,"parti":1}]' || '[{"os":"ubuntu-latest","parte":1,"parti":1},{"os":"windows-latest","parte":1,"parti":3},{"os":"windows-latest","parte":2,"parti":3},{"os":"windows-latest","parte":3,"parti":3}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      # Su Windows il collegamento di circa 270 eseguibili di prova costava da
      # solo 26 minuti. `rust-lld` collega più in fretta del linker di MSVC, e
      # le sole righe nel debug alleggeriscono i PDB senza togliere file e riga
      # ai backtrace. Prima della cache, perché ne cambia la chiave.
      - name: su Windows, rust-lld
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
      # Su Linux, con il motore del disegno, il debug completo dei circa 200
      # eseguibili di prova riempiva il disco del runner al collegamento
      # (2026-11-23, «No space left on device»): le sole righe anche qui.
      - name: il debug delle sole righe
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      # Il budget delle cache è di 10 GB per tutto il repository, e quando si
      # sfora se ne va la più vecchia: i job che compilano un sottoinsieme di
      # questo leggono la cache dei test di Linux (`shared-key: test`) invece
      # di salvarne una loro. Le tre parti di Windows compilano la stessa
      # cosa: salva la prima.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.parte == 1 }}
          cache-on-failure: true
          shared-key: test
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-nextest
      - name: Dipendenze di sistema di Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: il bersaglio dei componenti, prima dei test che lo pretendono
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
      - name: la scena e l'inchiostro compilano per i componenti
        if: matrix.parte == 1
        run: |
          cargo check -p fub-scene --target wasm32-wasip2 --all-targets --locked
          cargo check -p fub-ink --target wasm32-wasip2 --all-targets --locked
      # Gli stessi test di `cargo test --workspace`, ma in parallelo anche fra
      # un eseguibile e l'altro. Il profilo `ci` di `.config/nextest.toml`
      # stampa l'uscita di ogni test rosso e, alla fine, quelli lenti.
      - name: i test del workspace
        shell: bash
        env:
          PARTE: ${{ matrix.parte }}
          PARTI: ${{ matrix.parti }}
        run: |
          parte=()
          if [ "$PARTI" -gt 1 ]; then parte=(--partition "hash:$PARTE/$PARTI"); fi
          cargo nextest run --workspace --no-fail-fast --profile ci "${parte[@]}"
      - name: gli esempi della documentazione
        if: matrix.parte == 1
        run: cargo test --workspace --doc --no-fail-fast
      # Ogni processo di prova copia il componente che usa: le copie non
      # servono alla corsa dopo, e non entrano nella cache.
      - name: via le copie dei componenti
        if: always()
        shell: bash
        run: rm -f target/tmp/*.wasm

  variants:
    # Le varianti di feature non dipendono dal sistema: girano qui, accanto ai
    # job dei test, invece di allungarli.
    name: varianti di feature
    needs: changes
    if: needs.changes.outputs.riuso != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: test
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-nextest
      - name: il componente d'esempio, prima dei test che lo pretendono
        run: cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
      - name: l'host senza la feature `draw`, con gli SVG come allegati
        run: cargo nextest run -p fub-host --no-default-features --features notify-watcher,http-client,official-features,rich --no-fail-fast --profile ci
      - name: «Nuovo disegno» e l'export dei disegni, con la feature `draw` delle feature (FUORI_DAL_DEFAULT)
        run: cargo nextest run -p fub-features --features draw --no-fail-fast --profile ci
      - name: la riga del Motore del disegno, con la feature `engine-drawing` delle feature (FUORI_DAL_DEFAULT)
        run: cargo nextest run -p fub-features --features engine-drawing --no-fail-fast --profile ci
      - name: la riga del Disegno completo, con la feature `drawing-complete` delle feature (FUORI_DAL_DEFAULT)
        run: cargo nextest run -p fub-features --features drawing-complete --no-fail-fast --profile ci
      - name: i disegni senza il motore, la mappa dei componenti e le porte del disegno dell'host
        run: cargo nextest run -p fub-host --no-default-features --features draw --test componenti --test drawing --no-fail-fast --profile ci
      - name: l'oracolo a pixel, con la feature `pixel` del banco (FUORI_DAL_DEFAULT)
        run: cargo nextest run -p fub-testkit --features pixel --no-fail-fast --profile ci

  motori:
    # I workspace dei motori, con il loro lock, in un job loro: insieme alle
    # varianti facevano 32 minuti, e VectorCraft da solo 17 (14 di
    # compilazione con il profilo ottimizzato del suo manifest). Su una PR
    # girano solo se `cosa cambia` dice che i loro ingressi sono toccati; su
    # `main`, sul cron e a mano sempre. Niente cache: il budget di 10 GB è
    # già pieno, e questo job non è il più lungo della corsa.
    name: motori in vendor (WordCraft, GridCraft, VectorCraft)
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.motori == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - name: i test dei motori di WordCraft, nel workspace loro e con il loro lock
        env:
          CARGO_TARGET_DIR: target/wordcraft
        run: cargo test --manifest-path vendor/wordcraft/Cargo.toml --workspace --locked --no-fail-fast
      - name: i test dei motori di GridCraft, nel workspace loro e con il loro lock
        env:
          CARGO_TARGET_DIR: target/gridcraft
        run: cargo test --manifest-path vendor/gridcraft/Cargo.toml --workspace --locked --no-fail-fast
      - name: i test dei motori di VectorCraft, nel workspace loro e con il loro lock
        env:
          CARGO_TARGET_DIR: target/vectorcraft
        run: cargo test --manifest-path vendor/vectorcraft/Cargo.toml --workspace --locked --no-fail-fast

  libreoffice:
    name: i docx innestati, riletti da LibreOffice
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: test
      - name: LibreOffice senza interfaccia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - name: un salvataggio innestato si legge come il file di partenza
        env:
          FUB_SOFFICE: soffice
        run: cargo test -p fub-format-rich --test graft -- --nocapture

  docs:
    name: documentazione canonica
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      # Il render dei diagrammi usa il Mermaid e il Playwright del lockfile
      # del client: lo stesso Mermaid dell'app, niente scaricato a parte.
      - run: npm ci
        working-directory: apps/client
      - name: Link interni dei documenti
        run: node .github/scripts/check-doc-links.mjs
      - name: Ogni pagina canonica è raggiungibile
        run: node .github/scripts/check-doc-orphans.mjs
      - name: Le pagine rispettano le soglie dimensionali
        run: node .github/scripts/check-doc-size.mjs
      - name: Il Markdown rispetta lo stile canonico
        run: node .github/scripts/check-markdown-style.mjs
      # Il render apre i Mermaid della PR in Chromium, e la sandbox resta
      # accesa (audit del 2026-10-30, B19). Ubuntu 24.04 chiude gli user
      # namespace ai programmi senza un profilo AppArmor: il Chrome del runner
      # ha il profilo `chrome` della distribuzione, quindi si usa lui e non si
      # scarica il Chromium di Playwright. Se non partisse con la sandbox, gli
      # si dà un profilo mirato che concede gli user namespace a quel solo
      # binario; se nemmeno così, il passo è rosso.
      - name: Chrome del runner, con la sandbox
        run: |
          set -euo pipefail
          chrome=/opt/google/chrome/chrome
          prova() { timeout 60 "$chrome" --headless --disable-gpu --dump-dom about:blank > /dev/null 2> "$RUNNER_TEMP/chrome.log"; }
          if ! prova; then
            echo "Chrome non parte con la sandbox; restrizione AppArmor: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo assente)"
            tail -n 5 "$RUNNER_TEMP/chrome.log"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile fub-ci-chrome %s flags=(unconfined) {\n  userns,\n}\n' "$chrome" \
              | sudo tee /etc/apparmor.d/fub-ci-chrome > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/fub-ci-chrome
            prova || { tail -n 20 "$RUNNER_TEMP/chrome.log"; exit 1; }
          fi
          echo "FUB_MERMAID_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Ogni diagramma Mermaid è valido e renderizzabile
        run: node .github/scripts/check-mermaid.mjs --render
      - name: Il controllo della prosa riconosce riferimenti legacy, cronaca e checklist chiuse
        run: node .github/scripts/check-prose.mjs --self-test
      - name: I documenti non hanno riferimenti legacy, cronaca fuori da docs/project o checklist chiuse
        run: node .github/scripts/check-prose.mjs
      - name: La riga vuota che spezza una tabella non è quella che ne separa due
        run: node .github/scripts/check-tables.mjs --autoprova
      - name: Ogni tabella dei documenti è ancora una tabella, e con tutte le sue colonne
        run: node .github/scripts/check-tables.mjs
      - name: Il ciclo locale di CONTRIBUTING.md sa leggere i comandi della CI
        run: node .github/scripts/check-locale-loop.mjs --self-test
      - name: Ogni comando della CI sta nel ciclo locale di CONTRIBUTING.md, o fra le sue eccezioni
        run: node .github/scripts/check-locale-loop.mjs

  client:
    name: client (type-check + test + build)
    needs: changes
    if: needs.changes.outputs.riuso != 'true'
    # Fissato: le baseline del banco visivo sono di questa immagine, e
    # `ubuntu-latest` cambia sotto i piedi. Si passa alla prossima di
    # proposito, rigenerando le baseline sulla CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Il nucleo della lavagna: Vite lo compila in .wasm a ogni build e
      # Vitest lo usa (N3 T14).
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: i derivati del tema si rigenerano byte per byte
        run: |
          npm run theme:generate
          git diff --exit-code -- src/theme/scrittoio theme/author
          npm run theme:verify
        working-directory: apps/client
      - run: npm run typecheck
        working-directory: apps/client
      - run: npm test
        working-directory: apps/client
      - run: npm run build
        working-directory: apps/client
      - name: il confine CodeMirror resta nel package testuale
        run: |
          node .github/scripts/check-codemirror-boundary.mjs --self-test
          node .github/scripts/check-codemirror-boundary.mjs
      - name: ProseMirror resta in Scrittura e nei documenti
        run: |
          node .github/scripts/check-prosemirror-boundary.mjs --self-test
          node .github/scripts/check-prosemirror-boundary.mjs
      - name: la Tabella importa soltanto kit, moto, i18n e tsv
        run: |
          node .github/scripts/check-tabella-boundary.mjs --self-test
          node .github/scripts/check-tabella-boundary.mjs
      - name: un editor non scrive un ruolo del tema sull'elemento
        run: |
          node .github/scripts/check-inline-theme.mjs --self-test
          node .github/scripts/check-inline-theme.mjs
      - name: nessuno stile in linea (CSP senza 'unsafe-inline')
        run: |
          node .github/scripts/check-inline-styles.mjs --self-test
          node .github/scripts/check-inline-styles.mjs
      - name: ogni ascoltatore globale della shell ha una Vita
        run: node .github/scripts/check-listeners.mjs
      - name: dentro un giro non si aspetta di nascosto
        run: node .github/scripts/check-races.mjs
      - name: nessun pacchetto npm in due copie
        run: node .github/scripts/check-npm-copies.mjs

  # I banchi girano in job loro accanto a quello dei test, invece che in fila
  # dietro di lui. Tutti sull'immagine delle baseline.
  # Il banco visivo non guarda `riuso`: dopo un commit di baseline è proprio
  # lui la prova che resta da fare.
  visual:
    name: banco visivo (scene uguali alle baseline)
    needs: changes
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Vite compila il nucleo della lavagna in .wasm quando serve la pagina
      # (N3 T14): senza il bersaglio la shell del banco non parte.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: le scene restano uguali alle baseline del runner
        id: bench_verify
        run: npm run bench:verify
        working-directory: apps/client
      # Anche con il job verde, se una foto è stata ripresa al secondo scatto
      # (`instabili.json`): così si vede quale scena va resa stabile.
      - name: differenze e foglio di contatto del banco visivo
        if: ${{ always() && (steps.bench_verify.outcome == 'failure' || hashFiles('apps/client/bench/.output/instabili.json') != '') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-visivo-${{ github.sha }}
          path: apps/client/bench/.output/
          include-hidden-files: true
      # Lo strato d'avvio copre la finestra prima di ogni modulo, nelle due
      # luci e sul telefono: senza questa guardia il lampo bianco torna.
      - name: niente lampo all'avvio
        run: npm run bench:lampo
        working-directory: apps/client
      # Gli stili calcolati dei pezzi portati da un prototipo, contro quelli
      # estratti dal prototipo (`bench/conformita/`). Sta qui perché usa lo
      # stesso palco, lo stesso Chromium e le stesse scene del banco visivo.
      - name: la grafica segue il prototipo
        id: bench_conformita
        run: npm run bench:conformita
        working-directory: apps/client
      - name: referto della conformità al prototipo
        if: ${{ failure() && steps.bench_conformita.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: conformita-${{ github.sha }}
          path: apps/client/bench/.output/conformita/
          include-hidden-files: true

  a11y:
    # Le due luci sono due corse separate dello stesso banco: in fila
    # costavano quasi quattordici minuti.
    name: contrasto e tastiera (${{ matrix.light }})
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true'))
    strategy:
      fail-fast: false
      matrix:
        light: [dark, light]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Vite compila il nucleo della lavagna in .wasm quando serve la pagina
      # (N3 T14): senza il bersaglio la shell del banco non parte.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: il contrasto della pagina vera e i gesti della tastiera
        run: npm run bench:a11y -- --light=${{ matrix.light }}
        working-directory: apps/client

  graph:
    name: banchi del grafo (scala e heap)
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Vite compila il nucleo della lavagna in .wasm quando serve la pagina
      # (N3 T14): senza il bersaglio la shell del banco non parte.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: la scala del grafo resta riproducibile
        id: graph_scale
        run: npm run bench:graph-scale -- --nodes 2000 --seed 6 --cycles 3
        working-directory: apps/client
      - name: conserva il referto 2k
        if: ${{ steps.graph_scale.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-2k.json
        working-directory: apps/client
      - name: referto della scala del grafo
        if: ${{ failure() && steps.graph_scale.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: graph-scale-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          include-hidden-files: true
          if-no-files-found: error
      - name: soak osservativo del grafo a 10k
        id: graph_scale_10k
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 8
        working-directory: apps/client
      - name: conserva il referto 10k osservativo
        if: ${{ steps.graph_scale_10k.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-8.json
        working-directory: apps/client
      - name: referto del soak grafo a 10k
        if: ${{ failure() && steps.graph_scale_10k.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true
      - name: la coda heap del grafo 10k si stabilizza
        id: graph_heap_stability
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 16
        working-directory: apps/client
      - name: conserva il referto 10k prolungato
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-16.json
        working-directory: apps/client
      - name: pubblica le evidenze Graph riuscite
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidenza-grafo-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale-*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: referto del gate heap grafo a 10k
        if: ${{ failure() && steps.graph_heap_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: heap-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true

  benches:
    name: banchi del movimento, dei disegni e della griglia
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Vite compila il nucleo della lavagna in .wasm quando serve la pagina
      # (N3 T14): senza il bersaglio la shell del banco non parte.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      # Le coreografie si misurano contro sé stesse, non contro una baseline:
      # stato finale uguale col moto e senza, nessun residuo, solo transform e
      # opacità, un'inversione a metà che torna al punto di partenza.
      - name: il movimento rispetta le sue quattro regole
        id: bench_motion
        if: ${{ !cancelled() }}
        run: npm run bench:motion
        working-directory: apps/client
      - name: referto e fotogrammi del banco del movimento
        if: ${{ failure() && steps.bench_motion.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-moto-${{ github.sha }}
          path: apps/client/bench/.output/moto/
          include-hidden-files: true
      - name: i disegni si vedono uguali sul foglio, in Lettura e nell'export
        id: bench_fidelity
        if: ${{ !cancelled() }}
        run: npm run bench:fidelity
        working-directory: apps/client
      - name: le immagini del banco di fedeltà
        if: ${{ failure() && steps.bench_fidelity.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-fedelta-${{ github.sha }}
          path: apps/client/bench/.output/fidelity/
          include-hidden-files: true
      - name: i gesti della griglia tengono bozza, fuoco e cella attiva
        id: bench_grid
        if: ${{ !cancelled() }}
        run: npm run bench:grid
        working-directory: apps/client
      - name: il referto e le foto del banco dei gesti della griglia
        if: ${{ failure() && steps.bench_grid.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-griglia-${{ github.sha }}
          path: |
            apps/client/bench/.output/grid-gestures.json
            apps/client/bench/.output/grid-gestures/
          include-hidden-files: true
      - name: cinquantamila elementi si aprono e si muovono senza scatti
        id: bench_large
        if: ${{ !cancelled() }}
        run: npm run bench:large
        working-directory: apps/client
      - name: il referto del banco delle scene grandi
        if: ${{ failure() && steps.bench_large.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-scene-grandi-${{ github.sha }}
          path: apps/client/bench/.output/large.json
          include-hidden-files: true

  webview:
    # N0: le misure nella WebView vera e non nel Chromium dei banchi. Su un
    # runner senza scheda grafica i numeri non sono assoluti: la sezione `ci`
    # di `bench/webview/budgets.json` è una soglia di peggioramento.
    #
    # Due macchine: R1 da sola dura circa 8 minuti (quindici giri di apertura
    # e chiusura, ognuno con una quiete che finisce quando la memoria si
    # ferma, al più 10 s; fino al 20 novembre 2026 trenta giri da un minuto
    # l'uno ne facevano 40), e gli altri scenari insieme circa dieci. Ognuna compila l'app per conto suo: un
    # artefatto passato da un job all'altro metterebbe la compilazione in
    # fila davanti a entrambe. Una macchina sola per R1 è anche una misura
    # della memoria senza altri scenari prima.
    #
    # Due compilazioni di release e circa 20 minuti: come i banchi, non su una PR in
    # bozza, e su una PR pronta soltanto se tocca ciò che finisce nell'app
    # (`webview` di `cosa cambia`). Su `main` gira sempre, e il cancello del
    # rilascio lo vuole verde.
    name: la WebView vera (WebKitGTK, ${{ matrix.gruppo }})
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.webview == 'true'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gruppo: S1–S3
            scenari: S1,S2,S3,S7,T1,I1,L1,C1
            artefatto: scenari
          - gruppo: R1
            scenari: R1
            artefatto: memoria
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: webview
          # Le due macchine compilano la stessa app: salva la prima.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.artefatto == 'scenari' }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Dipendenze di sistema di Tauri, WebKitWebDriver e un display virtuale
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev webkit2gtk-driver xvfb
      - run: npm ci
        working-directory: apps/client
      - run: npm run build
        working-directory: apps/client
      # `bench-gc` dà all'app il gancio della raccolta forzata che R1 chiede
      # prima di ogni lettura (#284); il rilascio non lo accende.
      - name: l'app di release con la shell dentro e il gancio della raccolta (bench-gc)
        run: cargo build --release --locked -p fub-app --features tauri/custom-protocol,bench-gc
      - name: tauri-driver, alla versione fissata
        run: cargo install tauri-driver --version "=2.1.0" --locked
      # Il gruppo S1–S3 fa S1–S3, S7, le tessere (T1), l'indicizzazione (I1),
      # il nucleo della lavagna (L1) e i chunk dei profili (C1); il gruppo R1
      # la memoria.
      - name: gli scenari ${{ matrix.scenari }} nella WebKitGTK
        # `-noreset`: senza, Xvfb si rigenera quando l'app di uno scenario si
        # chiude, e l'app dopo a volte non apre il display (GTK non parte, #287).
        env:
          SCENARI: ${{ matrix.scenari }}
        run: xvfb-run -a -s "-screen 0 1280x800x24 -maxclients 2048 -noreset" npm run bench:webview -- "--only=$SCENARI" --native-driver=/usr/bin/WebKitWebDriver
        working-directory: apps/client
      - name: il referto delle misure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: webview-${{ matrix.artefatto }}-${{ github.sha }}
          path: apps/client/bench/.output/webview
          include-hidden-files: true

  librerie-runtime:
    # K0, livello 3 del piano dei componenti: due componenti Rust in librerie
    # dinamiche e una libreria comune caricate a runtime, su Linux e Windows. Il
    # referto dice se il caricamento, la rimozione di un file e le firme
    # tengono, e quanto pesa la consegna contro l'ospite statico.
    name: le librerie a runtime (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.riuso != 'true' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Una PR bozza la prova solo su Linux, come i test; macOS è in pausa,
        # come nel job `test`.
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.draft) && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - run: node tools/librerie-runtime/prova.mjs --out librerie-runtime-referto
      - name: il referto
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: librerie-runtime-${{ matrix.os }}-${{ github.sha }}
          path: librerie-runtime-referto/referto.json
