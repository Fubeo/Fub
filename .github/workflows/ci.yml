name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  invariants:
    name: invarianti (abi↔WIT, additività, dipendenze)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: le action esterne sono pin a commit
        run: node .github/scripts/check-actions-pinned.mjs
      - name: Conformità abi ↔ crates/fub-abi/wit/fub/abi.wit
        run: cargo test -p fub-abi --test wit_conformance
      - name: Additività del contratto (crates/fub-abi/wit/frozen/)
        run: cargo test -p fub-abi --test wit_additivity
      - name: invarianti di dipendenza (abi/kernel agnostici, features senza kernel)
        run: cargo test -p fub-abi --test dependency_invariant
      - name: la shell raggiunge il workspace solo dalle porte strette dell'host
        run: node .github/scripts/check-host-workspace-boundary.mjs
      - name: gli errori letterali non crescono
        run: node .github/scripts/check-error-literals.mjs
      - name: il lettore dei commenti di Rust distingue la prosa da stringhe e caratteri
        run: node .github/scripts/check-rust-comments.mjs --self-test
      - name: i commenti di Rust restano attaccati a ciò che descrivono
        run: node .github/scripts/check-rust-comments.mjs
      - name: aggiungi il bersaglio del confine
        run: rustup target add wasm32-unknown-unknown
      - name: il contratto attraversa il confine
        run: cargo build --manifest-path tools/varco-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: le versioni delle dipendenze si scrivono in un posto solo
        run: node .github/scripts/check-cargo-versions.mjs
      - name: ogni cargo feature è compilata da qualcuno
        run: node .github/scripts/check-cargo-feature-default.mjs
      - name: ogni forma di libreria è consumata da qualcuno
        run: node .github/scripts/check-crate-type.mjs
      - name: il profilo dev è quello deciso, chiave per chiave
        run: node .github/scripts/check-dev-profile.mjs
      - name: le union del mirror TS sono derivate dai tipi Rust
        run: cargo test -p fub-abi --test ts_enums
      - name: le feature ufficiali si spengono
        run: |
          cargo build -p fub-features --no-default-features
          cargo build -p fub-features --no-default-features --features outline
          cargo build -p fub-host --no-default-features --features outline,notify-watcher
      - name: ogni feature ufficiale compila da sola
        run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fub-features") | .features | keys[] | select(. != "default")')
          for feature in $features; do
            cargo check -p fub-features --no-default-features --features "$feature"
          done
      - name: una cargo feature per bundle, e l'inventario è dove si legge
        run: cargo test -p fub-features --test cargo_features
      - name: i moduli di feature non si parlano
        run: cargo test -p fub-features --test independent_modules

  supply-chain:
    name: supply chain (licenze, advisory, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-sbom
      - name: Genera l'SBOM
        run: cargo sbom --output-format spdx_json_2_3 > fub-sbom.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-spdx
          path: fub-sbom.spdx.json

  fmt:
    name: fmt + clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Il ramo Windows del kernel, compilato da qui
        run: cargo check -p fub-kernel --all-targets --target x86_64-pc-windows-msvc

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Dipendenze di sistema di Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: il bersaglio dei componenti, prima dei test che lo pretendono
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
          cargo check -p fub-format-sheet --target wasm32-wasip2 --all-targets --locked
      - name: CAS del backend reale, con diagnostica isolata
        run: cargo test -p fub-kernel --test rooted_cas -- --nocapture
      - name: regressioni unitarie dei backend storage
        run: "cargo test -p fub-kernel --lib storage:: -- --nocapture"
      - name: cestino e ripristino attraverso il contratto
        run: cargo test -p fub-kernel --test trash --test structural_host -- --nocapture
      - run: cargo test --workspace --no-fail-fast

  docs:
    name: documentazione canonica
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Link interni dei documenti
        run: node .github/scripts/check-doc-links.mjs
      - name: Ogni pagina canonica è raggiungibile
        run: node .github/scripts/check-doc-orphans.mjs
      - name: Le pagine rispettano le soglie dimensionali
        run: node .github/scripts/check-doc-size.mjs
      - name: Il Markdown rispetta lo stile canonico
        run: node .github/scripts/check-markdown-style.mjs
      - name: Ogni diagramma Mermaid è valido e renderizzabile
        run: node .github/scripts/check-mermaid.mjs --render
      - name: Il lettore dei numeri sa leggere l'italiano
        run: node .github/scripts/check-prose.mjs --self-test
      - name: I numeri e le garanzie che la prosa afferma sui sorgenti
        run: node .github/scripts/check-prose.mjs
      - name: La riga vuota che spezza una tabella non è quella che ne separa due
        run: node .github/scripts/check-tables.mjs --autoprova
      - name: Ogni tabella dei documenti è ancora una tabella, e con tutte le sue colonne
        run: node .github/scripts/check-tables.mjs
      - name: Il ciclo locale di CONTRIBUTING.md sa leggere i comandi della CI
        run: node .github/scripts/check-locale-loop.mjs --self-test
      - name: Ogni comando della CI sta nel ciclo locale di CONTRIBUTING.md, o fra le sue eccezioni
        run: node .github/scripts/check-locale-loop.mjs

  client:
    name: client (type-check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: i derivati del tema si rigenerano byte per byte
        run: |
          npm run theme:generate
          git diff --exit-code -- src/theme/serie theme/author
          npm run theme:verify
        working-directory: apps/client
      - run: npm run typecheck
        working-directory: apps/client
      - run: npm test
        working-directory: apps/client
      - run: npm run build
        working-directory: apps/client
      - name: il confine CodeMirror resta nel package testuale
        run: node .github/scripts/check-codemirror-boundary.mjs
      - name: ogni ascoltatore globale della shell ha una Vita
        run: node .github/scripts/check-listeners.mjs
      - name: dentro un giro non si aspetta di nascosto
        run: node .github/scripts/check-races.mjs
      - name: nessun pacchetto npm in due copie
        run: node .github/scripts/check-npm-copies.mjs
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: la scala del grafo resta riproducibile
        id: graph_scale
        run: npm run bench:graph-scale -- --nodes 2000 --seed 6 --cycles 3
        working-directory: apps/client
      - name: conserva il referto 2k
        if: ${{ steps.graph_scale.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-2k.json
        working-directory: apps/client
      - name: referto della scala del grafo
        if: ${{ failure() && steps.graph_scale.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: graph-scale-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          include-hidden-files: true
          if-no-files-found: error
      - name: soak osservativo del grafo a 10k
        id: graph_scale_10k
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 8
        working-directory: apps/client
      - name: conserva il referto 10k osservativo
        if: ${{ steps.graph_scale_10k.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-8.json
        working-directory: apps/client
      - name: referto del soak grafo a 10k
        if: ${{ failure() && steps.graph_scale_10k.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true
      - name: la coda heap del grafo 10k si stabilizza
        id: graph_heap_stability
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 16
        working-directory: apps/client
      - name: conserva il referto 10k prolungato
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-16.json
        working-directory: apps/client
      - name: pubblica le evidenze Graph riuscite
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidenza-grafo-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale-*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: referto del gate heap grafo a 10k
        if: ${{ failure() && steps.graph_heap_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: heap-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true
      - name: le scene restano uguali alle baseline del runner
        id: bench_verify
        run: npm run bench:verify
        working-directory: apps/client
      - name: differenze e foglio di contatto del banco visivo
        if: ${{ failure() && steps.bench_verify.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-visivo-${{ github.sha }}
          path: apps/client/bench/.output/
          include-hidden-files: true
      - name: il contrasto della pagina vera, in tutte e due le luci
        if: ${{ !cancelled() && (steps.bench_verify.outcome == 'success' || steps.bench_verify.outcome == 'failure') }}
        run: npm run bench:a11y
        working-directory: apps/client
