name: CI

# Un push su un ramo con una PR aperta faceva girare tutto due volte, una per
# `push` e una per `pull_request`. Il push conta solo su `main`; gli altri rami
# passano dalla PR, o da `workflow_dispatch`.
on:
  workflow_dispatch:
    inputs:
      fuzz_completo:
        description: "i fuzzer del Markdown a 20 000 casi invece di 2000"
        type: boolean
        default: false
  push:
    branches: [main]
  # `ready_for_review`: segnare pronta una PR in bozza fa partire la CI
  # completa (vedi il job `test` e i banchi).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Un push nuovo su una PR annulla la corsa vecchia della stessa PR. Su `main`
# ogni commit tiene la sua corsa: il cancello del rilascio la cerca per SHA.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # I fuzzer del Markdown girano a 2000 casi. I 20 000 sono per la corsa
  # settimanale e per chi li chiede a mano, quando serve una prova a fondo.
  FUB_FUZZ_CASI: ${{ (github.event_name == 'schedule' || inputs.fuzz_completo) && '20000' || '2000' }}
  FUB_FUZZ_TRASFERIMENTO: ${{ (github.event_name == 'schedule' || inputs.fuzz_completo) && '20000' || '2000' }}

jobs:
  # Una PR in bozza è lavoro in corso: riceve la CI corta (Linux, niente
  # banchi). Segnata pronta riceve tutto, e i banchi solo se tocca il client.
  # Su `main`, sul cron e a mano gira sempre tutto. Questo job dice ai banchi
  # se il client è toccato.
  changes:
    name: cosa cambia
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.diff.outputs.client }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: il client è toccato?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(apps/client/|\.github/workflows/ci\.yml$)'; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi

  invariants:
    name: invarianti (abi↔WIT, additività, dipendenze)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: le action esterne sono pin a commit
        run: node .github/scripts/check-actions-pinned.mjs
      - name: Conformità abi ↔ crates/fub-abi/wit/fub/abi.wit
        run: cargo test -p fub-abi --test wit_conformance
      - name: Additività del contratto (crates/fub-abi/wit/frozen/)
        run: cargo test -p fub-abi --test wit_additivity
      - name: invarianti di dipendenza (abi/kernel agnostici, features senza kernel)
        run: cargo test -p fub-abi --test dependency_invariant
      - name: la shell raggiunge il workspace solo dalle porte strette dell'host
        run: node .github/scripts/check-host-workspace-boundary.mjs
      - name: soltanto gli adattatori nominano WordCraft e GridCraft nei sorgenti
        run: node .github/scripts/check-engine-boundary.mjs
      - name: la copia di WordCraft è l'upstream del lock più le patch di vendor/wordcraft/patches
        run: node tools/vendor-craft/vendor.mjs wordcraft check
      - name: la copia di GridCraft è l'upstream del lock più le patch di vendor/gridcraft/patches
        run: node tools/vendor-craft/vendor.mjs gridcraft check
      - name: le patch dei motori si portano a tre vie (upstream finto, senza rete)
        run: node tools/vendor-craft/vendor.mjs self-test
      - name: gli errori letterali non crescono
        run: node .github/scripts/check-error-literals.mjs
      - name: il lettore dei commenti di Rust distingue la prosa da stringhe e caratteri
        run: node .github/scripts/check-rust-comments.mjs --self-test
      - name: il cancello del rilascio rifiuta CI incomplete e canali stabili senza firme
        run: node .github/scripts/check-release-gate.mjs --self-test
      - name: i commenti di Rust restano attaccati a ciò che descrivono
        run: node .github/scripts/check-rust-comments.mjs
      - name: aggiungi il bersaglio del confine
        run: rustup target add wasm32-unknown-unknown
      - name: il contratto attraversa il confine
        run: cargo build --manifest-path tools/varco-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: le versioni delle dipendenze si scrivono in un posto solo
        run: node .github/scripts/check-cargo-versions.mjs
      - name: la versione del prodotto è la stessa in Cargo, Tauri e npm
        run: node .github/scripts/check-release-version.mjs
      - name: ogni cargo feature è compilata da qualcuno
        run: node .github/scripts/check-cargo-feature-default.mjs
      - name: ogni forma di libreria è consumata da qualcuno
        run: node .github/scripts/check-crate-type.mjs
      - name: il profilo dev è quello deciso, chiave per chiave
        run: node .github/scripts/check-dev-profile.mjs
      - name: le union del mirror TS sono derivate dai tipi Rust
        run: cargo test -p fub-abi --test ts_enums
      - name: le feature ufficiali si spengono
        run: |
          cargo build -p fub-features --no-default-features
          cargo check -p fub-features --no-default-features --all-targets
          cargo build -p fub-features --no-default-features --features outline
          cargo build -p fub-host --no-default-features --features outline,notify-watcher
      - name: ogni feature ufficiale compila da sola
        run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fub-features") | .features | keys[] | select(. != "default")')
          for feature in $features; do
            cargo check -p fub-features --no-default-features --features "$feature"
          done
      - name: una cargo feature per bundle, e l'inventario è dove si legge
        run: cargo test -p fub-features --test cargo_features
      - name: i moduli di feature non si parlano
        run: cargo test -p fub-features --test independent_modules

  supply-chain:
    name: supply chain (licenze, advisory, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-sbom
      - name: Genera l'SBOM
        run: cargo sbom --output-format spdx_json_2_3 > fub-sbom.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-spdx
          path: fub-sbom.spdx.json

  fmt:
    name: fmt + clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy dell'host senza la feature `draw`
        run: cargo clippy -p fub-host --no-default-features --features notify-watcher,http-client,official-features,rich --all-targets -- -D warnings
      - name: clippy con la feature `draw` delle feature (FUORI_DAL_DEFAULT)
        run: cargo clippy -p fub-features --features draw --all-targets -- -D warnings
      - name: Il ramo Windows del kernel, compilato da qui
        run: cargo check -p fub-kernel --all-targets --target x86_64-pc-windows-msvc

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # In bozza solo Linux: Windows e macOS girano quando la PR è pronta.
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.draft) && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      # Su Windows il collegamento di circa 270 eseguibili di prova costava da
      # solo 26 minuti. `rust-lld` collega più in fretta del linker di MSVC, e
      # le sole righe nel debug alleggeriscono i PDB senza togliere file e riga
      # ai backtrace. Prima della cache, perché ne cambia la chiave.
      - name: su Windows, rust-lld e il debug delle sole righe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      # Il budget delle cache è di 10 GB per tutto il repository, e quando si
      # sfora se ne va la più vecchia: i job che compilano un sottoinsieme di
      # questo leggono la cache dei test di Linux (`shared-key: test`) invece
      # di salvarne una loro.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          shared-key: test
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-nextest
      - name: Dipendenze di sistema di Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: il bersaglio dei componenti, prima dei test che lo pretendono
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
          cargo check -p fub-scene --target wasm32-wasip2 --all-targets --locked
          cargo check -p fub-ink --target wasm32-wasip2 --all-targets --locked
      # Gli stessi test di `cargo test --workspace`, ma in parallelo anche fra
      # un eseguibile e l'altro. Il profilo `ci` di `.config/nextest.toml`
      # stampa l'uscita di ogni test rosso e, alla fine, quelli lenti.
      - name: i test del workspace
        run: cargo nextest run --workspace --no-fail-fast --profile ci
      - name: gli esempi della documentazione
        run: cargo test --workspace --doc --no-fail-fast
      # Ogni processo di prova copia il componente che usa: le copie non
      # servono alla corsa dopo, e non entrano nella cache.
      - name: via le copie dei componenti
        if: always()
        shell: bash
        run: rm -f target/tmp/*.wasm

  variants:
    # Le varianti di feature non dipendono dal sistema: girano qui, accanto ai
    # tre job dei test, invece di allungarli. Lo stesso per i workspace dei
    # motori, che hanno il loro lock.
    name: varianti di feature e motori in vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: test
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-nextest
      - name: il componente d'esempio, prima dei test che lo pretendono
        run: cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
      - name: l'host senza la feature `draw`, con gli SVG come allegati
        run: cargo nextest run -p fub-host --no-default-features --features notify-watcher,http-client,official-features,rich --no-fail-fast --profile ci
      - name: «Nuovo disegno» e l'export dei disegni, con la feature `draw` delle feature (FUORI_DAL_DEFAULT)
        run: cargo nextest run -p fub-features --features draw --no-fail-fast --profile ci
      - name: i test dei motori di WordCraft, nel workspace loro e con il loro lock
        env:
          CARGO_TARGET_DIR: target/wordcraft
        run: cargo test --manifest-path vendor/wordcraft/Cargo.toml --workspace --locked --no-fail-fast
      - name: i test dei motori di GridCraft, nel workspace loro e con il loro lock
        env:
          CARGO_TARGET_DIR: target/gridcraft
        run: cargo test --manifest-path vendor/gridcraft/Cargo.toml --workspace --locked --no-fail-fast

  libreoffice:
    name: i docx innestati, riletti da LibreOffice
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
          shared-key: test
      - name: LibreOffice senza interfaccia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - name: un salvataggio innestato si legge come il file di partenza
        env:
          FUB_SOFFICE: soffice
        run: cargo test -p fub-format-rich --test graft -- --nocapture

  docs:
    name: documentazione canonica
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: Link interni dei documenti
        run: node .github/scripts/check-doc-links.mjs
      - name: Ogni pagina canonica è raggiungibile
        run: node .github/scripts/check-doc-orphans.mjs
      - name: Le pagine rispettano le soglie dimensionali
        run: node .github/scripts/check-doc-size.mjs
      - name: Il Markdown rispetta lo stile canonico
        run: node .github/scripts/check-markdown-style.mjs
      - name: Ogni diagramma Mermaid è valido e renderizzabile
        run: node .github/scripts/check-mermaid.mjs --render
      - name: Il lettore dei numeri sa leggere l'italiano
        run: node .github/scripts/check-prose.mjs --self-test
      - name: I numeri e le garanzie che la prosa afferma sui sorgenti
        run: node .github/scripts/check-prose.mjs
      - name: La riga vuota che spezza una tabella non è quella che ne separa due
        run: node .github/scripts/check-tables.mjs --autoprova
      - name: Ogni tabella dei documenti è ancora una tabella, e con tutte le sue colonne
        run: node .github/scripts/check-tables.mjs
      - name: Il ciclo locale di CONTRIBUTING.md sa leggere i comandi della CI
        run: node .github/scripts/check-locale-loop.mjs --self-test
      - name: Ogni comando della CI sta nel ciclo locale di CONTRIBUTING.md, o fra le sue eccezioni
        run: node .github/scripts/check-locale-loop.mjs

  client:
    name: client (type-check + test + build)
    # Fissato: le baseline del banco visivo sono di questa immagine, e
    # `ubuntu-latest` cambia sotto i piedi. Si passa alla prossima di
    # proposito, rigenerando le baseline sulla CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: i derivati del tema si rigenerano byte per byte
        run: |
          npm run theme:generate
          git diff --exit-code -- src/theme/scrittoio theme/author
          npm run theme:verify
        working-directory: apps/client
      - run: npm run typecheck
        working-directory: apps/client
      - run: npm test
        working-directory: apps/client
      - run: npm run build
        working-directory: apps/client
      - name: il confine CodeMirror resta nel package testuale
        run: node .github/scripts/check-codemirror-boundary.mjs
      - name: ProseMirror resta in Scrittura e nei documenti
        run: |
          node .github/scripts/check-prosemirror-boundary.mjs --self-test
          node .github/scripts/check-prosemirror-boundary.mjs
      - name: la Tabella importa soltanto kit, moto, i18n e tsv
        run: |
          node .github/scripts/check-tabella-boundary.mjs --self-test
          node .github/scripts/check-tabella-boundary.mjs
      - name: un editor non scrive un ruolo del tema sull'elemento
        run: |
          node .github/scripts/check-inline-theme.mjs --self-test
          node .github/scripts/check-inline-theme.mjs
      - name: ogni ascoltatore globale della shell ha una Vita
        run: node .github/scripts/check-listeners.mjs
      - name: dentro un giro non si aspetta di nascosto
        run: node .github/scripts/check-races.mjs
      - name: nessun pacchetto npm in due copie
        run: node .github/scripts/check-npm-copies.mjs

  # I banchi girano in job loro accanto a quello dei test, invece che in fila
  # dietro di lui. Tutti sull'immagine delle baseline.
  visual:
    name: banco visivo (scene uguali alle baseline)
    needs: changes
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: le scene restano uguali alle baseline del runner
        id: bench_verify
        run: npm run bench:verify
        working-directory: apps/client
      - name: differenze e foglio di contatto del banco visivo
        if: ${{ failure() && steps.bench_verify.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-visivo-${{ github.sha }}
          path: apps/client/bench/.output/
          include-hidden-files: true

  a11y:
    # Le due luci sono due corse separate dello stesso banco: in fila
    # costavano quasi quattordici minuti.
    name: contrasto e tastiera (${{ matrix.light }})
    needs: changes
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true')
    strategy:
      fail-fast: false
      matrix:
        light: [dark, light]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: il contrasto della pagina vera e i gesti della tastiera
        run: npm run bench:a11y -- --light=${{ matrix.light }}
        working-directory: apps/client

  graph:
    name: banchi del grafo (scala e heap)
    needs: changes
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: la scala del grafo resta riproducibile
        id: graph_scale
        run: npm run bench:graph-scale -- --nodes 2000 --seed 6 --cycles 3
        working-directory: apps/client
      - name: conserva il referto 2k
        if: ${{ steps.graph_scale.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-2k.json
        working-directory: apps/client
      - name: referto della scala del grafo
        if: ${{ failure() && steps.graph_scale.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: graph-scale-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          include-hidden-files: true
          if-no-files-found: error
      - name: soak osservativo del grafo a 10k
        id: graph_scale_10k
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 8
        working-directory: apps/client
      - name: conserva il referto 10k osservativo
        if: ${{ steps.graph_scale_10k.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-8.json
        working-directory: apps/client
      - name: referto del soak grafo a 10k
        if: ${{ failure() && steps.graph_scale_10k.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true
      - name: la coda heap del grafo 10k si stabilizza
        id: graph_heap_stability
        run: npm run bench:graph-scale -- --nodes 10000 --seed 6 --cycles 1 --soak-windows 16
        working-directory: apps/client
      - name: conserva il referto 10k prolungato
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        run: cp bench/.output/graph-scale.json bench/.output/graph-scale-10k-16.json
        working-directory: apps/client
      - name: pubblica le evidenze Graph riuscite
        if: ${{ steps.graph_heap_stability.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidenza-grafo-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale-*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: referto del gate heap grafo a 10k
        if: ${{ failure() && steps.graph_heap_stability.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: heap-grafo-10k-${{ github.sha }}
          path: apps/client/bench/.output/graph-scale.json
          if-no-files-found: error
          include-hidden-files: true

  benches:
    name: banchi del movimento, dei disegni, delle tavole e della griglia
    needs: changes
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: il browser del banco visivo, alla revisione che il lock pinna
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      # Le coreografie si misurano contro sé stesse, non contro una baseline:
      # stato finale uguale col moto e senza, nessun residuo, solo transform e
      # opacità, un'inversione a metà che torna al punto di partenza.
      - name: il movimento rispetta le sue quattro regole
        id: bench_motion
        if: ${{ !cancelled() }}
        run: npm run bench:motion
        working-directory: apps/client
      - name: referto e fotogrammi del banco del movimento
        if: ${{ failure() && steps.bench_motion.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-moto-${{ github.sha }}
          path: apps/client/bench/.output/moto/
      - name: i disegni si vedono uguali sul foglio, in Lettura e nell'export
        id: bench_fidelity
        if: ${{ !cancelled() }}
        run: npm run bench:fidelity
        working-directory: apps/client
      - name: le immagini del banco di fedeltà
        if: ${{ failure() && steps.bench_fidelity.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-fedelta-${{ github.sha }}
          path: apps/client/bench/.output/fidelity/
          include-hidden-files: true
      - name: venti tavole si percorrono senza scatti
        id: bench_boards
        if: ${{ !cancelled() }}
        run: npm run bench:boards
        working-directory: apps/client
      - name: il referto del banco delle tavole
        if: ${{ failure() && steps.bench_boards.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-tavole-${{ github.sha }}
          path: apps/client/bench/.output/boards-20.json
          include-hidden-files: true
      - name: trecento connettori si spostano senza scatti
        id: bench_connectors
        if: ${{ !cancelled() }}
        run: npm run bench:connectors
        working-directory: apps/client
      - name: il referto del banco dei connettori
        if: ${{ failure() && steps.bench_connectors.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-connettori-${{ github.sha }}
          path: apps/client/bench/.output/connectors-300.json
          include-hidden-files: true
      - name: i gesti della griglia tengono bozza, fuoco e cella attiva
        id: bench_grid
        if: ${{ !cancelled() }}
        run: npm run bench:grid
        working-directory: apps/client
      - name: il referto e le foto del banco dei gesti della griglia
        if: ${{ failure() && steps.bench_grid.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-griglia-${{ github.sha }}
          path: |
            apps/client/bench/.output/grid-gestures.json
            apps/client/bench/.output/grid-gestures/
          include-hidden-files: true
      - name: cinquantamila elementi si aprono e si muovono senza scatti
        id: bench_large
        if: ${{ !cancelled() }}
        run: npm run bench:large
        working-directory: apps/client
      - name: il referto del banco delle scene grandi
        if: ${{ failure() && steps.bench_large.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banco-scene-grandi-${{ github.sha }}
          path: apps/client/bench/.output/large.json
          include-hidden-files: true
