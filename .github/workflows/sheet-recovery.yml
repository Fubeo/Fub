name: Sheet recovery verification

on:
  push:
    branches: [feat/issue11-grid-window-session]
    paths: [.github/workflows/sheet-recovery.yml]

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - name: Snapshot riproducibile senza credenziali
        run: |
          mkdir -p /tmp/fub-recovery
          git bundle create /tmp/fub-recovery/source.bundle HEAD
          git rev-parse HEAD > /tmp/fub-recovery/source-sha.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sheet-source-${{ github.sha }}
          path: /tmp/fub-recovery/source.*
          retention-days: 1
          if-no-files-found: error
      - name: Dipendenze bloccate per la verifica offline
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu --target wasm32-wasip2 --target wasm32-unknown-unknown
      - name: Toolchain e registry pubblici, senza configurazione o token
        run: |
          tar -czf /tmp/fub-recovery/rust-toolchain.tar.gz -C "$(rustc --print sysroot)" bin lib
          tar -czf /tmp/fub-recovery/cargo-registry.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sheet-rust-${{ github.sha }}
          path: /tmp/fub-recovery/*.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Formattazione proposta, senza riscrivere il branch
        run: |
          cargo fmt --all
          git diff -- crates/fub-host > /tmp/fub-recovery/format.patch
      - name: Banco nativo delle finestre
        run: cargo test -p fub-host --test sheet_windows -- --nocapture
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: sheet-format-${{ github.sha }}
          path: /tmp/fub-recovery/format.patch
          retention-days: 1
          if-no-files-found: warn
