name: Finalizzazione main

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: finalize-main-once
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event.workflow_run.id == 32992204248 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verifica main, elimina gli altri branch e certifica il commit finale
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "Fubeo"
          git config user.email "83821420+Fubeo@users.noreply.github.com"

          dispatch_and_wait() {
            local target_sha="$1"
            local run_id=""

            gh workflow run ci.yml --ref main

            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow ci.yml \
                  --branch main \
                  --event workflow_dispatch \
                  --limit 20 \
                  --json databaseId,headSha,createdAt \
                  --jq ".[] | select(.headSha == \"${target_sha}\") | .databaseId" \
                  | head -n 1
              )"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              echo "Impossibile trovare la CI avviata per ${target_sha}." >&2
              exit 1
            fi

            gh run watch "$run_id" --exit-status --interval 15
            test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = "success"
          }

          git fetch origin main
          git checkout -B main origin/main

          # Prima certificazione: il codice riparato deve superare l'intera CI canonica.
          dispatch_and_wait "$(git rev-parse HEAD)"

          for branch in refactor/unified-client-direct refactor/unified-client-shells; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          mapfile -t remaining < <(gh api repos/Fubeo/Fub/branches --paginate --jq '.[].name')
          if [[ ${#remaining[@]} -ne 1 || "${remaining[0]}" != "main" ]]; then
            printf 'Branch residui: %s\n' "${remaining[*]}" >&2
            exit 1
          fi

          rm .github/workflows/finalize-main-once.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(repo): conserva soltanto il branch main"
          git push origin HEAD:main

          # Certificazione definitiva sul commit che non contiene più il workflow temporaneo.
          dispatch_and_wait "$(git rev-parse HEAD)"
