          """,
          )

          insert_before(
              "crates/fub-host/src/vaults.rs",
              "    #[test]\n    fn the_favorites_are_in_top_and_not_expire() {\n",
              r"""    #[test]
              fn last_opened_ignores_favorites_and_breaks_ties_by_root() {
                  let reg = VaultRegistry::in_memory();
                  reg.notes_opened(Utf8Path::new("/z"), 300).unwrap();
                  reg.notes_opened(Utf8Path::new("/a"), 300).unwrap();
                  reg.notes_opened(Utf8Path::new("/favorite"), 1).unwrap();
                  reg.set_favorite(Utf8Path::new("/favorite"), true)
                      .unwrap();

                  assert_eq!(
                      reg.last_opened().expect("un vault recente").root,
                      "/a",
                      "vince la data, e a parità la radice lessicograficamente minore"
                  );
              }

          """,
          )

          replace_once(
              "crates/fub-kernel/src/registry.rs",
              r"""    pub fn register(&mut self, provider: Box<dyn FormatProvider>) -> Result<(), RegistryConflict> {
                  let descriptor = provider.descriptor();
                  for ext in &descriptor.extensions {
                      let ext = ext.to_lowercase();
                      if let Some(&at) = self.by_ext.get(&ext) {
                          return Err(RegistryConflict {
                              extension: ext,
                              incumbent: self.providers[at].descriptor().id,
                              challenger: descriptor.id,
                          });
                      }
                  }
                  self.insert(provider, &descriptor.extensions);
                  Ok(())
              }
          """,
              r"""    pub fn register(&mut self, provider: Box<dyn FormatProvider>) -> Result<(), RegistryConflict> {
                  let descriptor = provider.descriptor();
                  let mut extensions = Vec::with_capacity(descriptor.extensions.len());
                  for ext in &descriptor.extensions {
                      let ext = ext.to_lowercase();
                      if let Some(&at) = self.by_ext.get(&ext) {
                          return Err(RegistryConflict {
                              extension: ext,
                              incumbent: self.providers[at].descriptor().id,
                              challenger: descriptor.id,
                          });
                      }
                      extensions.push(ext);
                  }
                  self.insert_normalized(provider, extensions);
                  Ok(())
              }
          """,
          )

          replace_once(
              "crates/fub-kernel/src/registry.rs",
              r"""    fn insert(&mut self, provider: Box<dyn FormatProvider>, extensions: &[String]) {
                  let idx = self.providers.len();
                  for ext in extensions {
                      self.by_ext.insert(ext.to_lowercase(), idx);
                  }
                  self.providers.push(provider);
              }
          """,
              r"""    fn insert(&mut self, provider: Box<dyn FormatProvider>, extensions: &[String]) {
                  let extensions = extensions.iter().map(|ext| ext.to_lowercase()).collect();
                  self.insert_normalized(provider, extensions);
              }

              fn insert_normalized(
                  &mut self,
                  provider: Box<dyn FormatProvider>,
                  extensions: Vec<String>,
              ) {
                  let idx = self.providers.len();
                  for ext in extensions {
                      self.by_ext.insert(ext, idx);
                  }
                  self.providers.push(provider);
              }
          """,
          )

          replace_once(
              "crates/fub-kernel/src/registry.rs",
              r"""    pub fn provider_for_ext(&self, ext: &str) -> Option<&dyn FormatProvider> {
                  self.by_ext
                      .get(&ext.to_lowercase())
                      .map(|&the| self.providers[the].as_ref())
              }
          """,
              r"""    pub fn provider_for_ext(&self, ext: &str) -> Option<&dyn FormatProvider> {
                  if let Some(&at) = self.by_ext.get(ext) {
                      return Some(self.providers[at].as_ref());
                  }
                  self.by_ext
                      .get(&ext.to_lowercase())
                      .map(|&at| self.providers[at].as_ref())
              }
          """,
          )

          replace_once(
              "crates/fub-kernel/src/registry.rs",
              r"""    pub fn has_doc_ext(&self, ext: &str) -> bool {
                  self.by_ext.keys().any(|and| and.eq_ignore_ascii_case(ext))
              }
          """,
              r"""    pub fn has_doc_ext(&self, ext: &str) -> bool {
                  if self.by_ext.contains_key(ext) {
                      return true;
                  }
                  ext.bytes().any(|b| b.is_ascii_uppercase())
                      && self.by_ext.contains_key(&ext.to_ascii_lowercase())
              }
          """,
          )

          insert_before(
              "crates/fub-kernel/src/registry.rs",
              "    #[test]\n    fn replace_remains_possible_but_goes_asked_for_name() {\n",
              r"""    #[test]
              fn extension_lookups_use_normalized_hash_keys() {
                  let mut reg = FormatRegistry::new();
                  reg.register(Box::new(Fake("markdown", "md"))).unwrap();

                  assert_eq!(
                      reg.provider_for_ext("md").unwrap().descriptor().id,
                      "markdown"
                  );
                  assert_eq!(
                      reg.provider_for_ext("MD").unwrap().descriptor().id,
                      "markdown"
                  );
                  assert!(reg.has_doc_ext("md"));
                  assert!(reg.has_doc_ext("MD"));
                  assert!(!reg.has_doc_ext("txt"));
              }

          """,
          )

          replace_once(
              "crates/fub-abi/src/edit.rs",
              "        ordered.sort_by_key(|and| and.span.start);\n",
              "        ordered.sort_unstable_by_key(|and| and.span.start);\n",
          )

          replace_once(
              "crates/fub-abi/src/edit.rs",
              "        let mut out = String::with_capacity(source.len());\n",
              r"""        let capacity = ordered.iter().fold(source.len(), |len, edit| {
                      len - (edit.span.end - edit.span.start) + edit.text.len()
                  });
                  let mut out = String::with_capacity(capacity);
          """,
          )

          replace_once(
              "crates/fub-kernel/src/drafts.rs",
              r"""    pub(crate) fn discard(&self, doc: &DocId) -> std::io::Result<()> {
                  let path = self.path(doc);
                  if !self.storage.exists(&path) {
                      return Ok(());
                  }
                  self.storage.remove(&path)
              }
          """,
              r"""    pub(crate) fn discard(&self, doc: &DocId) -> std::io::Result<()> {
                  crate::error::optional(self.storage.remove(&self.path(doc)))?;
                  Ok(())
              }
          """,
          )

          replace_once(
              "crates/fub-abi/src/rules/path.rs",
              r"""pub fn resolution_key(s: &str) -> String {
              composed(s.trim()).to_lowercase()
          }
          """,
              r"""pub fn resolution_key(s: &str) -> String {
              let s = s.trim();
              if s.is_ascii() {
                  let mut key = s.to_string();
                  key.make_ascii_lowercase();
                  key
              } else {
                  composed(s).to_lowercase()
              }
          }
          """,
          )

          replace_once(
              "crates/fub-abi/src/rules/path.rs",
              r"""pub fn exact_key(s: &str) -> String {
              composed(s.trim())
          }
          """,
              r"""pub fn exact_key(s: &str) -> String {
              let s = s.trim();
              if s.is_ascii() {
                  s.to_string()
              } else {
                  composed(s)
              }
          }
          """,
          )

          replace_once(
              "crates/fub-abi/src/rules/path.rs",
              r"""pub fn percent_encode_path(s: &str) -> String {
              let mut out = String::with_capacity(s.len());
              for c in s.chars() {
                  if is_safe(c) {
                      out.push(c);
                  } else {
                      // Fin qui `c` è ASCII per costruzione, ma un `encode_utf8` costa
                      // niente e non lascia in giro l'ipotesi.
                      let mut buf = [0u8; 4];
                      for b in c.encode_utf8(&mut buf).as_bytes() {
                          out.push_str(&format!("%{b:02X}"));
                      }
                  }
              }
              out
          }
          """,
              r"""pub fn percent_encode_path(s: &str) -> String {
              const HEX: &[u8; 16] = b"0123456789ABCDEF";

              let mut out = String::with_capacity(s.len());
              for c in s.chars() {
                  if is_safe(c) {
                      out.push(c);
                  } else {
                      let mut buf = [0u8; 4];
                      for &byte in c.encode_utf8(&mut buf).as_bytes() {
                          out.push('%');
                          out.push(HEX[(byte >> 4) as usize] as char);
                          out.push(HEX[(byte & 0x0f) as usize] as char);
                      }
                  }
              }
              out
          }
          """,
          )

          replace_once(
              "crates/fub-kernel/src/occurrences.rs",
              "    spans.sort_by_key(|s| (s.start, s.end));\n",
              "    spans.sort_unstable_by_key(|s| (s.start, s.end));\n",
          )

          replace_once(
              "crates/fub-kernel/src/occurrences.rs",
              r"""fn first_at_or_after(source: &str, needle: &str, from: usize) -> Option<Span> {
              let mut at = from;
              while at <= source.len() {
                  if !source.is_char_boundary(at) {
                      at += 1;
                      continue;
                  }
                  if let Some(len) = prefix_len_there(&source[at..], needle) {
                      return Some(Span::new(at, at + len));
                  }
                  at += 1;
              }
              None
          }
          """,
              r"""fn first_at_or_after(source: &str, needle: &str, from: usize) -> Option<Span> {
              debug_assert!(source.is_char_boundary(from));
              for (offset, _) in source[from..].char_indices() {
                  let at = from + offset;
                  if let Some(len) = prefix_len_there(&source[at..], needle) {
                      return Some(Span::new(at, at + len));
                  }
              }
              None
          }
          """,
          )

          replace_once(
              "frontend/src/state/layout.ts",
              r"""export function documents(p: PaneState): string[] {
            return p.tabs.flatMap((t) => (t.k === "doc" ? [t.doc] : []));
          }

          /// In quali riquadri è aperto un documento. Serve a chi deve chiuderlo
          /// dappertutto — cancellato, spostato nel cestino — e a chi deve capire se una
          /// modifica riguarda qualche superficie a schermo.
          export function panesWithDoc(doc: string, l: Layout = layout): string[] {
            return panes(l).filter((id) => documents(l.panes[id]).includes(doc));
          }
          """,
              r"""export function documents(p: PaneState): string[] {
            const out: string[] = [];
            for (const tab of p.tabs) {
              if (tab.k === "doc") out.push(tab.doc);
            }
            return out;
          }

          /// In quali riquadri è aperto un documento. Serve a chi deve chiuderlo
          /// dappertutto — cancellato, spostato nel cestino — e a chi deve capire se una
          /// modifica riguarda qualche superficie a schermo.
          export function panesWithDoc(doc: string, l: Layout = layout): string[] {
            return panes(l).filter((id) =>
              l.panes[id].tabs.some((tab) => tab.k === "doc" && tab.doc === doc),
            );
          }
          """,
          )

          replace_once(
              "frontend/src/state/layout.ts",
              r"""export function closePane(id: string, l: Layout = layout): boolean {
            if (!l.panes[id] || panes(l).length <= 1) return false;
            const potato = removeNode(l.tree, id);
            if (!potato) return false;
            l.tree = flatten(potato);
            delete l.panes[id];
            if (l.focus === id) l.focus = panes(l)[0];
            changed();
            return true;
          }
          """,
              r"""export function closePane(id: string, l: Layout = layout): boolean {
            if (!l.panes[id]) return false;
            const orderedPanes = panes(l);
            if (orderedPanes.length <= 1) return false;
            const potato = removeNode(l.tree, id);
            if (!potato) return false;
            l.tree = flatten(potato);
            delete l.panes[id];
            if (l.focus === id) l.focus = orderedPanes.find((pane) => pane !== id)!;
            changed();
            return true;
          }
          """,
          )

          replace_once(
              "frontend/src/panels/graph.ts",
              'import { openViewIn, documents, layout, pane, panes } from "../state/layout";\n',
              'import { openViewIn, layout, pane, panes } from "../state/layout";\n',
          )

          replace_once(
              "frontend/src/panels/graph.ts",
              r"""function openDocuments(): Set<string> {
            return new Set(
              panes().flatMap((id) => {
                const p = pane(id);
                return p ? documents(p) : [];
              }),
            );
          }
          """,
              r"""function openDocuments(): Set<string> {
            const open = new Set<string>();
            for (const id of panes()) {
              const p = pane(id);
              if (!p) continue;
              for (const tab of p.tabs) {
                if (tab.k === "doc") open.add(tab.doc);
              }
            }
            return open;
          }
          """,
          )

          replace_once(
              "frontend/src/editor/editor.ts",
              r"""      const endpoints = ranges.map((r) => [renderedOffset(r.from), renderedOffset(r.to)] as const);
                // Una conversione sola per tutte le endpointstà: `charToByteIndex` è una
                // scansione dall'inizio, e questa funzione gira a ogni battuta di
                // tastiera. Vedi `charToByteIndices`.
                const byte = charToByteIndices(
                  text,
                  endpoints.flatMap(([from, a]) => [from, a]),
                );
                const selections = endpoints.map(([from, a], i) => ({
                  start: byte[2 * i],
                  end: byte[2 * i + 1],
                  text: text.slice(from, a),
                }));
          """,
              r"""      const endpoints = new Array<number>(ranges.length * 2);
                for (let i = 0; i < ranges.length; i++) {
                  const range = ranges[i];
                  endpoints[2 * i] = renderedOffset(range.from);
                  endpoints[2 * i + 1] = renderedOffset(range.to);
                }
                // Una conversione sola per tutte le endpointstà: `charToByteIndex` è una
                // scansione dall'inizio, e questa funzione gira a ogni battuta di
                // tastiera. Vedi `charToByteIndices`.
                const byte = charToByteIndices(text, endpoints);
                const selections = ranges.map((_, i) => {
                  const from = endpoints[2 * i];
                  const to = endpoints[2 * i + 1];
                  return {
                    start: byte[2 * i],
                    end: byte[2 * i + 1],
                    text: text.slice(from, to),
                  };
                });
          """,
          )
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Il ramo Windows del kernel compila
        run: cargo check -p fub-kernel --all-targets --target x86_64-pc-windows-msvc
      - name: Prepara il componente WASM usato dai test
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
      - run: cargo test --workspace
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verifica le affermazioni della prosa sui sorgenti
        run: node .github/scripts/check-prose.mjs
      - name: Registra la patch verificata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates frontend
          git diff --cached --check
          git commit -m "perf(core): elimina scansioni e allocazioni superflue"
          git push origin HEAD:main
