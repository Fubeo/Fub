name: Applica audit prestazioni

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-performance-audit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
        working-directory: frontend
      - name: Applica le ottimizzazioni e le regressioni
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: attesa una occorrenza, trovate {count}")
              file.write_text(text.replace(old, new, 1))

          def insert_before(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, addition + marker)

          replace_once(
              "crates/fub-format-markdown/src/parse.rs",
              r"""fn lines_of(slice: &str) -> Vec<&str> {
              let mut result = Vec::new();
              let mut the = 0;
              let b = slice.as_bytes();
              for (j, &c) in b.iter().enumerate() {
                  if c == b'\n' || c == b'\r' {
                      result.push(&slice[the..j]);
                      the = j + 1;
                      if c == b'\r' && b.get(j + 1) == Some(&b'\n') {
                          the = j + 2;
                      }
                  }
              }
              if the < slice.len() {
                  result.push(&slice[the..]);
              }
              result
          }
          """,
              r"""fn lines_of<'a>(slice: &'a str) -> impl Iterator<Item = &'a str> {
              let mut rest = Some(slice);
              std::iter::from_fn(move || {
                  let current = rest.take()?;
                  if current.is_empty() {
                      return None;
                  }
                  let bytes = current.as_bytes();
                  let end = bytes
                      .iter()
                      .position(|&c| matches!(c, b'\r' | b'\n'))
                      .unwrap_or(current.len());
                  if end < current.len() {
                      let width =
                          if bytes[end] == b'\r' && bytes.get(end + 1) == Some(&b'\n') {
                              2
                          } else {
                              1
                          };
                      rest = Some(&current[end + width..]);
                  }
                  Some(&current[..end])
              })
          }
          """,
          )

          insert_before(
              "crates/fub-format-markdown/tests/spans_and_terminators.rs",
              "#[test]\nfn reference_definitions_in_containers_keep_inline_spans() {\n",
              r"""#[test]
          fn reference_definitions_in_containers_accept_crlf() {
              let source = "> [rif]: nota.md\r\n> testo [[Dest]]\r\n";
              let doc = parse(source);
              let link = doc
                  .links
                  .iter()
                  .find(|link| matches!(&link.target, LinkTarget::Wiki { page, .. } if page == "Dest"))
                  .expect("il wikilink dopo la definizione c'è");
              assert_eq!(slice(source, link.span), "[[Dest]]");
          }

          """,
          )

          insert_before(
              "crates/fub-host/src/vaults.rs",
              "/// Il registro, con il file su cui vive.\n",
              r"""#[derive(Serialize)]
          struct RegistryFileWrite<'a> {
              version: SchemaVersion,
              vaults: &'a [VaultEntry],
          }

          """,
          )

          replace_once(
              "crates/fub-host/src/vaults.rs",
              r"""    pub fn last_opened(&self) -> Option<VaultEntry> {
                  self.in_recency_order().into_iter().next()
              }
          """,
              r"""    pub fn last_opened(&self) -> Option<VaultEntry> {
                  let Ok(entries) = self.entries.read() else {
                      return None;
                  };
                  entries
                      .iter()
                      .min_by(|a, b| {
                          b.last_opened
                              .cmp(&a.last_opened)
                              .then_with(|| a.root.cmp(&b.root))
                      })
                      .cloned()
              }
          """,
          )

          replace_once(
              "crates/fub-host/src/vaults.rs",
              "        self.update(root, |entry| entry.keys_seen = keys.clone())\n",
              "        self.update(root, move |entry| entry.keys_seen = keys)\n",
          )

          replace_once(
              "crates/fub-host/src/vaults.rs",
              r"""        self.update(root, |entry| {
                      entry.icon = icon.clone();
                      entry.name = name.clone();
                  })
          """,
              r"""        self.update(root, move |entry| {
                      entry.icon = icon;
                      entry.name = name;
                  })
          """,
          )

          replace_once(
              "crates/fub-host/src/vaults.rs",
              r"""fn encode(entries: &[VaultEntry]) -> Result<Vec<u8>, String> {
              let file = RegistryFile {
                  version: SCHEMA_VERSION,
                  vaults: entries.to_vec(),
              };
              serde_json::to_vec_pretty(&file).map_err(|and| and.to_string())
          }
          """,
              r"""fn encode(entries: &[VaultEntry]) -> Result<Vec<u8>, String> {
              let file = RegistryFileWrite {
                  version: SCHEMA_VERSION,
                  vaults: entries,
              };
              serde_json::to_vec_pretty(&file).map_err(|and| and.to_string())
