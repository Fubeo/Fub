name: Stabilizza il banco visivo una volta

on:
  push:
    branches:
      - codex/ci-visual-green

permissions:
  contents: write

concurrency:
  group: codex-ci-visual-stability
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/ci-visual-green
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Neutralizza il puntatore prima di ogni fotografia
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/bench/stage.mjs")
          source = path.read_text(encoding="utf-8")
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == "await scene.prepare(page);"]

          if len(matches) != 1:
              raise SystemExit(f"Attesa una sola chiamata a scene.prepare, trovate: {len(matches)}")

          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          pointer_line = f"{indent}await page.mouse.move(0, 0);"
          if pointer_line not in lines:
              lines[index + 1:index + 1] = [
                  f"{indent}// I gesti di Playwright lasciano il puntatore sopra l'ultimo controllo.",
                  f"{indent}// Un tooltip con ritardo può così comparire fra i due scatti a seconda",
                  f"{indent}// del carico del runner. Lo spostiamo in un angolo neutro: il banco",
                  f"{indent}// fotografa lo stato preparato, non un hover accidentale.",
                  pointer_line,
              ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Installa il browser pinnato dal lock
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Rigenera le baseline sul runner Linux canonico
        run: npm run bench:update
        working-directory: frontend
      - name: Verifica la prima corsa indipendente
        run: npm run bench:verify
        working-directory: frontend
      - name: Verifica una seconda corsa indipendente
        run: npm run bench:verify
        working-directory: frontend
      - name: Registra la stabilizzazione e le baseline
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bench/stage.mjs frontend/bench/baseline
          git commit -m "test(frontend): neutralizza il puntatore nel banco visivo"
          git push origin HEAD:codex/ci-visual-green
