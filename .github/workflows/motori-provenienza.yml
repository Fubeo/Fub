name: Motori provenienza

# La provenienza delle copie in `vendor/`. Due specie: i motori Craft di
# `tools/vendor-craft/motori.mjs` e i dati di `tools/vendor-craft/dati.mjs`
# (un file singolo da un URL fisso). Ogni cartella di `vendor/` deve essere
# l'una o l'altra (`provenienza.mjs elenco`), altrimenti è rosso.
#
# I motori: `vendor.mjs check` in `ci.yml` confronta la copia soltanto con il
# suo `upstream.lock`, nello stesso checkout: una PR che riscrive insieme i file
# e il lock passa di lì. Qui `verify-upstream` riscarica dall'upstream la
# revisione del lock e ne confronta le impronte, prima e dopo le patch (audit
# del 2026-10-30, M17).
#
# I dati: `provenienza.mjs check` in `ci.yml` confronta il file soltanto con lo
# sha256 di `dati.mjs`, nello stesso checkout. Qui `provenienza.mjs <dato>
# verify-upstream` riscarica l'URL e confronta lo sha256 con quello del file
# nel checkout. Sul cron settimanale un'impronta diversa vuol dire che
# l'upstream è cambiato: il messaggio dice come aggiornare la copia.
#
# Sulle PR lo strumento (`tools/vendor-craft/`, con i percorsi gestiti di
# `motori.mjs` e gli URL di `dati.mjs`), il repository dell'upstream e il
# mirror vengono dalla **base**, non dalla PR: una PR che riscrive insieme
# copia, lock e strumento non si verifica da sola. Una PR che cambia
# repository o mirror di un motore, o l'URL di un dato, fallisce qui, perché
# cambiare da dove viene una copia è una decisione da guardare a parte. Una
# copia nuova, che nella base non c'è, si verifica con lo strumento della PR,
# e lo dice con un avviso.
#
# Solo lettura, nessun segreto e nessuna credenziale nel checkout.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
  pull_request:
    paths:
      - "vendor/**"
      - "tools/vendor-craft/**"
      - ".github/workflows/motori-provenienza.yml"

permissions:
  contents: read

concurrency:
  group: motori-provenienza-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Su una PR il codice della PR non sceglie che cosa si verifica. L'elenco
  # della base lo calcola lo strumento della base, nel primo passo, prima che
  # giri un byte della PR. Quello della PR (le copie nuove e le cartelle non
  # dichiarate) nel passo dopo, che importa `motori.mjs` e `dati.mjs` della PR.
  # L'unione la fa il job `matrice`, su un'altra macchina e senza checkout: un
  # passo della PR può scrivere `GITHUB_ENV` o `GITHUB_PATH` per i passi che lo
  # seguono nello stesso job, ma non l'esito di un passo già chiuso né un altro
  # job.
  motori:
    name: i motori di vendor
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.elenco }}
      pr: ${{ steps.elenco.outputs.elenco }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      # Lo strumento, `motori.mjs` e `dati.mjs` della base, estratti in una
      # cartella a parte: nessun file della PR viene eseguito. Le cartelle di
      # `vendor/` le controlla il passo dopo, sulla PR.
      - name: elenco della base, con lo strumento della base
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "$BASE"
          if ! git cat-file -e "$BASE:tools/vendor-craft/provenienza.mjs" 2>/dev/null; then
            echo "::error::la base non ha tools/vendor-craft/provenienza.mjs: l'elenco non ha uno strumento fidato"
            exit 1
          fi
          base="$RUNNER_TEMP/base"
          mkdir -p "$base/vuota"
          git archive "$BASE" tools/vendor-craft | tar -x -C "$base"
          elenco=$(node "$base/tools/vendor-craft/provenienza.mjs" elenco --vendor "$base/vuota")
          echo "elenco=$elenco" >> "$GITHUB_OUTPUT"
          echo "base: $elenco"
      # Gli elenchi vengono da `motori.mjs` e `dati.mjs`, gli stessi di
      # `vendor.mjs check` e `provenienza.mjs check`: una copia nuova entra qui
      # senza toccare questo file. Su una PR lo strumento è quello della base e
      # i file sono quelli della PR più quelli della base, così togliere una
      # voce dall'elenco non la toglie dalla verifica; e ogni cartella di
      # `vendor/` deve essere un motore o un dato.
      - name: elenco da motori.mjs e dati.mjs
        id: elenco
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          strumento=tools/vendor-craft/provenienza.mjs
          argomenti=(--motori tools/vendor-craft/motori.mjs --dati tools/vendor-craft/dati.mjs)
          if [ "$EVENTO" = pull_request ]; then
            base="$RUNNER_TEMP/base/tools/vendor-craft"
            strumento="$base/provenienza.mjs"
            argomenti+=(--motori "$base/motori.mjs" --dati "$base/dati.mjs")
          fi
          elenco=$(node "$strumento" elenco --vendor "$PWD/vendor" "${argomenti[@]}")
          echo "elenco=$elenco" >> "$GITHUB_OUTPUT"
          echo "elenco: $elenco"

  # L'unione degli elenchi, senza checkout e senza codice del repository. Un
  # nome che non può essere una cartella di `vendor/` è rosso.
  matrice:
    name: le matrici della verifica
    needs: motori
    runs-on: ubuntu-latest
    outputs:
      elenco: ${{ steps.unione.outputs.elenco }}
      dati: ${{ steps.unione.outputs.dati }}
    steps:
      - name: unione della base e della PR
        id: unione
        env:
          BASE: ${{ needs.motori.outputs.base }}
          PR: ${{ needs.motori.outputs.pr }}
        run: |
          set -euo pipefail
          vuoto='{"motori":[],"dati":[]}'
          unione() {
            jq -cn --argjson a "${BASE:-$vuoto}" --argjson b "${PR:-$vuoto}" --arg campo "$1" '
              [$a, $b] | map(.[$campo] // error("manca " + $campo)) | add | unique
              | if all(.[]; type == "string" and test("^[a-z0-9][a-z0-9._-]*$")) then .
                else error("un nome di " + $campo + " non è una cartella di vendor") end'
          }
          elenco=$(unione motori)
          dati=$(unione dati)
          echo "elenco=$elenco" >> "$GITHUB_OUTPUT"
          echo "dati=$dati" >> "$GITHUB_OUTPUT"
          echo "motori: $elenco"
          echo "dati: $dati"

  verifica:
    name: provenienza di ${{ matrix.motore }}
    needs: matrice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        motore: ${{ fromJSON(needs.matrice.outputs.elenco) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      - name: verify-upstream
        env:
          MOTORE: ${{ matrix.motore }}
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          lock="vendor/$MOTORE/upstream.lock"
          campo() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p"; }
          # Un errore di rete non è una provenienza sbagliata: un secondo
          # tentativo, poi rosso. Un'impronta diversa fallisce tutte e due.
          verifica() {
            node tools/vendor-craft/vendor.mjs "$MOTORE" verify-upstream "$@" && return 0
            echo "::warning::verify-upstream di $MOTORE non è riuscito, un secondo tentativo fra 30 s"
            sleep 30
            node tools/vendor-craft/vendor.mjs "$MOTORE" verify-upstream "$@"
          }
          if [ "$EVENTO" != pull_request ]; then
            verifica
            exit 0
          fi
          if [ ! -f "$lock" ]; then
            echo "$MOTORE non c'è più nella PR: niente da verificare"
            exit 0
          fi
          git fetch --quiet --no-tags --depth=1 origin "$BASE"
          if ! base=$(git show "$BASE:$lock" 2>/dev/null); then
            echo "::warning::$MOTORE non c'è nella base: si verifica con lo strumento e il lock della PR"
            verifica
            exit 0
          fi
          # Lo strumento e i percorsi gestiti della base, sulla copia e sul lock
          # della PR.
          rm -rf tools/vendor-craft
          git checkout "$BASE" -- tools/vendor-craft
          repo=$(printf '%s\n' "$base" | campo repository)
          mirror=$(printf '%s\n' "$base" | campo mirror)
          if [ "$(campo repository < "$lock")" != "$repo" ] || [ "$(campo mirror < "$lock")" != "$mirror" ]; then
            echo "::error file=$lock::la PR cambia repository o mirror di $MOTORE: la provenienza si verifica contro la base ($repo, $mirror)"
            exit 1
          fi
          verifica --source "$repo"
          if [ -n "$mirror" ]; then verifica --source "$mirror"; fi

  dati:
    name: provenienza del dato ${{ matrix.dato }}
    needs: matrice
    # Una matrice vuota è un errore di GitHub, non una verifica.
    if: needs.matrice.outputs.dati != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dato: ${{ fromJSON(needs.matrice.outputs.dati) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
      # Il secondo tentativo su un errore di rete è dentro lo script (uscita
      # 2 se fallisce anche quello); un'impronta diversa è rossa subito.
      - name: verify-upstream
        env:
          DATO: ${{ matrix.dato }}
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Il percorso e il nome passano come argomenti, mai dentro il codice.
          url() {
            node --input-type=module -e '
              import { pathToFileURL } from "node:url";
              const { DATI } = await import(pathToFileURL(process.argv[1]).href);
              console.log(DATI[process.argv[2]]?.url ?? "");
            ' "$1" "$DATO"
          }
          if [ "$EVENTO" != pull_request ]; then
            node tools/vendor-craft/provenienza.mjs "$DATO" verify-upstream
            exit 0
          fi
          if [ ! -d "vendor/$DATO" ]; then
            echo "$DATO non c'è più nella PR: niente da verificare"
            exit 0
          fi
          git fetch --quiet --no-tags --depth=1 origin "$BASE"
          base=""
          if git show "$BASE:tools/vendor-craft/dati.mjs" > "$RUNNER_TEMP/dati-base.mjs" 2>/dev/null \
            && git cat-file -e "$BASE:tools/vendor-craft/provenienza.mjs" 2>/dev/null; then
            base=$(url "$RUNNER_TEMP/dati-base.mjs")
          fi
          if [ -z "$base" ]; then
            echo "::warning::$DATO non c'è nella base: si verifica con lo strumento e l'elenco della PR"
            node tools/vendor-craft/provenienza.mjs "$DATO" verify-upstream
            exit 0
          fi
          # Lo strumento e l'URL della base, sulla copia della PR. Il
          # `dati.mjs` della PR è codice della PR: gira soltanto dopo la
          # verifica, così non può toccare lo strumento prima che parta.
          cp tools/vendor-craft/dati.mjs "$RUNNER_TEMP/dati-pr.mjs"
          rm -rf tools/vendor-craft
          git checkout "$BASE" -- tools/vendor-craft
          esito=0
          node tools/vendor-craft/provenienza.mjs "$DATO" verify-upstream || esito=$?
          if [ "$(url "$RUNNER_TEMP/dati-pr.mjs")" != "$base" ]; then
            echo "::error file=tools/vendor-craft/dati.mjs::la PR cambia l'URL di $DATO: la provenienza si verifica contro la base ($base)"
            exit 1
          fi
          exit "$esito"
