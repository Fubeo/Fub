name: Rilascio

# Un tag `vX.Y.Z` costruisce gli installer desktop per Linux e Windows e li
# carica, con il loro SHA-256 e un'attestazione di provenienza, in una release
# **bozza**: la pubblica una persona, dopo averli provati
# (docs/development/versioning-and-releases.md). `workflow_dispatch`
# costruisce gli stessi installer senza release, come artefatti della corsa.
#
# Il cancello (`check-release-gate.mjs`) viene prima di ogni build: il commit
# deve avere una corsa di CI verde e completa, e un tag del canale stabile
# (`vX.Y.Z` senza suffisso) deve avere i segreti di firma di Windows.
# Una prerelease (`vX.Y.Z-rc.1`) può uscire senza firme, e le note lo dicono.
# Linux ha anche il `.flatpak` (packaging/flatpak/): il codice dei terzi
# (contenitore e generatori) gira solo nei job a sola lettura, e la release la
# tocca un job a parte con le sole azioni ufficiali.
# Ogni installer, su ogni piattaforma, ha un'attestazione Sigstore legata a
# commit e workflow, che `gh attestation verify` controlla.
#
# macOS è in pausa (docs/decisions/0245-macos-e-ios-in-pausa.md): niente `.dmg`
# e niente firma Apple. Il job per macOS (la riga `macos-latest` della matrice,
# il passo «la firma Apple, soltanto se i segreti ci sono», i `.dmg` raccolti e
# attestati, i segreti `APPLE_*` del cancello) è nel commit che ha messo in
# pausa macOS: `git log -S macos-latest -- .github/workflows/release.yml`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: cancello, versione e release bozza
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: il tag e le versioni dicono lo stesso numero
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node .github/scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          else
            node .github/scripts/check-release-version.mjs
          fi
      - name: il commit ha passato la CI per intero
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-release-gate.mjs ci "$GITHUB_SHA"
      - name: il canale stabile ha le firme che promette
        if: github.ref_type == 'tag'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node .github/scripts/check-release-gate.mjs signing "$GITHUB_REF_NAME"
      # Una release già pubblicata è immutabile: la corsa si ferma invece di
      # toccarne gli asset.
      - name: release bozza, se non c'è già
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "la release $GITHUB_REF_NAME è già pubblicata: i suoi asset non si sostituiscono"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Fub ${GITHUB_REF_NAME#v}" --generate-notes \
              --notes "Ogni installer ha accanto il suo .sha256 e un'attestazione di provenienza: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`. Le prerelease possono non essere firmate."
          fi

  build:
    name: installer (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Dipendenze di sistema di Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Installa esattamente il lockfile del frontend
        working-directory: apps/client
        run: npm ci
      # La stessa versione di `tauri` nel lockfile: la CLI legge la config con
      # il suo schema, quindi resta alla versione della libreria.
      - name: Tauri CLI 2.11.5
        run: cargo install tauri-cli --version "=2.11.5" --locked
      # Authenticode: il certificato (PFX in base64) entra nell'archivio
      # dell'utente del runner e Tauri firma con la sua impronta. Senza segreto
      # non si firma; il cancello ha già fermato un tag stabile.
      - name: la firma Windows, soltanto se il segreto c'è
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          # La chiave decodificata resta su disco il meno possibile: si toglie
          # anche quando l'importazione fallisce.
          $pfx = Join-Path $env:RUNNER_TEMP "fub-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password -ErrorAction Stop
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 4 -Compress
          $path = Join-Path $env:RUNNER_TEMP "fub-signing.json"
          Set-Content -Path $path -Value $config
          "FUB_SIGNING_CONFIG=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Costruisci gli installer
        shell: bash
        run: |
          if [ -n "${FUB_SIGNING_CONFIG:-}" ]; then
            cargo tauri build --config crates/fub-app/tauri.conf.json --config "$FUB_SIGNING_CONFIG"
          else
            cargo tauri build --config crates/fub-app/tauri.conf.json
          fi
      - name: Raccogli gli installer con il loro SHA-256
        shell: bash
        run: |
          mkdir -p dist-release
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist-release/ \;
          cd dist-release
          ls
          [ -n "$(ls)" ] || { echo "nessun installer prodotto"; exit 1; }
          for file in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256";
            else shasum -a 256 "$file" > "$file.sha256"; fi
          done
      # La provenienza lega ogni installer al commit e a questo workflow con un
      # certificato Sigstore: il checksum da solo non dice chi l'ha prodotto.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.AppImage
            dist-release/*.msi
            dist-release/*-setup.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-${{ matrix.os }}
          path: dist-release/
          if-no-files-found: error
      # Niente `--clobber`: un asset che c'è già non si sostituisce, nemmeno da
      # una corsa ripetuta. Per rifare un installer si toglie a mano dalla bozza.
      - name: Carica nella release bozza
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-release/*

  # Le sorgenti offline di Cargo e npm, dai lockfile del commit: il builder
  # di Flatpak non ha la rete. Non stanno nel repository, si rifanno qui.
  flatpak-sorgenti:
    name: Flatpak, sorgenti offline
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Ogni modulo, anche quelli che i tre si portano dietro, alla versione e
      # all'impronta del file di requisiti: un pacchetto cambiato su PyPI non
      # entra.
      - name: i moduli dei generatori, alle versioni e impronte fissate
        run: python -m pip install --require-hashes --only-binary ":all:" -r packaging/flatpak/requisiti-generatori.txt
      - name: genera le sorgenti offline
        run: packaging/flatpak/genera-sorgenti.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flatpak-sorgenti
          path: packaging/flatpak/generated/
          if-no-files-found: error

  # Il .flatpak, nel contenitore ufficiale col builder e il SDK GNOME 51.
  # Il contenitore non ha `gh`: chi tocca la release è il job dopo.
  flatpak:
    name: Flatpak (build)
    needs: flatpak-sorgenti
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    outputs:
      bundle: ${{ steps.nome.outputs.bundle }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-sorgenti
          path: packaging/flatpak/generated/
      # La versione è quella del tag senza `v`; avviato a mano, quella del
      # workspace (check-release-version.mjs ha già detto che coincidono).
      - name: il nome del file
        id: nome
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          fi
          [ -n "$version" ] || { echo "versione non trovata"; exit 1; }
          echo "bundle=Fub-$version-linux-x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.Fubeo.Fub.yml
          bundle: ${{ steps.nome.outputs.bundle }}
          arch: x86_64
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'apps/client/package-lock.json', 'packaging/flatpak/io.github.Fubeo.Fub.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flatpak-bundle
          path: ${{ steps.nome.outputs.bundle }}
          if-no-files-found: error

  # Come gli altri installer: SHA-256, attestazione, artefatto della corsa e,
  # con un tag, la release bozza senza mai sostituire un asset che c'è già.
  flatpak-pubblica:
    name: Flatpak (sha256, provenienza, release)
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-bundle
          path: dist-release/
      - name: lo SHA-256 accanto al file
        working-directory: dist-release
        env:
          BUNDLE: ${{ needs.flatpak.outputs.bundle }}
        run: |
          [ -f "$BUNDLE" ] || { echo "manca $BUNDLE"; exit 1; }
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist-release/*.flatpak
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-flatpak
          path: dist-release/
          if-no-files-found: error
      - name: Carica nella release bozza
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY"

  verify:
    name: verifica di ciò che la bozza contiene
    needs: [build, flatpak-pubblica]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: digest, provenienza e commit di ogni installer
        env:
          GH_TOKEN: ${{ github.token }}
        # Ogni file della bozza: un installer ha il suo `.sha256`, che nomina
        # proprio lui, e la sua attestazione; un `.sha256` ha il suo
        # installer. Un file in più senza `.sha256` è rosso, non saltato.
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          count=0
          for file in *; do
            if [[ "$file" == *.sha256 ]]; then
              [ -f "${file%.sha256}" ] || { echo "::error::$file non ha il suo installer"; exit 1; }
              continue
            fi
            sum="$file.sha256"
            [ -f "$sum" ] || { echo "::error::$file non ha il suo .sha256"; exit 1; }
            read -r _ nominato < "$sum"
            [ "${nominato#\*}" = "$file" ] || { echo "::error::$sum nomina «$nominato», non $file"; exit 1; }
            sha256sum --check "$sum"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "la bozza non ha installer"; exit 1; }
          echo "$count installer verificati"
