name: Audit patch applier

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
      - name: Verifica anagrafe forte e rejoin prudente
        run: |
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          python .audit-data-integrity-scriptfix.py
          python .audit-data-integrity-rejoinfix.py
          python .audit-data-integrity.py
          python .audit-data-rejoin-tests.py
          cargo fmt --all
          if ! (cargo test -p fub-kernel --test entry_store && cargo test -p fub-kernel --test rejoin && cargo test -p fub-kernel --test the_storage && cargo check -p fub-kernel --all-targets && cargo clippy -p fub-kernel --all-targets -- -D warnings) > /tmp/audit-check.log 2>&1; then
            tail -n 300 /tmp/audit-check.log > .audit-error.txt
            git add .audit-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci(temp): cattura errore integrità anagrafe"
              git push origin HEAD:fix/audit-integration
            fi
            cat .audit-error.txt
            exit 1
          fi
          git rm .audit-data-integrity.py .audit-data-integrity-scriptfix.py .audit-data-integrity-rejoinfix.py .audit-data-rejoin-tests.py
          git rm -f .audit-error.txt || true
          git add crates/fub-kernel/src/storage.rs crates/fub-kernel/src/storage/rooted.rs crates/fub-kernel/src/lib.rs crates/fub-kernel/src/vault.rs crates/fub-kernel/src/entries.rs crates/fub-kernel/src/workspace.rs crates/fub-kernel/tests/entry_store.rs crates/fub-kernel/tests/rejoin.rs
          git commit -m "fix(data): verifica digest e identità nei rejoin"
          git push origin HEAD:fix/audit-integration
# retry 5: structural rejoin test migration
