name: Audit patch applier

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
      - name: Migra Revision a SHA-256 con lettura legacy
        run: |
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          set +e
          python .audit-revision.py > /tmp/revision-script.log 2>&1
          script_status=$?
          set -e
          if [ "$script_status" -ne 0 ]; then
            cat /tmp/revision-script.log
            grep -q "confronto Revision/expected non riconosciuto" /tmp/revision-script.log || exit "$script_status"
          fi
          python .audit-revision-workspace.py
          python .audit-revision-tests.py
          cargo fmt --all
          if ! (cargo test -p fub-abi --lib && cargo test -p fub-kernel --test guarded_write && cargo check -p fub-kernel --all-targets && cargo clippy -p fub-abi -p fub-kernel --all-targets -- -D warnings) > /tmp/audit-check.log 2>&1; then
            tail -n 260 /tmp/audit-check.log > .audit-error.txt
            git add .audit-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci(temp): cattura errore migrazione revisioni"
              git push origin HEAD:fix/audit-integration
            fi
            cat .audit-error.txt
            exit 1
          fi
          git rm .audit-revision.py .audit-revision-workspace.py .audit-revision-tests.py
          git rm -f .audit-error.txt || true
          git add crates/fub-abi/src/edit.rs crates/fub-kernel/src/workspace.rs crates/fub-kernel/tests/guarded_write.rs
          git commit -m "fix(data): usa SHA-256 per le revisioni"
          git push origin HEAD:fix/audit-integration
# retry: migrate legacy literal test
