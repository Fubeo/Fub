name: Audit patch applier

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-apply.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt
      - name: Applica e verifica il backend capability
        run: |
          base64 -d .audit-patch | gzip -d > /tmp/storage-p0.patch
          git apply --check /tmp/storage-p0.patch
          git apply /tmp/storage-p0.patch
          cargo fmt --all
          cargo check -p fub-kernel --all-targets
          cargo test -p fub-kernel --lib storage::rooted::tests
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/fub-kernel/Cargo.toml crates/fub-kernel/src/lib.rs crates/fub-kernel/src/storage.rs crates/fub-kernel/src/storage/rooted.rs crates/fub-kernel/src/vault.rs crates/fub-kernel/src/workspace.rs
          git commit -m "fix(storage): ancora il vault a capability e CAS cooperativa"
          git push origin HEAD:fix/audit-integration
