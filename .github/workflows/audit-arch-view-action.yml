name: Audit ARCH view action outside lock

on:
  push:
    branches: ["fix/audit-integration"]
    paths: [".github/workflows/audit-arch-view-action.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          components: rustfmt, clippy
      - name: Applica e verifica le azioni view staccate
        run: |
          git config user.name "Fubeo audit bot"
          git config user.email "83821420+Fubeo@users.noreply.github.com"
          python .audit-arch-view-action.py
          cargo fmt --all
          if ! (cargo test -p fub-host --test concurrency && cargo test -p fub-host --test one_lock_only && cargo test -p fub-host --test official_views && cargo test -p fub-kernel --test view_trust && cargo test -p fub-kernel --test the_panic && cargo check -p fub-host --all-targets && cargo clippy -p fub-host -p fub-kernel --all-targets -- -D warnings) > /tmp/arch-view-action.log 2>&1; then
            tail -n 400 /tmp/arch-view-action.log > .audit-arch-view-action-error.txt
            git add .audit-arch-view-action-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "ci(temp): cattura errore ARCH view action"
              git push origin HEAD:fix/audit-integration
            fi
            cat .audit-arch-view-action-error.txt
            exit 1
          fi
          git rm -f .audit-arch-view-action.py .github/workflows/audit-arch-view-action.yml
          rm -f .audit-arch-view-action-error.txt
          git add -u
          git add crates/fub-kernel/src/workspace.rs crates/fub-host/src/session.rs crates/fub-host/tests/concurrency.rs
          git commit -m "refactor(host): esegue le azioni delle view fuori dal lock"
          git push origin HEAD:fix/audit-integration
