name: Riparazione client unificato

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt

      - name: Dipendenze native di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Riallinea ogni riferimento al percorso del client
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Fubeo"
          git config user.email "83821420+Fubeo@users.noreply.github.com"

          export OLD_CLIENT_PATH="$(printf 'front%s/' 'end')"
          export NEW_CLIENT_PATH="apps/client/"

          python3 <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          old = os.environ["OLD_CLIENT_PATH"]
          new = os.environ["NEW_CLIENT_PATH"]
          found = subprocess.run(
              ["git", "grep", "-Ilz", old, "--", "."],
              check=False,
              stdout=subprocess.PIPE,
          ).stdout

          for raw in found.split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode())
              before = path.read_text(encoding="utf-8")
              after = before.replace(old, new)
              if after != before:
                  path.write_text(after, encoding="utf-8")
          PY

          cat > apps/client/src/main.ts <<'EOF'
          // Vite entra da qui. La logica di avvio appartiene alla shell scelta.
          export { startup } from "./desktop-shell";
          import "./entrypoints/desktop";
          EOF

          if git grep -n "$OLD_CLIENT_PATH" -- .; then
            echo "Restano riferimenti al vecchio percorso del client." >&2
            exit 1
          fi

          git diff --check

      - name: Verifica la documentazione
        run: |
          node .github/scripts/check-doc-links.mjs
          node .github/scripts/check-doc-orphans.mjs
          node .github/scripts/check-doc-size.mjs
          node .github/scripts/check-markdown-style.mjs
          node .github/scripts/check-mermaid.mjs
          node .github/scripts/check-prose.mjs --self-test
          node .github/scripts/check-prose.mjs
          node .github/scripts/check-tables.mjs --autoprova
          node .github/scripts/check-tables.mjs

      - name: Verifica il client
        working-directory: apps/client
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run theme:verify

      - name: Verifica l'intero workspace Rust
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
          cargo fmt --all --check
          cargo test --workspace

      - name: Registra la riparazione e rimuove il workflow temporaneo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/repair-unified-client.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(repo): riallinea i riferimenti al client unificato"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
