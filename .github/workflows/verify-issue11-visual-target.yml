name: Verify issue11 visual target

on:
  push:
    branches:
      - fix/issue11-close-surface-guards

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 9139c1b05c5481f88199ea77b7c15277651416b5
      - name: verifica lo SHA esercitato
        run: test "$(git rev-parse HEAD)" = "9139c1b05c5481f88199ea77b7c15277651416b5"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - run: npm run typecheck
        working-directory: apps/client
      - run: npm test
        working-directory: apps/client
      - run: npm run build
        working-directory: apps/client
      - run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: banco visuale Grid
        id: bench
        continue-on-error: true
        run: npm run bench:verify
        working-directory: apps/client
      - name: accessibilità con scena Grid
        run: npm run bench:a11y
        working-directory: apps/client
      - name: artifact del banco
        if: ${{ steps.bench.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verify-issue11-visual-9139c1b
          path: apps/client/bench/.output/
          include-hidden-files: true
          if-no-files-found: error
      - name: propaga l'esito del banco
        if: ${{ steps.bench.outcome == 'failure' }}
        run: exit 1
