name: Audit ARCH index feed

on:
  push:
    branches: ["fix/audit-integration"]
    paths:
      - ".github/workflows/audit-arch-index-feed-probe.yml"
      - ".audit-arch-index-feed-probe.py"
      - ".audit-arch-index-feed-fix.py"
      - ".audit-arch-index-feed-compilefix.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/audit-integration
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: applica fix e probe
        run: |
          python3 .audit-arch-index-feed-fix.py
          python3 .audit-arch-index-feed-compilefix.py
          python3 .audit-arch-index-feed-probe.py
      - name: format
        run: cargo fmt --all
      - name: regressione ARCH index feed
        run: cargo test -p fub-host --test audit_index_feed -- --nocapture
      - name: regressioni indici e host
        run: |
          cargo test -p fub-kernel --test index_feeding
          cargo test -p fub-host --test concurrency
      - name: check
        run: cargo check -p fub-kernel -p fub-host --all-targets
      - name: clippy
        run: cargo clippy -p fub-kernel -p fub-host --all-targets -- -D warnings
      - name: crea checkpoint semantico
        run: |
          rm -f crates/fub-host/tests/audit_index_feed.rs
          git rm -f --ignore-unmatch .audit-error.txt .audit-arch-index-feed-probe.py .audit-arch-index-feed-fix.py .audit-arch-index-feed-compilefix.py .github/workflows/audit-arch-index-feed-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fub-kernel/src/index/mod.rs crates/fub-kernel/src/index/plan.rs crates/fub-kernel/src/workspace.rs crates/fub-host/src/session.rs
          git commit -m "refactor(host): esegue il feed degli indici fuori dal lock"
          git push origin HEAD:fix/audit-integration
