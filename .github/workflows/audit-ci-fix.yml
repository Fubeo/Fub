name: Audit CI fix

'on':
  push:
    branches:
      - fix/audit-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Applica le patch fail-closed
        run: |
          for patch in \
            .audit-ci-fix.patch \
            .audit-ci-fix-undo.patch \
            .audit-ci-fix-switches.patch \
            .audit-ci-fix-entries.patch \
            .audit-ci-fix-stamp-storage.patch \
            .audit-ci-fix-stamp-rooted.patch \
            .audit-ci-fix-stamp-vault.patch \
            .audit-ci-fix-stamp-entries.patch \
            .audit-ci-fix-stamp-workspace.patch
          do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: Centralizza la policy del veleno dei provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              seen = text.count(old)
              if seen != expected:
                  raise SystemExit(f"{path}: attesi {expected} anchor, trovati {seen}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          def remove_local_poison_policy(path, expected):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"\n[ \t]*\.unwrap_or_else\(\|poisoned\| poisoned\.into_inner\(\)\)"
              )
              seen = len(pattern.findall(text))
              if seen != expected:
                  raise SystemExit(
                      f"{path}: attese {expected} policy locali di poison, trovate {seen}"
                  )
              file.write_text(pattern.sub("", text), encoding="utf-8")

          index = "crates/fub-kernel/src/index/mod.rs"
          replace_exact(index, "use std::sync::{Arc, RwLock};", "use std::sync::Arc;")
          replace_exact(
              index,
              "pub(crate) type SharedIndexProvider = Arc<RwLock<Box<dyn IndexProvider>>>;",
              "pub(crate) type SharedIndexProvider = Arc<crate::poison::SharedShelter<Box<dyn IndexProvider>>>;",
          )
          remove_local_poison_policy(index, 5)

          providers = "crates/fub-kernel/src/providers.rs"
          replace_exact(providers, "use std::sync::{Arc, RwLock};", "use std::sync::Arc;")
          replace_exact(
              providers,
              "use crate::plugins::{PluginInfo, PluginRegistry, RegistrationKind, RegistryError};",
              "use crate::plugins::{PluginInfo, PluginRegistry, RegistrationKind, RegistryError};\nuse crate::poison::SharedShelter;",
          )
          replace_exact(
              providers,
              "pub(crate) provider: Arc<RwLock<Box<dyn ViewProvider>>>,",
              "pub(crate) provider: Arc<SharedShelter<Box<dyn ViewProvider>>>,",
          )
          remove_local_poison_policy(providers, 1)

          workspace = "crates/fub-kernel/src/workspace.rs"
          replace_exact(workspace, "use std::sync::{Arc, RwLock};", "use std::sync::Arc;")
          replace_exact(
              workspace,
              "use crate::poison::Shelter;",
              "use crate::poison::{SharedShelter, Shelter};",
          )
          replace_exact(
              workspace,
              "provider: Arc<RwLock<Box<dyn ViewProvider>>>,",
              "provider: Arc<SharedShelter<Box<dyn ViewProvider>>>,",
              expected=2,
          )
          replace_exact(
              workspace,
              "std::sync::Arc::new(std::sync::RwLock::new(index))",
              "Arc::new(SharedShelter::new(index))",
          )
          replace_exact(
              workspace,
              "Arc::new(RwLock::new(provider))",
              "Arc::new(SharedShelter::new(provider))",
          )
          remove_local_poison_policy(workspace, 5)
          PY
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Formato, invarianti e fixture mirate
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo test -p fub-abi --test dependency_invariant
          cargo test -p fub-abi --test a_named_rule_is_declared
          cargo test -p fub-app --test schemas_on_disk
          UPDATE_MIRROR=1 cargo test -p fub-features --test ts_mirror
          cargo test -p fub-features --test ts_mirror
          cargo test -p fub-features --test undo a_panic_inside_a_undo_does_not_carries_via_the_stack
          cargo test -p fub-host --test switches a_permission_denied_survives_to_the_shutdown_and_to_the_reopening
          cargo test -p fub-kernel --lib entries::tests
          cargo test -p fub-kernel --test rejoin
          cargo test -p fub-kernel --test entry_store
          cargo test -p fub-kernel --test entry_store_closes_with_the_vault
          cargo test -p fub-kernel --test kernel_poison
          cargo check -p fub-kernel --lib --target x86_64-pc-windows-gnu
      - name: Clippy completo
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prepara il bersaglio dei componenti
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path esempi/ping-wasm/Cargo.toml --target wasm32-wasip2
      - name: Test Rust Ubuntu
        id: rust_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee .audit-rust-test.log
      - name: Cattura il rosso Rust
        if: failure() && steps.rust_tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 500 .audit-rust-test.log > .audit-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(temp): cattura errore CI Rust" -- .audit-error.txt
            git push origin HEAD:fix/audit-integration
          fi
      - name: Test client
        if: steps.rust_tests.outcome == 'success'
        working-directory: apps/client
        run: |
          npm ci
          npm test
      - name: Checkpoint semantico e cleanup
        if: steps.rust_tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .audit-ci-fix.patch .audit-ci-fix-undo.patch .audit-ci-fix-switches.patch .audit-ci-fix-entries.patch \
                 .audit-ci-fix-stamp-storage.patch .audit-ci-fix-stamp-rooted.patch \
                 .audit-ci-fix-stamp-vault.patch .audit-ci-fix-stamp-entries.patch \
                 .audit-ci-fix-stamp-workspace.patch .github/workflows/audit-ci-fix.yml
          if git ls-files --error-unmatch .audit-error.txt >/dev/null 2>&1; then
            git rm -f .audit-error.txt
          else
            rm -f .audit-error.txt
          fi
          rm -f .audit-rust-test.log
          git add crates/fub-app/src/lib.rs \
                  crates/fub-kernel/Cargo.toml \
                  crates/fub-kernel/src/storage.rs \
                  crates/fub-kernel/src/storage/rooted.rs \
                  crates/fub-kernel/src/vault.rs \
                  crates/fub-kernel/src/workspace.rs \
                  crates/fub-kernel/src/entries.rs \
                  crates/fub-kernel/src/index/mod.rs \
                  crates/fub-kernel/src/providers.rs \
                  crates/fub-abi/tests/dependency_invariant.rs \
                  crates/fub-abi/tests/a_named_rule_is_declared.rs \
                  crates/fub-features/tests/undo.rs \
                  crates/fub-host/tests/switches.rs \
                  apps/client/src/ui/node.test.ts \
                  apps/client/src/__fixtures__/mirror-samples.json \
                  docs/development/versioning-and-releases.md
          git commit -m "fix(ci): riallinea i presidi della branch"
          git push origin HEAD:fix/audit-integration
