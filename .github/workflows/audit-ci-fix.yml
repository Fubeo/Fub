name: Audit CI fix

'on':
  push:
    branches:
      - fix/audit-integration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Applica la patch fail-closed
        run: |
          git apply --check .audit-ci-fix.patch
          git apply .audit-ci-fix.patch
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Dipendenze di sistema di Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Formato e invarianti mirati
        run: |
          cargo fmt --all --check
          cargo test -p fub-abi --test dependency_invariant
          cargo test -p fub-abi --test a_named_rule_is_declared
      - name: Clippy completo
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust Ubuntu
        run: cargo test --workspace
      - name: Test client
        working-directory: apps/client
        run: |
          npm ci
          npm test
      - name: Checkpoint semantico e cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .audit-ci-fix.patch .github/workflows/audit-ci-fix.yml
          git add crates/fub-app/src/lib.rs \
                  crates/fub-kernel/Cargo.toml \
                  crates/fub-abi/tests/dependency_invariant.rs \
                  crates/fub-abi/tests/a_named_rule_is_declared.rs \
                  apps/client/src/ui/node.test.ts
          git commit -m "fix(ci): riallinea i presidi della branch"
          git push origin HEAD:fix/audit-integration
