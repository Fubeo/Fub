name: Verify native sheet patch

on:
  push:
    branches: [feat/issue11-grid-window-session]
    paths: [.github/workflows/sheet-apply.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'Fubeo/Fub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verifica la base prima di applicare la patch
        run: test "$(git rev-parse HEAD^)" = f35963c88ed62358d781258038a2e9933401fded
      - name: Applica soltanto la patch locale identificata dal digest
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          data = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'fce10a4c717328698d0cff707a844b27154ff9247de879b0be3a759f107be7ae'
          patch = pathlib.Path('/tmp/native-session.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(patch)], check=True)
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy -p fub-format-sheet -p fub-host --all-targets -- -D warnings
      - run: cargo test -p fub-format-sheet -p fub-host -p fub-abi --no-fail-fast
      - name: Pubblica solo con avanzamento lineare del branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sheet): applica patch atomiche e invalida le finestre'
          git push origin HEAD:refs/heads/feat/issue11-grid-window-session
