name: Sheet session verification

on:
  push:
    branches: [feat/issue11-grid-window-session]

# Verifica i sorgenti committati; non applica payload e non pubblica codice.
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy -p fub-format-sheet -p fub-host --all-targets --locked -- -D warnings
      - run: cargo test -p fub-format-sheet -p fub-host --locked --no-fail-fast
      - run: cargo check -p fub-format-sheet --target wasm32-wasip2 --locked

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        working-directory: apps/client
      - name: Browser alla revisione del lockfile
        id: browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: Accessibilita indipendente dal confronto visuale
        id: a11y
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run bench:a11y
        working-directory: apps/client
      - name: Confronto visuale indipendente dall'accessibilita
        id: visual
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run bench:verify
        working-directory: apps/client
      - name: Referti di entrambi i banchi
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sheet-browser-${{ github.sha }}
          path: apps/client/bench/.output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
