# Fub — workspace virtuale.
# Architettura: core agnostico (fub-kernel) + contratto unico (fub-abi).
# Il markdown è solo il PRIMO provider (fub-format-markdown); il WASM
# per i plugin di terzi arriva a M5 (fub-wasm-host, non ancora presente).
[workspace]
resolver = "2"
members = [
    "crates/fub-abi",
    "crates/fub-kernel",
    "crates/fub-sdk",
    "crates/fub-testkit",
    "crates/fub-format-markdown",
    "crates/fub-features",
    "crates/fub-host",
    "crates/fub-app",
    # "crates/fub-wasm-host", # M5: host wasmtime per plugin di terzi
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Versioni condivise: un solo punto di verità per l'intero workspace.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: il frontmatter proiettato su JSON mantiene l'ordine delle
# chiavi del file dell'utente — riscriverlo non deve riordinarle (fedeltà).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
camino = { version = "1", features = ["serde1"] }
# La cartella usa-e-getta dei test. Non è una dipendenza della libreria — nei
# crate compare quasi sempre fra i `[dev-dependencies]` — ma era dichiarata con
# la versione scritta a mano in cinque `Cargo.toml`, e cinque posti da toccare
# per un `cargo update` sono quattro di troppo: la prima riga dimenticata
# diventa una seconda versione di `tempfile` nell'albero senza che nessuno lo
# scelga. Presidiata da `.github/scripts/check-cargo-versioni.mjs`.
tempfile = "3.27.0"
# Il vocabolario del log (§17.3, decisione 0062). **Era già nell'albero** —
# 0.1.44, tirato da tauri — e prenderlo come dipendenza diretta non aggiunge un
# crate: aggiunge un nome che descrive una cosa che c'era. Il collettore invece
# è scritto in casa (`fub_kernel::log`): `tracing-subscriber` costerebbe quattro
# crate nuovi per un formattatore che riscriveremmo e un `env-filter` che la
# decisione 0036 ha deciso di non volere.
#
# `default-features = false` non è prudenza generica: le feature di default di
# `tracing` sono `std` + `attributes`, e la seconda tira `tracing-attributes`,
# che è il proc-macro di `#[instrument]`. Misurato: con i default, `cargo` dice
# «Adding tracing-attributes v0.1.31» — cioè un crate nuovo davvero, e la frase
# qui sopra sarebbe stata falsa. Span non ne apriamo (vedi `fub_kernel::log`),
# quindi `#[instrument]` non serve, e senza di lui il conto torna: zero.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Dipendenze interne. La `version` accanto al `path` non cambia la risoluzione
# locale (il path vince sempre): serve perché un `path` nudo è una dipendenza
# `*`, cioè una build non riproducibile per chiunque non abbia questo albero, e
# perché senza di essa nessuno di questi crate si può pubblicare — il che
# renderebbe irraggiungibile proprio ciò che deve essere raggiungibile da fuori
# (`fub-abi` e `fub-sdk`, §16.1 del piano). Presidiata da `deny.toml`.
fub-abi = { path = "crates/fub-abi", version = "0.1.0" }
fub-kernel = { path = "crates/fub-kernel", version = "0.1.0" }
fub-sdk = { path = "crates/fub-sdk", version = "0.1.0" }
# Il banco del lato host (§16.2). Va **solo** nei `[dev-dependencies]`: ha il
# kernel fra le mani, e chi lo prendesse come dipendenza normale se lo
# porterebbe dentro la libreria.
fub-testkit = { path = "crates/fub-testkit", version = "0.1.0" }
fub-format-markdown = { path = "crates/fub-format-markdown", version = "0.1.0" }
# `default-features = false` qui, e non nel crate che la usa: da quando ogni
# feature ufficiale ha la propria cargo feature (§16.3) è chi monta a dire quali
# vuole, e cargo ignora un `default-features = false` scritto nel consumatore se
# la riga del workspace non lo dice già.
fub-features = { path = "crates/fub-features", version = "0.1.0", default-features = false }
fub-host = { path = "crates/fub-host", version = "0.1.0" }

# Il profilo di chi lavora. Ogni chiave qui dentro è una decisione, e accanto
# c'è chi la paga: `.github/scripts/check-profilo-dev.mjs` pretende che siano
# queste e non altre.
[profile.dev]
# compilazione più veloce mantenendo debug info utile
opt-level = 0
# L'informazione di debug resta nei `.o` invece di essere **copiata dentro ogni
# eseguibile** (decisione 0145). Non se ne perde un byte — i `.o` stanno accanto
# ai binari in `target/`, e un backtrace continua a stampare file e riga —, ma
# il linker smette di ricopiarla: un eseguibile di prova passa da 62,4 a 25,6 MB
# di mediana e i centotrentasette insieme da 13,8 a 4,9 GB. È la metà del costo
# che il piano attribuiva al **numero** degli eseguibili e che invece stava nel
# **peso** di ognuno: nessuno aveva mai scelto questa riga, era il default.
#
# Il prezzo, dichiarato: l'informazione di debug segue `target/`. Un eseguibile
# copiato fuori di lì resta senza — il che per dei binari di prova e per l'app
# in sviluppo non lo paga nessuno, e per il profilo `release` non vale, perché
# `release` questa riga non ce l'ha.
split-debuginfo = "unpacked"
