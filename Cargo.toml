# FubMD — workspace virtuale.
# Architettura: core agnostico (fubmd-kernel) + contratto unico (fubmd-abi).
# Il markdown è solo il PRIMO provider (fubmd-format-markdown); il WASM
# per i plugin di terzi arriva a M5 (fubmd-wasm-host, non ancora presente).
[workspace]
resolver = "2"
members = [
    "crates/fubmd-abi",
    "crates/fubmd-kernel",
    "crates/fubmd-sdk",
    "crates/fubmd-format-markdown",
    "crates/fubmd-features",
    "crates/fubmd-app",
    # "crates/fubmd-wasm-host", # M5: host wasmtime per plugin di terzi
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

# Versioni condivise: un solo punto di verità per l'intero workspace.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: il frontmatter proiettato su JSON mantiene l'ordine delle
# chiavi del file dell'utente — riscriverlo non deve riordinarle (fedeltà).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
camino = { version = "1", features = ["serde1"] }

# Dipendenze interne. La `version` accanto al `path` non cambia la risoluzione
# locale (il path vince sempre): serve perché un `path` nudo è una dipendenza
# `*`, cioè una build non riproducibile per chiunque non abbia questo albero, e
# perché senza di essa nessuno di questi crate si può pubblicare — il che
# renderebbe irraggiungibile proprio ciò che deve essere raggiungibile da fuori
# (`fubmd-abi` e `fubmd-sdk`, §16.1 del piano). Presidiata da `deny.toml`.
fubmd-abi = { path = "crates/fubmd-abi", version = "0.1.0" }
fubmd-kernel = { path = "crates/fubmd-kernel", version = "0.1.0" }
fubmd-sdk = { path = "crates/fubmd-sdk", version = "0.1.0" }
fubmd-format-markdown = { path = "crates/fubmd-format-markdown", version = "0.1.0" }
fubmd-features = { path = "crates/fubmd-features", version = "0.1.0" }

[profile.dev]
# compilazione più veloce mantenendo debug info utile
opt-level = 0
